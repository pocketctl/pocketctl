name: CI

on:
  pull_request:
  push:
    branches: [develop, master]

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        # Windows 测试有 pre-existing 平台债(C+D: 环境依赖/ws 文件锁/时序),
        # 容忍失败直到清理。build/vet 仍严格。ubuntu/macos 严格(continue-on-error=false)。
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
        env:
          # macos: gopsutil→go-m1cpu 的 C 代码 VLA warning(-Wgnu-folding-constant),
          # 新 clang 在 macos runner 上当 error。-Wno-error 解除 error 化。
          CGO_CFLAGS: "-Wno-error -Wno-gnu-folding-constant"
        run: go test ./...
