name: CI

on:
  pull_request:
  push:
    branches: [develop, master]

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          # Windows 测试有 pre-existing 平台债(/tmp 硬编码、路径分隔符 \ vs /、
          # ws spool 文件锁等,项目测试从没在 Windows CI 跑过)。容忍失败直到
          # 测试债单独清理。编译(build/vet)仍严格要求。
          - os: windows-latest
            test-continue-on-error: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        continue-on-error: ${{ matrix.test-continue-on-error == true }}
        run: go test ./...
