name: OpenCode Official CLI Smoke

on:
  schedule:
    - cron: '43 19 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  official-cli-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Pocketctl client test dependencies
        run: |
          npm ci --prefix relay
          npm ci --prefix web

      - name: Install the current official OpenCode CLI
        run: npm install --global opencode-ai

      - name: Verify the CLI and shared-runtime API surface
        shell: bash
        run: |
          set -euo pipefail
          opencode --version

          smoke_dir="$(mktemp -d /tmp/pocketctl-opencode-smoke.XXXXXX)"
          serve_log=/tmp/opencode-nightly.log
          serve_pid=
          cleanup() {
            status=$?
            if [[ "$status" != "0" ]]; then
              echo "::group::OpenCode serve diagnostics"
              sed -n '1,200p' "$serve_log" 2>/dev/null || true
              echo "::endgroup::"
            fi
            if [[ -n "$serve_pid" ]]; then
              kill "$serve_pid" 2>/dev/null || true
              wait "$serve_pid" 2>/dev/null || true
            fi
            rm -rf "$smoke_dir"
            exit "$status"
          }
          trap cleanup EXIT

          export OPENCODE_SERVER_PASSWORD=nightly-smoke-only
          opencode serve \
            --hostname 127.0.0.1 \
            --port 4096 \
            --pure \
            --print-logs \
            --log-level DEBUG \
            >"$serve_log" 2>&1 &
          serve_pid=$!

          healthy=0
          for _ in {1..60}; do
            if ! kill -0 "$serve_pid" 2>/dev/null; then
              echo "OpenCode serve exited before becoming healthy"
              break
            fi
            if curl \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 1 \
              --max-time 3 \
              --user opencode:nightly-smoke-only \
              http://127.0.0.1:4096/global/health \
              | jq -e '.healthy == true and (.version | type == "string" and length > 0)' >/dev/null; then
              healthy=1
              break
            fi
            sleep 0.25
          done
          if [[ "$healthy" != "1" ]]; then
            echo "OpenCode serve did not become healthy within the bounded retry window"
            exit 1
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --connect-timeout 1 \
            --max-time 5 \
            --user opencode:nightly-smoke-only \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "http://127.0.0.1:4096/session?directory=$smoke_dir" \
            | jq -e '.id | strings | length > 0' >/dev/null

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run Pocketctl managed-runtime compatibility tests
        env:
          POCKETCTL_OPENCODE_SMOKE: '1'
        run: make test-opencode-managed
