name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: darwin
            arch: arm64
          - os: darwin
            arch: amd64
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          VERSION=${GITHUB_REF_NAME:-dev}
          go build -ldflags "-X main.version=$VERSION" -o pocketctl_${{ matrix.os }}_${{ matrix.arch }} ./cmd/pocketctl

      - uses: actions/upload-artifact@v4
        with:
          name: pocketctl_${{ matrix.os }}_${{ matrix.arch }}
          path: pocketctl_${{ matrix.os }}_${{ matrix.arch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets (with SHA256 checksums)
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          # Generate SHA256 checksum files
          cd release
          for f in pocketctl_*; do
            if [ -f "$f" ] && [ "${f##*.}" != "sha256" ]; then
              shasum -a 256 "$f" | awk '{print $1}' > "${f}.sha256"
            fi
          done
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

  upload-gitee-release:
    name: Mirror to Gitee Release
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Mirror to Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "[skip] GITEE_TOKEN secret not configured — skipping Gitee mirror"
            exit 0
          fi

          # Collect artifacts
          find artifacts -type f -exec cp {} /tmp/ \;
          cd /tmp

          API="https://gitee.com/api/v5/repos/muwb123/pocketctl/releases"
          AUTH="Authorization: Bearer ${GITEE_TOKEN}"

          # Build SHA256 files for each binary
          for f in pocketctl_*; do
            if [ -f "$f" ] && [ "${f##*.}" != "sha256" ]; then
              sha256sum "$f" | awk '{print $1}' > "${f}.sha256"
              echo "  ✓ sha256: ${f}.sha256"
            fi
          done

          # Create Gitee Release
          echo "Creating Gitee Release for $TAG ..."
          RESP=$(curl -s -X POST "$API" \
            -H "$AUTH" \
            -H "Content-Type: application/json" \
            -d "{
              \"tag_name\": \"${TAG}\",
              \"name\": \"${TAG}\",
              \"body\": \"Release ${TAG} — see GitHub Release for details: https://github.com/pocketctl/pocketctl/releases/tag/${TAG}\",
              \"target_commitish\": \"master\"
            }")
          echo "Gitee release response: $RESP"

          RELEASE_ID=$(echo "$RESP" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          if [ -z "$RELEASE_ID" ]; then
            echo "⚠️  Failed to create Gitee release (response above). Skipping asset upload."
            exit 0
          fi
          echo "Gitee release ID: $RELEASE_ID"

          # Upload all files (binaries + .sha256)
          for f in pocketctl_*; do
            [ -f "$f" ] || continue
            echo "Uploading $f ..."
            curl -s -X POST "${API}/${RELEASE_ID}/attach_files" \
              -H "$AUTH" \
              -F "file=@${f}" \
              -o /dev/null -w "  ${f} → HTTP %{http_code}\n"
          done
          echo "✅ Gitee Release mirror complete (${TAG})"
