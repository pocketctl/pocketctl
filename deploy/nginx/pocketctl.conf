# pocketctl 生产环境 Nginx 配置
# 独立文件，可单独部署（不依赖 deploy.sh）

# WebSocket upgrade 映射
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP -> HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS 主服务
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # ---- SSL 证书 ----
    ssl_certificate     /etc/ssl/pocketctl/cert.pem;
    ssl_certificate_key /etc/ssl/pocketctl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---- 安全头 ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss:; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- 日志 ----
    access_log /var/log/nginx/pocketctl.access.log;
    error_log  /var/log/nginx/pocketctl.error.log warn;

    # ---- Web 静态文件 ----
    root /var/www/pocketctl;
    index index.html;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- WebSocket 代理 -> Relay ----
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接（24 小时不断开）
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # 消息大小限制
        client_max_body_size 1m;

        # 关闭缓冲，实时转发
        proxy_buffering off;
    }

    # ---- Relay 健康检查 ----
    location /health {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }

    # ---- 安全：禁止访问隐藏文件 ----
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
