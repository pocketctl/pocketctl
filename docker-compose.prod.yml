x-relay-extension-environment: &relay-extension-environment
  RELAY_EXTENSIONS: "${RELAY_EXTENSIONS:?RELAY_EXTENSIONS is required}"
  RELAY_EXTENSION_PROJECTOR_BATCH: "${RELAY_EXTENSION_PROJECTOR_BATCH:-200}"
  RELAY_EXTENSION_FEED_RETENTION_DAYS: "${RELAY_EXTENSION_FEED_RETENTION_DAYS:-7}"
  RELAY_EXTENSION_LEASE_TTL_SECONDS: "${RELAY_EXTENSION_LEASE_TTL_SECONDS:-60}"
  EXTENSION_PROVIDER_JWT_SECRET: "${EXTENSION_PROVIDER_JWT_SECRET:-}"
  EXTENSION_PROVIDER_JWT_SECRET_B64: "${EXTENSION_PROVIDER_JWT_SECRET_B64:-}"
  EXTENSION_CURSOR_SECRET: "${EXTENSION_CURSOR_SECRET:-}"
  EXTENSION_CURSOR_SECRET_B64: "${EXTENSION_CURSOR_SECRET_B64:-}"
  EXTENSION_GRANT_PRIVATE_KEY: "${EXTENSION_GRANT_PRIVATE_KEY:-}"
  EXTENSION_GRANT_PRIVATE_KEY_B64: "${EXTENSION_GRANT_PRIVATE_KEY_B64:-}"
  EXTENSION_GRANT_PUBLIC_KEY: "${EXTENSION_GRANT_PUBLIC_KEY:-}"
  EXTENSION_GRANT_PUBLIC_KEY_B64: "${EXTENSION_GRANT_PUBLIC_KEY_B64:-}"
  EXTENSION_GRANT_KEY_ID: "${EXTENSION_GRANT_KEY_ID:-}"
  EXTENSION_PROVIDER_PUBLIC_ORIGINS: "${EXTENSION_PROVIDER_PUBLIC_ORIGINS:-}"
  RELAY_EXTENSION_RATE_LIMIT_TOKEN: "${RELAY_EXTENSION_RATE_LIMIT_TOKEN:-30}"
  RELAY_EXTENSION_RATE_LIMIT_FEED: "${RELAY_EXTENSION_RATE_LIMIT_FEED:-120}"
  RELAY_EXTENSION_RATE_LIMIT_ACK: "${RELAY_EXTENSION_RATE_LIMIT_ACK:-240}"
  RELAY_EXTENSION_RATE_LIMIT_SNAPSHOT: "${RELAY_EXTENSION_RATE_LIMIT_SNAPSHOT:-60}"
  RELAY_EXTENSION_RATE_LIMIT_STATUS: "${RELAY_EXTENSION_RATE_LIMIT_STATUS:-120}"
  RELAY_EXTENSION_RATE_LIMIT_USAGE: "${RELAY_EXTENSION_RATE_LIMIT_USAGE:-60}"
  RELAY_EXTENSION_RATE_LIMIT_PURGE: "${RELAY_EXTENSION_RATE_LIMIT_PURGE:-60}"
  RELAY_EXTENSION_RATE_LIMIT_GRANT: "${RELAY_EXTENSION_RATE_LIMIT_GRANT:-60}"
  RELAY_EXTENSION_RATE_LIMIT_INSTALLATIONS: "${RELAY_EXTENSION_RATE_LIMIT_INSTALLATIONS:-120}"

services:
  postgres-volume-gate:
    image: postgres:17-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "/opt/pocketctl/check-volume-migration.sh", "/var/lib/postgresql/data"]
    environment:
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data:ro
      - ./deploy/postgres/check-volume-migration.sh:/opt/pocketctl/check-volume-migration.sh:ro

  postgres:
    image: postgres:17-alpine
    restart: always
    depends_on:
      postgres-volume-gate:
        condition: service_completed_successfully
    environment:
      # M-7: bootstrap uses a maintenance admin role; the application connects
      # as the non-superuser pocketctl_app created by the init script below.
      POSTGRES_USER: pocketctl_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_DB: pocketctl
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/001-create-app-role.sh:/docker-entrypoint-initdb.d/001-create-app-role.sh:ro
    networks:
      - pocketctl-internal
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$${POSTGRES_APP_PASSWORD}\" psql -X -h 127.0.0.1 -U pocketctl_app -d pocketctl -Atc 'SELECT 1' | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 不对外暴露端口
    expose:
      - "5432"

  relay:
    image: pocketctl-relay:${RELEASE_VERSION:-latest}
    build:
      context: ./relay
      dockerfile: Dockerfile
      args:
        RELEASE_VERSION: ${RELEASE_VERSION:-}
        GIT_SHA: ${GIT_SHA:-}
        BUILD_TIME: ${BUILD_TIME:-}
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *relay-extension-environment
      DATABASE_URL: postgresql://pocketctl_app:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@postgres:5432/pocketctl
      DB_CONTROL_POOL_MAX: ${DB_CONTROL_POOL_MAX:-4}
      DB_INGEST_POOL_MAX: ${DB_INGEST_POOL_MAX:-8}
      DB_QUERY_POOL_MAX: ${DB_QUERY_POOL_MAX:-8}
      DB_WORKER_POOL_MAX: ${DB_WORKER_POOL_MAX:-8}
      # Keep total Relay connections below PostgreSQL max_connections.
      DB_POOL_SINGLE_MAX: ${DB_POOL_SINGLE_MAX:-16}
      DB_POOL_TOTAL_MAX: ${DB_POOL_TOTAL_MAX:-28}
      # Safe rollout defaults. Production canary/on requires an explicit env
      # override after the durable-ingress release gate has passed.
      RELAY_DURABLE_INGRESS: ${RELAY_DURABLE_INGRESS:-off}
      RELAY_DURABLE_INGRESS_DAEMONS: ${RELAY_DURABLE_INGRESS_DAEMONS:-}
      RELAY_DURABLE_INGRESS_WINDOW: ${RELAY_DURABLE_INGRESS_WINDOW:-128}
      ATTENTION_INBOX_V1: ${ATTENTION_INBOX_V1:-off}
      ATTENTION_INBOX_RECOVERY_V2: ${ATTENTION_INBOX_RECOVERY_V2:-off}
      RELAY_MATERIALIZATION_MODE: ${RELAY_MATERIALIZATION_MODE:-inline}
      TOKEN_USAGE_FACTS_WRITE: ${TOKEN_USAGE_FACTS_WRITE:-false}
      TOKEN_USAGE_SHADOW_READ: ${TOKEN_USAGE_SHADOW_READ:-false}
      TOKEN_USAGE_DASHBOARD_V2: ${TOKEN_USAGE_DASHBOARD_V2:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      NODE_ENV: production
      POCKETCTL_MODE: saas
      # 邮箱验证码 pepper：生产必填（>=32 字符），验证码只以 HMAC 摘要落库。
      # compose 缺少该变量时 config 校验失败、启动中止。
      AUTH_CODE_PEPPER: ${AUTH_CODE_PEPPER:?AUTH_CODE_PEPPER is required}
      # JWT 签名密钥同样必填：缺失/为空会让 relay 在容器内反复 FATAL 重启。
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # M-4:production SaaS 固定 enforce;源码在 production+saas 下拒绝任何
      # 其他值,环境变量无法再静默降级(observe/off 只允许自托管部署显式选择)。
      QUOTA_ENFORCEMENT: enforce
      FREE_MAX_BOUND_DAEMONS: ${FREE_MAX_BOUND_DAEMONS:-2}
      FREE_MAX_CONCURRENT_SESSIONS: ${FREE_MAX_CONCURRENT_SESSIONS:-2}
      PORT: 8080
      # M-1：容器内监听所有接口（未发布宿主端口，仅内部网络可达），
      # 只信任固定内部地址上的 Nginx 所设置的转发头。
      RELAY_HOST: 0.0.0.0
      TRUSTED_PROXY_CIDRS: "172.30.0.2/32"
      WEB_APP_URL: "https://www.pocketctl.me"
      PUBLIC_ISSUER_URL: "https://www.pocketctl.me"
      # CORS 白名单：Relay 在 production 下拒绝空值并中止启动。
      # 新增前端域名时在此追加（逗号分隔）。
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://www.pocketctl.me,https://pocketctl.me}
      # DEV_EMAIL/DEV_EMAIL_CODE 固定验证码后门已移除：production 下
      # runtime-config 检测到任一 DEV 变量都会拒绝启动。容器不再注入这两个变量。
      APNS_KEY_PATH: ${APNS_KEY_PATH:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-com.pocketctl.app}
      APNS_ENVIRONMENT: ${APNS_ENVIRONMENT:-production}
    volumes:
      - "${APNS_KEY_DIR:-./secrets/apns}:/run/secrets/apns:ro"
    # M-7: least-privilege runtime — non-root, read-only root fs, no caps.
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - pocketctl-internal
    expose:
      - "8080"

  relay-worker:
    image: pocketctl-relay:${RELEASE_VERSION:-latest}
    build:
      context: ./relay
      dockerfile: Dockerfile
      args:
        RELEASE_VERSION: ${RELEASE_VERSION:-}
        GIT_SHA: ${GIT_SHA:-}
        BUILD_TIME: ${BUILD_TIME:-}
    command: ["node", "dist/event-worker-main.js"]
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *relay-extension-environment
      DATABASE_URL: postgresql://pocketctl_app:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@postgres:5432/pocketctl
      DB_WORKER_POOL_MAX: ${DB_WORKER_POOL_MAX:-8}
      RELAY_MATERIALIZATION_MODE: worker
      RELAY_DURABLE_INGRESS: ${RELAY_DURABLE_INGRESS:-off}
      TOKEN_USAGE_FACTS_WRITE: ${TOKEN_USAGE_FACTS_WRITE:-false}
      RELAY_WORKER_ID: ${RELAY_WORKER_ID:-relay-worker-1}
      RELAY_WORKER_SHARD_COUNT: "1"
      RELAY_WORKER_SHARD_INDEX: "0"
      NODE_ENV: production
      POCKETCTL_MODE: saas
      APNS_KEY_PATH: ${APNS_KEY_PATH:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-com.pocketctl.app}
      APNS_ENVIRONMENT: ${APNS_ENVIRONMENT:-production}
    volumes:
      - "${APNS_KEY_DIR:-./secrets/apns}:/run/secrets/apns:ro"
    # M-7: least-privilege runtime — non-root, read-only root fs, no caps.
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - pocketctl-internal

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # H-8：证书必须显式提供宿主路径；缺失时 `docker compose config` 直接失败，
      # 不允许挂载一个可能为空的目录假装启用了 TLS。
      - "${TLS_CERT_PATH:?TLS_CERT_PATH is required}:/etc/nginx/ssl/fullchain.pem:ro"
      - "${TLS_KEY_PATH:?TLS_KEY_PATH is required}:/etc/nginx/ssl/privkey.pem:ro"
      - ./nginx/html:/usr/share/nginx/html:ro
    networks:
      pocketctl-internal:
        # M-1：固定 Nginx 内部地址，Relay 只信任这一跳设置的 X-Forwarded-For。
        ipv4_address: 172.30.0.2
    depends_on:
      - relay

  # ---- PocketCtl Memory (independent Phase 0 deployment) ----

  memory-postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: ${MEMORY_POSTGRES_PASSWORD:?MEMORY_POSTGRES_PASSWORD is required}
      POSTGRES_DB: memory
    volumes:
      - memory_pgdata:/var/lib/postgresql/data
    networks:
      - pocketctl-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Never exposed to the host.

  memory-api:
    image: pocketctl-memory:${RELEASE_VERSION:-latest}
    build:
      context: ./memory
      dockerfile: Dockerfile
    restart: always
    command: ["node", "dist/api-main.js"]
    environment:
      NODE_ENV: production
      MEMORY_MODE: ${MEMORY_MODE:?MEMORY_MODE is required}
      MEMORY_PORT: "8090"
      MEMORY_DATABASE_URL: postgresql://memory:${MEMORY_POSTGRES_PASSWORD:?MEMORY_POSTGRES_PASSWORD is required}@memory-postgres:5432/memory
      MEMORY_DB_POOL_MAX: ${MEMORY_DB_POOL_MAX:-8}
      MEMORY_RELAY_URL: ${MEMORY_RELAY_URL:?MEMORY_RELAY_URL is required}
      MEMORY_RELAY_ISSUER: ${MEMORY_RELAY_ISSUER:?MEMORY_RELAY_ISSUER is required}
      MEMORY_PROVIDER_CLIENT_ID: ${MEMORY_PROVIDER_CLIENT_ID:?MEMORY_PROVIDER_CLIENT_ID is required}
      MEMORY_PROVIDER_CLIENT_SECRET: ${MEMORY_PROVIDER_CLIENT_SECRET:?MEMORY_PROVIDER_CLIENT_SECRET is required}
      MEMORY_HMAC_KEY: ${MEMORY_HMAC_KEY:?MEMORY_HMAC_KEY is required}
      MEMORY_LOG_LEVEL: ${MEMORY_LOG_LEVEL:-info}
      MEMORY_TEXT_PROVIDER: ${MEMORY_TEXT_PROVIDER:-}
      MEMORY_TEXT_BASE_URL: ${MEMORY_TEXT_BASE_URL:-}
      MEMORY_TEXT_MODEL: ${MEMORY_TEXT_MODEL:-}
      MEMORY_TEXT_API_KEY: ${MEMORY_TEXT_API_KEY:-}
      MEMORY_TEXT_INPUT_COST_MICROS_PER_MILLION_TOKENS: ${MEMORY_TEXT_INPUT_COST_MICROS_PER_MILLION_TOKENS:-}
      MEMORY_TEXT_OUTPUT_COST_MICROS_PER_MILLION_TOKENS: ${MEMORY_TEXT_OUTPUT_COST_MICROS_PER_MILLION_TOKENS:-}
      MEMORY_EMBEDDING_PROVIDER: ${MEMORY_EMBEDDING_PROVIDER:-}
      MEMORY_EMBEDDING_BASE_URL: ${MEMORY_EMBEDDING_BASE_URL:-}
      MEMORY_EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:-}
      MEMORY_EMBEDDING_API_KEY: ${MEMORY_EMBEDDING_API_KEY:-}
      MEMORY_EMBEDDING_DIMENSIONS: ${MEMORY_EMBEDDING_DIMENSIONS:-}
      MEMORY_EMBEDDING_INPUT_COST_MICROS_PER_MILLION_TOKENS: ${MEMORY_EMBEDDING_INPUT_COST_MICROS_PER_MILLION_TOKENS:-}
      MEMORY_EMBEDDING_OUTPUT_COST_MICROS_PER_MILLION_TOKENS: ${MEMORY_EMBEDDING_OUTPUT_COST_MICROS_PER_MILLION_TOKENS:-}
      MEMORY_MODEL_TIMEOUT_MS: ${MEMORY_MODEL_TIMEOUT_MS:-30000}
      MEMORY_RECALL_EMBEDDING_TIMEOUT_MS: ${MEMORY_RECALL_EMBEDDING_TIMEOUT_MS:-2000}
      MEMORY_EXTRACTION_MAX_CHARS: ${MEMORY_EXTRACTION_MAX_CHARS:-200000}
      MEMORY_ALLOWED_ORIGINS: ${MEMORY_ALLOWED_ORIGINS:-}
      MEMORY_ALLOWED_HOSTS: ${MEMORY_ALLOWED_HOSTS:-}
      # Runtime config validates this before any DB/network work whenever
      # MEMORY_MODE is shadow/enabled; off remains deployable for safe rollout.
      MEMORY_TOMBSTONE_HMAC_KEYS: ${MEMORY_TOMBSTONE_HMAC_KEYS:-}
    ports:
      - "127.0.0.1:8090:8090"
    user: "10002:10002"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - pocketctl-internal
    depends_on:
      memory-postgres:
        condition: service_healthy

  memory-worker:
    image: pocketctl-memory:${RELEASE_VERSION:-latest}
    build:
      context: ./memory
      dockerfile: Dockerfile
    restart: always
    command: ["node", "dist/worker-main.js"]
    environment:
      NODE_ENV: production
      MEMORY_MODE: ${MEMORY_MODE:?MEMORY_MODE is required}
      MEMORY_DATABASE_URL: postgresql://memory:${MEMORY_POSTGRES_PASSWORD:?MEMORY_POSTGRES_PASSWORD is required}@memory-postgres:5432/memory
      MEMORY_DB_POOL_MAX: ${MEMORY_DB_POOL_MAX:-8}
      MEMORY_RELAY_URL: ${MEMORY_RELAY_URL:?MEMORY_RELAY_URL is required}
      MEMORY_RELAY_ISSUER: ${MEMORY_RELAY_ISSUER:?MEMORY_RELAY_ISSUER is required}
      MEMORY_PROVIDER_CLIENT_ID: ${MEMORY_PROVIDER_CLIENT_ID:?MEMORY_PROVIDER_CLIENT_ID is required}
      MEMORY_PROVIDER_CLIENT_SECRET: ${MEMORY_PROVIDER_CLIENT_SECRET:?MEMORY_PROVIDER_CLIENT_SECRET is required}
      MEMORY_HMAC_KEY: ${MEMORY_HMAC_KEY:?MEMORY_HMAC_KEY is required}
      MEMORY_WORKER_ID: ${MEMORY_WORKER_ID:-memory-worker-1}
      MEMORY_LOG_LEVEL: ${MEMORY_LOG_LEVEL:-info}
      MEMORY_TEXT_PROVIDER: ${MEMORY_TEXT_PROVIDER:-}
      MEMORY_TEXT_BASE_URL: ${MEMORY_TEXT_BASE_URL:-}
      MEMORY_TEXT_MODEL: ${MEMORY_TEXT_MODEL:-}
      MEMORY_TEXT_API_KEY: ${MEMORY_TEXT_API_KEY:-}
      MEMORY_TEXT_INPUT_COST_MICROS_PER_MILLION_TOKENS: ${MEMORY_TEXT_INPUT_COST_MICROS_PER_MILLION_TOKENS:-}
      MEMORY_TEXT_OUTPUT_COST_MICROS_PER_MILLION_TOKENS: ${MEMORY_TEXT_OUTPUT_COST_MICROS_PER_MILLION_TOKENS:-}
      MEMORY_EMBEDDING_PROVIDER: ${MEMORY_EMBEDDING_PROVIDER:-}
      MEMORY_EMBEDDING_BASE_URL: ${MEMORY_EMBEDDING_BASE_URL:-}
      MEMORY_EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:-}
      MEMORY_EMBEDDING_API_KEY: ${MEMORY_EMBEDDING_API_KEY:-}
      MEMORY_EMBEDDING_DIMENSIONS: ${MEMORY_EMBEDDING_DIMENSIONS:-}
      MEMORY_EMBEDDING_INPUT_COST_MICROS_PER_MILLION_TOKENS: ${MEMORY_EMBEDDING_INPUT_COST_MICROS_PER_MILLION_TOKENS:-}
      MEMORY_EMBEDDING_OUTPUT_COST_MICROS_PER_MILLION_TOKENS: ${MEMORY_EMBEDDING_OUTPUT_COST_MICROS_PER_MILLION_TOKENS:-}
      MEMORY_MODEL_TIMEOUT_MS: ${MEMORY_MODEL_TIMEOUT_MS:-30000}
      MEMORY_RECALL_EMBEDDING_TIMEOUT_MS: ${MEMORY_RECALL_EMBEDDING_TIMEOUT_MS:-2000}
      MEMORY_EXTRACTION_MAX_CHARS: ${MEMORY_EXTRACTION_MAX_CHARS:-200000}
      MEMORY_ALLOWED_ORIGINS: ${MEMORY_ALLOWED_ORIGINS:-}
      MEMORY_ALLOWED_HOSTS: ${MEMORY_ALLOWED_HOSTS:-}
      MEMORY_TOMBSTONE_HMAC_KEYS: ${MEMORY_TOMBSTONE_HMAC_KEYS:-}
    user: "10002:10002"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - pocketctl-internal
    depends_on:
      memory-postgres:
        condition: service_healthy

networks:
  pocketctl-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
  memory_pgdata:
