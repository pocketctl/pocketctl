version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: pocketctl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pocketctl_prod_2026}
      POSTGRES_DB: pocketctl
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocketctl"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 不对外暴露端口
    expose:
      - "5432"

  relay:
    build:
      context: ./relay
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pocketctl:${POSTGRES_PASSWORD:-pocketctl_prod_2026}@postgres:5432/pocketctl
      POCKETCTL_API_KEY: ${POCKETCTL_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      NODE_ENV: production
      PORT: 8080
      WEB_APP_URL: "https://www.pocketctl.me"
      # CORS 白名单：留空会 fallback 到 origin:true（允许任意站点带 token 调 REST）。
      # 锁定到生产 Web 域名，关闭通配兜底。新增前端域名时在此追加（逗号分隔）。
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://www.pocketctl.me,https://pocketctl.me}
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - relay

volumes:
  pgdata:
