services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pocketctl
      POSTGRES_PASSWORD: pocketctl
      POSTGRES_DB: pocketctl
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocketctl"]
      interval: 2s
      timeout: 3s
      retries: 10

  relay:
    build:
      context: ./relay
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      DATABASE_URL: postgresql://pocketctl:pocketctl@postgres:5432/pocketctl
      PORT: 8080
      JWT_SECRET: pocketctl-local-dev-secret-2024
      WEB_APP_URL: "http://localhost"
      ZHIPU_API_KEY: "${ZHIPU_API_KEY:-}"
      DEV_EMAIL: "test@pocketctl.me"
      DEV_EMAIL_CODE: "123456"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    expose:
      - "3000"

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - web
      - relay

volumes:
  pgdata:
