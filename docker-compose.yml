      MEMORY_PORT: "8090"
      MEMORY_DATABASE_URL: "${MEMORY_DATABASE_URL:-postgresql://memory:memory@memory-postgres:5432/memory}"
      MEMORY_DB_POOL_MAX: "4"
      MEMORY_RELAY_URL: "${MEMORY_RELAY_URL:-http://relay:8080}"
      MEMORY_RELAY_ISSUER: "${MEMORY_RELAY_ISSUER:-http://localhost:8080}"
      MEMORY_PROVIDER_CLIENT_ID: "${MEMORY_PROVIDER_CLIENT_ID:-}"
