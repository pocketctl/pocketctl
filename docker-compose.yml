services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pocketctl
      POSTGRES_PASSWORD: pocketctl
      POSTGRES_DB: pocketctl
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocketctl"]
      interval: 2s
      timeout: 3s
      retries: 10

  relay:
    build:
      context: ./relay
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://pocketctl:pocketctl@postgres:5432/pocketctl
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"

volumes:
  pgdata:
