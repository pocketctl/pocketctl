services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pocketctl
      POSTGRES_PASSWORD: pocketctl
      POSTGRES_DB: pocketctl
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocketctl"]
      interval: 2s
      timeout: 3s
      retries: 10

  relay:
    build:
      context: ./relay
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://pocketctl:pocketctl@postgres:5432/pocketctl
      PORT: 8080
      JWT_SECRET: pocketctl-local-dev-secret-2024
      WEB_APP_URL: "http://localhost"
      NODE_ENV: production
      ZHIPU_API_KEY: "${ZHIPU_API_KEY:-}"
      # Tencent Cloud SES (real email sending). Keys come from project .env
      # (gitignored). Without these, /api/auth/email/send returns an error.
      COS_SECRET_ID: "${COS_SECRET_ID:-}"
      COS_SECRET_KEY: "${COS_SECRET_KEY:-}"
      SES_FROM_EMAIL: "${SES_FROM_EMAIL:-}"
      SES_TEMPLATE_ZH: "${SES_TEMPLATE_ZH:-187105}"
      SES_TEMPLATE_EN: "${SES_TEMPLATE_EN:-187106}"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    expose:
      - "3000"

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - web
      - relay

volumes:
  pgdata:
