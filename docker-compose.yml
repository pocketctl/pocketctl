x-relay-extension-environment: &relay-extension-environment
  RELAY_EXTENSIONS: "${RELAY_EXTENSIONS:-off}"
  RELAY_EXTENSION_V2: "${RELAY_EXTENSION_V2:-off}"
  RELAY_EXTENSION_PROJECTOR_BATCH: "${RELAY_EXTENSION_PROJECTOR_BATCH:-200}"
  RELAY_EXTENSION_FEED_RETENTION_DAYS: "${RELAY_EXTENSION_FEED_RETENTION_DAYS:-7}"
  RELAY_EXTENSION_LEASE_TTL_SECONDS: "${RELAY_EXTENSION_LEASE_TTL_SECONDS:-60}"
  EXTENSION_PROVIDER_JWT_SECRET: "${EXTENSION_PROVIDER_JWT_SECRET:-}"
  EXTENSION_PROVIDER_JWT_SECRET_B64: "${EXTENSION_PROVIDER_JWT_SECRET_B64:-}"
  EXTENSION_CURSOR_SECRET: "${EXTENSION_CURSOR_SECRET:-}"
  EXTENSION_CURSOR_SECRET_B64: "${EXTENSION_CURSOR_SECRET_B64:-}"
  EXTENSION_GRANT_PRIVATE_KEY: "${EXTENSION_GRANT_PRIVATE_KEY:-}"
  EXTENSION_GRANT_PRIVATE_KEY_B64: "${EXTENSION_GRANT_PRIVATE_KEY_B64:-}"
  EXTENSION_GRANT_PUBLIC_KEY: "${EXTENSION_GRANT_PUBLIC_KEY:-}"
  EXTENSION_GRANT_PUBLIC_KEY_B64: "${EXTENSION_GRANT_PUBLIC_KEY_B64:-}"
  EXTENSION_GRANT_KEY_ID: "${EXTENSION_GRANT_KEY_ID:-}"
  EXTENSION_PROVIDER_PUBLIC_ORIGINS: "${EXTENSION_PROVIDER_PUBLIC_ORIGINS:-}"
  RELAY_EXTENSION_RATE_LIMIT_TOKEN: "${RELAY_EXTENSION_RATE_LIMIT_TOKEN:-30}"
  RELAY_EXTENSION_RATE_LIMIT_FEED: "${RELAY_EXTENSION_RATE_LIMIT_FEED:-120}"
  RELAY_EXTENSION_RATE_LIMIT_ACK: "${RELAY_EXTENSION_RATE_LIMIT_ACK:-240}"
  RELAY_EXTENSION_RATE_LIMIT_SNAPSHOT: "${RELAY_EXTENSION_RATE_LIMIT_SNAPSHOT:-60}"
  RELAY_EXTENSION_RATE_LIMIT_STATUS: "${RELAY_EXTENSION_RATE_LIMIT_STATUS:-120}"
  RELAY_EXTENSION_RATE_LIMIT_USAGE: "${RELAY_EXTENSION_RATE_LIMIT_USAGE:-60}"
  RELAY_EXTENSION_RATE_LIMIT_PURGE: "${RELAY_EXTENSION_RATE_LIMIT_PURGE:-60}"
  RELAY_EXTENSION_RATE_LIMIT_GRANT: "${RELAY_EXTENSION_RATE_LIMIT_GRANT:-60}"
  RELAY_EXTENSION_RATE_LIMIT_INSTALLATIONS: "${RELAY_EXTENSION_RATE_LIMIT_INSTALLATIONS:-120}"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pocketctl
      POSTGRES_PASSWORD: pocketctl
      POSTGRES_DB: pocketctl
    expose:
      - "5432"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocketctl"]
      interval: 2s
      timeout: 3s
      retries: 10

  relay:
    image: pocketctl-relay:${RELEASE_VERSION:-local}
    build:
      context: ./relay
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      <<: *relay-extension-environment
      DATABASE_URL: postgresql://pocketctl:pocketctl@postgres:5432/pocketctl
      DB_CONTROL_POOL_MAX: "${DB_CONTROL_POOL_MAX:-4}"
      DB_INGEST_POOL_MAX: "${DB_INGEST_POOL_MAX:-8}"
      DB_QUERY_POOL_MAX: "${DB_QUERY_POOL_MAX:-8}"
      DB_WORKER_POOL_MAX: "${DB_WORKER_POOL_MAX:-8}"
      # Keep total Relay connections below PostgreSQL max_connections.
      DB_POOL_SINGLE_MAX: "${DB_POOL_SINGLE_MAX:-16}"
      DB_POOL_TOTAL_MAX: "${DB_POOL_TOTAL_MAX:-28}"
      RELAY_DURABLE_INGRESS: "${RELAY_DURABLE_INGRESS:-off}"
      RELAY_DURABLE_INGRESS_DAEMONS: "${RELAY_DURABLE_INGRESS_DAEMONS:-}"
      RELAY_DURABLE_INGRESS_WINDOW: "${RELAY_DURABLE_INGRESS_WINDOW:-128}"
      ATTENTION_INBOX_V1: "${ATTENTION_INBOX_V1:-off}"
      ATTENTION_INBOX_RECOVERY_V2: "${ATTENTION_INBOX_RECOVERY_V2:-off}"
      RELAY_MATERIALIZATION_MODE: "${RELAY_MATERIALIZATION_MODE:-inline}"
      TOKEN_USAGE_FACTS_WRITE: "${TOKEN_USAGE_FACTS_WRITE:-false}"
      TOKEN_USAGE_SHADOW_READ: "${TOKEN_USAGE_SHADOW_READ:-false}"
      TOKEN_USAGE_DASHBOARD_V2: "${TOKEN_USAGE_DASHBOARD_V2:-false}"
      PORT: 8080
      JWT_SECRET: pocketctl-local-dev-secret-2024
      WEB_APP_URL: "http://localhost"
      NODE_ENV: development
      POCKETCTL_MODE: self-hosted
      # Local development login shortcut. Explicit shell/.env values override
      # these defaults; production uses docker-compose.prod.yml instead.
      DEV_EMAIL: "${DEV_EMAIL:-dev@pocketctl.me}"
      DEV_EMAIL_CODE: "${DEV_EMAIL_CODE:-888888}"
      QUOTA_ENFORCEMENT: "${QUOTA_ENFORCEMENT:-off}"
      FREE_MAX_BOUND_DAEMONS: "${FREE_MAX_BOUND_DAEMONS:-2}"
      FREE_MAX_CONCURRENT_SESSIONS: "${FREE_MAX_CONCURRENT_SESSIONS:-2}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      # Tencent Cloud SES (real email sending). Keys come from project .env
      # (gitignored). Without these, /api/auth/email/send returns an error.
      COS_SECRET_ID: "${COS_SECRET_ID:-}"
      COS_SECRET_KEY: "${COS_SECRET_KEY:-}"
      SES_FROM_EMAIL: "${SES_FROM_EMAIL:-}"
      SES_TEMPLATE_ZH: "${SES_TEMPLATE_ZH:-187105}"
      SES_TEMPLATE_EN: "${SES_TEMPLATE_EN:-187106}"
      APNS_KEY_PATH: "${APNS_KEY_PATH:-}"
      APNS_KEY_ID: "${APNS_KEY_ID:-}"
      APNS_TEAM_ID: "${APNS_TEAM_ID:-}"
      APNS_BUNDLE_ID: "${APNS_BUNDLE_ID:-com.pocketctl.app}"
      APNS_ENVIRONMENT: "${APNS_ENVIRONMENT:-development}"
    volumes:
      - "${APNS_KEY_DIR:-./secrets/apns}:/run/secrets/apns:ro"
    # M-7: least-privilege runtime — non-root, read-only root fs, no caps.
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy

  relay-worker:
    image: pocketctl-relay:${RELEASE_VERSION:-local}
    build:
      context: ./relay
      dockerfile: Dockerfile
    command: ["node", "dist/event-worker-main.js"]
    restart: always
    environment:
      <<: *relay-extension-environment
      DATABASE_URL: postgresql://pocketctl:pocketctl@postgres:5432/pocketctl
      DB_WORKER_POOL_MAX: "${DB_WORKER_POOL_MAX:-8}"
      RELAY_MATERIALIZATION_MODE: worker
      RELAY_DURABLE_INGRESS: "${RELAY_DURABLE_INGRESS:-off}"
      TOKEN_USAGE_FACTS_WRITE: "${TOKEN_USAGE_FACTS_WRITE:-false}"
      RELAY_WORKER_ID: "${RELAY_WORKER_ID:-relay-worker-1}"
      RELAY_WORKER_SHARD_COUNT: "1"
      RELAY_WORKER_SHARD_INDEX: "0"
      NODE_ENV: development
      POCKETCTL_MODE: self-hosted
      APNS_KEY_PATH: "${APNS_KEY_PATH:-}"
      APNS_KEY_ID: "${APNS_KEY_ID:-}"
      APNS_TEAM_ID: "${APNS_TEAM_ID:-}"
      APNS_BUNDLE_ID: "${APNS_BUNDLE_ID:-com.pocketctl.app}"
      APNS_ENVIRONMENT: "${APNS_ENVIRONMENT:-development}"
    volumes:
      - "${APNS_KEY_DIR:-./secrets/apns}:/run/secrets/apns:ro"
    # M-7: least-privilege runtime — non-root, read-only root fs, no caps.
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    expose:
      - "3000"

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - web
      - relay

  # ---- PocketCtl Memory (independent Phase 0 deployment) ----

  memory-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory
      POSTGRES_DB: memory
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - memory_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory"]
      interval: 2s
      timeout: 3s
      retries: 10

  memory-api:
    image: pocketctl-memory:${RELEASE_VERSION:-local}
    build:
      context: ./memory
      dockerfile: Dockerfile
    command: ["node", "dist/api-main.js"]
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      NODE_ENV: development
      MEMORY_MODE: "${MEMORY_MODE:-shadow}"
      MEMORY_SHARED_SCOPES: "${MEMORY_SHARED_SCOPES:-off}"
      # Closed by default; paths are container file references, never tokens or host mounts.
      MEMORY_GIT_SYNC_MODE: "${MEMORY_GIT_SYNC_MODE:-off}"
      MEMORY_GIT_WRITE_MODE: "${MEMORY_GIT_WRITE_MODE:-off}"
      MEMORY_GIT_MAX_CONCURRENCY: "${MEMORY_GIT_MAX_CONCURRENCY:-1}"
      MEMORY_GIT_REQUEST_TIMEOUT_MS: "${MEMORY_GIT_REQUEST_TIMEOUT_MS:-15000}"
      MEMORY_GIT_POLL_INTERVAL_MS: "${MEMORY_GIT_POLL_INTERVAL_MS:-60000}"
      MEMORY_GIT_MAX_HTTP_ATTEMPTS: "${MEMORY_GIT_MAX_HTTP_ATTEMPTS:-128}"
      MEMORY_GIT_MAX_FAILURES: "${MEMORY_GIT_MAX_FAILURES:-5}"
      MEMORY_GIT_MAX_TASK_AGE_MS: "${MEMORY_GIT_MAX_TASK_AGE_MS:-86400000}"
      MEMORY_GIT_MAX_FILES: "${MEMORY_GIT_MAX_FILES:-256}"
      MEMORY_GIT_MAX_FILE_BYTES: "${MEMORY_GIT_MAX_FILE_BYTES:-262144}"
      MEMORY_GIT_MAX_TOTAL_BYTES: "${MEMORY_GIT_MAX_TOTAL_BYTES:-8388608}"
      MEMORY_GIT_TARGET_REGISTRY_PATH: "${MEMORY_GIT_TARGET_REGISTRY_PATH:-}"
      MEMORY_GIT_READ_CONSENT_FILE: "${MEMORY_GIT_READ_CONSENT_FILE:-}"
      MEMORY_GIT_SIGNING_KEY_FILE: "${MEMORY_GIT_SIGNING_KEY_FILE:-}"
      MEMORY_GIT_SIGNING_KEY_ID: "${MEMORY_GIT_SIGNING_KEY_ID:-}"
      MEMORY_CODEGRAPH_MODE: "${MEMORY_CODEGRAPH_MODE:-off}"
      MEMORY_WIKI_MODE: "${MEMORY_WIKI_MODE:-off}"
      MEMORY_SKILL_MODE: "${MEMORY_SKILL_MODE:-off}"
      MEMORY_SKILL_REPLAY_REGISTRY_PATH: "${MEMORY_SKILL_REPLAY_REGISTRY_PATH:-}"
      MEMORY_SKILL_AUTO_PUBLISH_MODE: "${MEMORY_SKILL_AUTO_PUBLISH_MODE:-off}"
      MEMORY_SKILL_CANARY_MODE: "${MEMORY_SKILL_CANARY_MODE:-off}"
