<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pocketctl 登录验证码</title>
</head>
<body style="margin:0;padding:0;background-color:#f6f8fa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f6f8fa;padding:40px 0;">
  <tr>
    <td align="center">
      <table width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.06);">

        <!-- Header -->
        <tr>
          <td style="background:linear-gradient(135deg,#1f6feb 0%,#58a6ff 100%);padding:32px 40px;text-align:center;">
            <table width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td align="center">
                  <img src="https://www.pocketctl.me/assets/logo-github-org-light.svg" width="40" height="40" alt="pocketctl" style="display:block;margin-bottom:12px;">
                </td>
              </tr>
              <tr>
                <td style="color:#ffffff;font-size:22px;font-weight:700;letter-spacing:0.5px;">pocketctl</td>
              </tr>
              <tr>
                <td style="color:rgba(255,255,255,0.85);font-size:14px;padding-top:4px;">远程掌控你的 AI 编程助手</td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Body -->
        <tr>
          <td style="padding:36px 40px;">

            <!-- Title -->
            <p style="margin:0 0 12px;font-size:20px;font-weight:700;color:#1f2328;">登录验证码</p>
            <p style="margin:0 0 28px;font-size:15px;color:#656d76;line-height:1.6;">你正在请求登录 pocketctl。请使用以下验证码完成验证：</p>

            <!-- Code Box -->
            <table width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:28px;">
              <tr>
                <td style="background-color:#f0f6ff;border:1px dashed #1f6feb;border-radius:10px;padding:24px 16px;text-align:center;">
                  <span style="font-family:'SF Mono','JetBrains Mono','IBM Plex Mono',monospace;font-size:36px;font-weight:800;letter-spacing:10px;color:#1f6feb;padding-left:10px;">{{name}}</span>
                </td>
              </tr>
            </table>

            <!-- Info -->
            <table width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:24px;">
              <tr>
                <td style="padding:0;">
                  <p style="margin:0 0 8px;font-size:13px;color:#8b949e;line-height:1.5;">
                    ⏱️ 验证码 <strong style="color:#656d76;">5 分钟</strong> 内有效，请尽快使用
                  </p>
                  <p style="margin:0 0 8px;font-size:13px;color:#8b949e;line-height:1.5;">
                    📧 此邮件由系统自动发送，请勿回复
                  </p>
                  <p style="margin:0;font-size:13px;color:#8b949e;line-height:1.5;">
                    🔒 如果你未请求此验证码，请忽略这封邮件
                  </p>
                </td>
              </tr>
            </table>

            <!-- Divider -->
            <table width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:20px;">
              <tr>
                <td style="border-top:1px solid #e1e4e8;"></td>
              </tr>
            </table>

            <!-- CTA -->
            <p style="margin:0;font-size:13px;color:#656d76;line-height:1.6;">
              你也可以在 <a href="https://www.pocketctl.me/app/login" style="color:#1f6feb;text-decoration:none;">pocketctl Web 客户端</a> 或 iOS App 中直接输入此验证码完成登录。
            </p>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td style="background-color:#f6f8fa;padding:20px 40px;text-align:center;">
            <p style="margin:0 0 6px;font-size:11px;color:#8b949e;">© 2026 北京乐呵乐呵信息技术有限公司</p>
            <p style="margin:0;font-size:11px;color:#8b949e;">
              <a href="https://www.pocketctl.me" style="color:#8b949e;text-decoration:none;">pocketctl.me</a>
              &nbsp;·&nbsp;
              <a href="https://beian.miit.gov.cn/" style="color:#8b949e;text-decoration:none;">京ICP备2024044430号-3</a>
            </p>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
</body>
</html>
