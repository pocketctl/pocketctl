# ========================================================
# Nginx — Docker 前置代理 (Landing + Web + Relay)
# ========================================================
# 容器内监听 80，作为整个应用的入口

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $request_uri $sanitized_uri {
    default $request_uri;
    "~^(?<pre>.*)(?<param>[?&](token|access_token|refresh_token|api_key)=)[^&]*(?<post>.*)$" "${pre}${param}REDACTED${post}";
}

log_format pocketctl '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $sanitized_uri $server_protocol" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log pocketctl;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Landing Page 静态资源（/css/, /js/, /assets/）
    location /css/ {
        root /usr/share/nginx/html;
        expires 1y;
    }

    location /js/ {
        root /usr/share/nginx/html;
        # 开发环境不缓存，避免更新后浏览器使用旧版 JS
        expires -1;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
    }

    # M-8: bootstrap carries theme/env logic without a content hash — never
    # let a long cache pin stale environment behavior.
    location = /app/bootstrap.js {
        proxy_pass http://web:3000/app/bootstrap.js;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache" always;
    }

    # Web 客户端 — 透传到 web 服务
    location /app/ {
        proxy_pass http://web:3000/app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Relay — 设备授权页
    location /login/ {
        proxy_pass http://relay:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Relay API
    location /api/ {
        proxy_pass http://relay:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Relay WebSocket
    location /ws {
        proxy_pass http://relay:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://relay:8080;
    }

    # Landing Page — 根路径
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml application/json;
    gzip_min_length 256;
    gzip_vary on;
}
