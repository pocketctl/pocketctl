server {
    listen 80;
    server_name _;

    # ============================
    # Landing Page 静态资源
    # ============================
    location /css/ {
        root /opt/pocketctl/landing;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /js/ {
        root /opt/pocketctl/landing;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /assets/ {
        root /opt/pocketctl/landing;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ============================
    # Web 客户端 — Vue SPA (/app/*)
    # ============================
    location /app/ {
        alias /opt/pocketctl/web/dist/;
        try_files $uri $uri/ /app/index.html;
    }

    # Web 客户端构建产物
    location /app/assets/ {
        alias /opt/pocketctl/web/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ============================
    # Relay 健康检查
    # ============================
    location /health {
        proxy_pass http://127.0.0.1:8080/health;
    }

    # ============================
    # WebSocket 代理
    # ============================
    location /ws {
        proxy_pass http://127.0.0.1:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # ============================
    # REST API
    # ============================
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ============================
    # 部署 Webhook
    # ============================
    location /webhook/ {
        proxy_pass http://127.0.0.1:9000/webhook/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Gitee-Signature $http_x_gitee_signature;
        proxy_set_header X-Gitee-Token $http_x_gitee_token;
    }

    # ============================
    # 手动部署
    # ============================
    location /deploy {
        proxy_pass http://127.0.0.1:9000/deploy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ============================
    # Landing Page — 根路径
    # ============================
    root /opt/pocketctl/landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml application/json;
    gzip_min_length 256;
    gzip_vary on;
}
