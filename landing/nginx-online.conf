map $request_uri $sanitized_uri {
    default $request_uri;
    "~^(?<pre>.*)(?<param>[?&](token|access_token|refresh_token|api_key)=)[^&]*(?<post>.*)$" "${pre}${param}REDACTED${post}";
}

log_format pocketctl '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $sanitized_uri $server_protocol" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# H-8：80 端口只跳转 HTTPS；所有流量（含健康检查）必须经 TLS server。
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # 证书路径与 deploy/nginx/pocketctl.conf、docker compose 模板保持一致。
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/access.log pocketctl;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://memory.pocketctl.me wss:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ============================
    # Landing Page 静态资源
    # ============================
    location /css/ {
        root /opt/pocketctl/landing;
        expires 1y;
    }
    location /js/ {
        root /opt/pocketctl/landing;
        expires 1y;
    }
    location /assets/ {
        root /opt/pocketctl/landing;
        expires 1y;
    }

    # ============================
    # Daemon 安装脚本 — 随 git 部署同步（nginx/html/install.sh），
    # `curl … | bash` 的分发入口；精确匹配，避免落入下方 SPA fallback。
    # ============================
    location = /install.sh {
        alias /opt/pocketctl/nginx/html/install.sh;
        default_type application/x-sh;
    }

    # ============================
    # Web 客户端 — Vue SPA (/app/*)
    # ============================
    location /app/ {
        alias /opt/pocketctl/web/dist/;
        try_files $uri $uri/ /app/index.html;
    }

    # Web 客户端构建产物
    # M-8: bootstrap carries theme/env logic without a content hash — never
    # let a long cache pin stale environment behavior.
    location = /app/bootstrap.js {
        alias /opt/pocketctl/web/dist/bootstrap.js;
        add_header Cache-Control "no-cache" always;
    }

    location /app/assets/ {
        alias /opt/pocketctl/web/dist/assets/;
        expires 1y;
    }

    # ============================
    # Relay 健康检查
    # ============================
    location /health {
        proxy_pass http://127.0.0.1:8080/health;
    }

    # ============================
    # WebSocket 代理
    # ============================
    location /ws {
        proxy_pass http://127.0.0.1:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # M-1：单层边缘必须覆盖（而非追加）X-Forwarded-For，杜绝公网客户端
        # 自报链进入 Relay 的权威客户端地址。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # ============================
    # REST API
    # ============================
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # M-1：同上，覆盖式 X-Forwarded-For。
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # ============================
    # 部署 Webhook — 仅暴露唯一精确路由，凭证校验在上游 Node 服务
    # （fail-closed：缺失/畸形凭证一律 403，不触发部署）
    # ============================
    location = /webhook/deploy {
        limit_except POST {
            deny all;
        }

        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:9000/webhook/deploy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Gitee-Token $http_x_gitee_token;
        proxy_set_header X-Gitee-Event $http_x_gitee_event;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
    }

    # 手动部署路由已在应用层删除；Nginx 精确匹配并直接拒绝。
    location = /deploy {
        return 404;
    }

    # ============================
    # Landing Page — 根路径
    # ============================
    root /opt/pocketctl/landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml application/json;
    gzip_min_length 256;
    gzip_vary on;
}
