# ========================================================
# Nginx — pocketctl.me (Landing Page + Web 客户端)
# ========================================================
# 部署方式：
#   1. Landing Page: 将 landing/ 目录下的 index.html, css/, js/, assets/ 放到 /var/www/landing/
#   2. Web 客户端: 将 web/dist/ 构建产物放到 /var/www/landing/app/
#   3. 将此配置文件放到 nginx 配置目录并 reload
#   4. SSL: sudo certbot --nginx -d pocketctl.me -d www.pocketctl.me
#
# 路由分配：
#   /              → Landing Page (静态文件)
#   /app/*         → Web 客户端 (Vue SPA)
#   /api/*         → Relay 后端
#   /ws            → Relay WebSocket
# ========================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    server_name _;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/landing;
    }

    # ================================================================
    # Landing Page 静态资源（/assets/, /css/, /js/）
    # ================================================================
    location /assets/ {
        root /var/www/landing;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /css/ {
        root /var/www/landing;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /js/ {
        root /var/www/landing;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ================================================================
    # Web 客户端 — Vue SPA (/app/*)
    # ================================================================
    location /app {
        alias /var/www/landing/app;
        try_files $uri $uri/ /app/index.html;
    }

    # Web 客户端自身的静态资源（Vue build 产物）
    location /app/assets/ {
        alias /var/www/landing/app/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ================================================================
    # Relay 后端代理
    # ================================================================
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8080;
    }

    # ================================================================
    # Landing Page — 根路径
    # ================================================================
    root /var/www/landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip 压缩
    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml application/json;
    gzip_min_length 256;
    gzip_vary on;
}
