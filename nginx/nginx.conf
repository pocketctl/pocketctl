worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # 日志格式：脱敏 URL query 中的认证材料，避免 access_log 泄露 token。
    map $request_uri $sanitized_uri {
        default $request_uri;
        "~^(?<pre>.*)(?<param>[?&](token|access_token|refresh_token|api_key)=)[^&]*$" "${pre}${param}REDACTED";
    }

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $sanitized_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # 限流：每 IP 每秒 10 个请求
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # ---- 端口 80：只做 HTTPS 跳转，不代理任何流量（H-8） ----
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        return 308 https://$host$request_uri;
    }

    # ---- HTTPS 主服务 ----
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name _;

        # 证书由 compose 以显式宿主路径挂载（TLS_CERT_PATH/TLS_KEY_PATH 必填）。
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS 只在 TLS server 上发送（经明文入口发送违反 RFC 6797）。
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' wss:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # 健康检查端点
        location /health {
            proxy_pass http://relay:8080/health;
            proxy_set_header Host $host;
        }

        # WebSocket 代理
        location /ws {
            proxy_pass http://relay:8080/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 长超时（24 小时）
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # 缓冲设置
            proxy_buffering off;
            proxy_cache off;
        }

        # REST API
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://relay:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 安装脚本
        location /install.sh {
            alias /usr/share/nginx/html/install.sh;
            default_type application/x-sh;
        }

        # 默认返回 404
        location / {
            default_type application/json;
            return 404 '{"error":"not found"}';
        }
    }
}
