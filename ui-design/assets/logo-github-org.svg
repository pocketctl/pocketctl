<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Canvas gradient — deep dark -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#010409"/>
    </linearGradient>

    <!-- Terminal body gradient -->
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Title bar gradient -->
    <linearGradient id="titleBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#1c2128"/>
    </linearGradient>

    <!-- Chevron gradient — light to deep blue -->
    <linearGradient id="chevGrad" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#c9e1ff"/>
      <stop offset="40%" stop-color="#79c0ff"/>
      <stop offset="100%" stop-color="#388bfd"/>
    </linearGradient>

    <!-- Cursor gradient -->
    <linearGradient id="curGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5d6ff"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>

    <!-- Blue glow behind chevron -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="blur"/>
      <feFlood flood-color="#58a6ff" flood-opacity="0.45" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop shadow for terminal window -->
    <filter id="dropShadow" x="-8%" y="-5%" width="116%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <!-- Ambient blue atmosphere -->
    <radialGradient id="ambient" cx="0.5" cy="0.42" r="0.52">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.07"/>
      <stop offset="70%" stop-color="#1f6feb" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#010409" stop-opacity="0"/>
    </radialGradient>

    <!-- Clip for title bar (matches window shape) -->
    <clipPath id="winClip">
      <rect x="88" y="100" width="336" height="312" rx="24"/>
    </clipPath>
  </defs>

  <!-- ===== CANVAS BACKGROUND ===== -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Ambient blue glow behind terminal -->
  <ellipse cx="256" cy="256" rx="260" ry="240" fill="url(#ambient)"/>

  <!-- ===== TERMINAL WINDOW ===== -->
  <!-- Window body with drop shadow -->
  <g filter="url(#dropShadow)">
    <rect x="88" y="100" width="336" height="312" rx="24" fill="url(#termBg)"/>
  </g>

  <!-- Title bar (clipped to window shape) -->
  <g clip-path="url(#winClip)">
    <rect x="88" y="100" width="336" height="48" fill="url(#titleBg)"/>
  </g>

  <!-- Title bar separator -->
  <line x1="88" y1="148" x2="424" y2="148" stroke="#30363d" stroke-width="1.5"/>

  <!-- Window border -->
  <rect x="88" y="100" width="336" height="312" rx="24" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- Traffic light dots — macOS terminal window controls -->
  <circle cx="122" cy="124" r="9" fill="#f85149"/>
  <circle cx="150" cy="124" r="9" fill="#d29922"/>
  <circle cx="178" cy="124" r="9" fill="#3fb950"/>

  <!-- ===== TERMINAL PROMPT ===== -->
  <!-- Chevron > with glow -->
  <g filter="url(#glow)">
    <path d="M170 218 L305 280 L170 342"
          stroke="url(#chevGrad)" stroke-width="36"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Blinking cursor bar -->
  <rect x="324" y="264" width="11" height="32" rx="5.5" fill="url(#curGrad)" opacity="0.9"/>
</svg>
