<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Canvas gradient — clean white -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>

    <!-- Terminal body gradient — LIGHT -->
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>

    <!-- Title bar gradient — soft gray -->
    <linearGradient id="titleBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaeef2"/>
      <stop offset="100%" stop-color="#dfe4e9"/>
    </linearGradient>

    <!-- Chevron gradient — deep blue for light bg contrast -->
    <linearGradient id="chevGrad" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#388bfd"/>
      <stop offset="50%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#0a5dc2"/>
    </linearGradient>

    <!-- Cursor gradient — solid blue -->
    <linearGradient id="curGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>

    <!-- Glow — softer on light terminal -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feFlood flood-color="#58a6ff" flood-opacity="0.25" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop shadow — subtle elevation on white -->
    <filter id="dropShadow" x="-8%" y="-5%" width="116%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#8b949e" flood-opacity="0.18"/>
    </filter>

    <!-- Clip for title bar (matches window shape) -->
    <clipPath id="winClip">
      <rect x="88" y="100" width="336" height="312" rx="24"/>
    </clipPath>
  </defs>

  <!-- ===== CANVAS BACKGROUND ===== -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- ===== LIGHT TERMINAL WINDOW ===== -->
  <!-- Window body with drop shadow -->
  <g filter="url(#dropShadow)">
    <rect x="88" y="100" width="336" height="312" rx="24" fill="url(#termBg)"/>
  </g>

  <!-- Title bar (clipped to window shape) -->
  <g clip-path="url(#winClip)">
    <rect x="88" y="100" width="336" height="48" fill="url(#titleBg)"/>
  </g>

  <!-- Title bar separator -->
  <line x1="88" y1="148" x2="424" y2="148" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Window border -->
  <rect x="88" y="100" width="336" height="312" rx="24" fill="none" stroke="#d0d7de" stroke-width="2.5"/>

  <!-- Traffic light dots -->
  <circle cx="122" cy="124" r="9" fill="#f85149"/>
  <circle cx="150" cy="124" r="9" fill="#d29922"/>
  <circle cx="178" cy="124" r="9" fill="#3fb950"/>

  <!-- ===== TERMINAL PROMPT ===== -->
  <!-- Chevron > with glow -->
  <g filter="url(#glow)">
    <path d="M170 218 L305 280 L170 342"
          stroke="url(#chevGrad)" stroke-width="36"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Blinking cursor bar -->
  <rect x="324" y="264" width="11" height="32" rx="5.5" fill="url(#curGrad)" opacity="0.9"/>
</svg>
