<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- pocketctl Logo Mark — Terminal prompt ">" inside a pocket/phone outline -->
  <!-- Rounded phone silhouette -->
  <rect x="128" y="48" width="256" height="416" rx="48" ry="48"
        stroke="#58a6ff" stroke-width="18" fill="none"/>
  <!-- Home indicator bar at bottom -->
  <rect x="216" y="430" width="80" height="6" rx="3" fill="#58a6ff" opacity="0.5"/>
  <!-- Terminal prompt ">" symbol — bold, geometric -->
  <path d="M208 200 L304 256 L208 312" stroke="#58a6ff" stroke-width="24"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Cursor bar -->
  <rect x="320" y="296" width="8" height="24" rx="4" fill="#58a6ff" opacity="0.7"/>
</svg>
