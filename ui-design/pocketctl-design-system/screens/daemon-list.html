<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pocketctl — Daemon 列表</title>
<link rel="stylesheet" href="../css/shared.css">
<style>
  .daemon-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: var(--space-lg);
    margin-bottom: var(--space-sm);
    cursor: pointer;
    transition: background 0.1s;
  }
  .daemon-card:active { background: var(--hover-input); }
  .daemon-card .card-top {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    margin-bottom: var(--space-sm);
  }
  .daemon-card .hostname {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 17px;
    color: var(--fg);
    flex: 1;
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .daemon-card .hostname-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .daemon-card .alias-badge {
    display: none;
    font-size: 11px;
    font-weight: 500;
    color: var(--accent);
    background: rgba(88,166,255,0.1);
    border-radius: 4px;
    padding: 1px 5px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .daemon-card .hostname.has-alias .alias-badge { display: inline-block; }
  .daemon-card .edit-name-btn {
    background: none;
    border: none;
    color: var(--fg-tertiary);
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
    flex-shrink: 0;
  }
  .daemon-card:hover .edit-name-btn,
  .daemon-card .edit-name-btn:focus-visible { opacity: 1; }
  .daemon-card .edit-name-btn:hover { color: var(--accent); }
  /* Inline rename form */
  .daemon-card .rename-row {
    display: none;
    align-items: center;
    gap: 6px;
    margin-bottom: var(--space-sm);
    animation: fadeSlideIn 0.15s ease;
  }
  .daemon-card .rename-row.visible { display: flex; }
  .daemon-card .rename-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-family: var(--font-body);
    font-size: 15px;
    color: var(--fg);
    outline: none;
    transition: border-color 0.15s;
  }
  .daemon-card .rename-input:focus { border-color: var(--accent); }
  .daemon-card .rename-input::placeholder { color: var(--fg-tertiary); }
  .rename-action {
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--fg-tertiary);
    transition: color 0.15s;
  }
  .rename-action:hover { color: var(--fg); }
  .rename-action.confirm:hover { color: var(--success); }
  .rename-action.cancel:hover { color: var(--danger); }
  .daemon-card .reset-name-btn {
    background: none;
    border: none;
    color: var(--fg-tertiary);
    font-size: 11px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: var(--font-body);
    display: none;
    transition: color 0.15s;
  }
  .daemon-card .hostname.has-alias + .edit-name-btn { display: flex; }
  .daemon-card .reset-name-btn.visible { display: inline-block; }
  .daemon-card .reset-name-btn:hover { color: var(--accent); }
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .daemon-card .card-info {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    margin-bottom: var(--space-sm);
    flex-wrap: wrap;
  }
  .daemon-card .agent-tags {
    font-size: 14px;
    color: var(--fg-tertiary);
  }
  .daemon-card .session-count {
    font-size: 14px;
    color: var(--accent);
    font-weight: 500;
  }
  .daemon-card .card-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .daemon-card .last-active {
    font-size: 13px;
    color: var(--fg-secondary);
  }
  .daemon-card .chevron-right {
    color: var(--fg-tertiary);
    font-size: 14px;
  }
  .install-code {
    background: #010409;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: var(--space-md);
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--fg-secondary);
    text-align: left;
    line-height: 1.8;
    width: 100%;
    margin-bottom: var(--space-md);
  }
  .install-code .cmd { color: var(--success); }
  .copy-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--accent);
    font-family: var(--font-body);
    font-size: 14px;
    padding: var(--space-sm) var(--space-lg);
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: var(--space-xs);
  }
  .state-switcher {
    position: absolute;
    top: 60px;
    right: 8px;
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .state-switcher button {
    background: rgba(88,166,255,0.15);
    border: 1px solid rgba(88,166,255,0.3);
    color: var(--accent);
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-family: var(--font-mono);
  }
  .state-switcher button.active-state {
    background: var(--accent);
    color: var(--bg);
  }
  .state-panel { display: none; }
  .state-panel.active { display: block; }
  .avatar-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--fg-secondary);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-md) var(--space-lg);
  }
</style>
</head>
<body>
<div class="iphone-frame">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span class="time">9:41</span>
    <span class="icons">
      <svg viewBox="0 0 16 16" width="16" height="16"><path fill="#fff" d="M1 11.5h1v3H1zm3-2h1v5H4zm3-3h1v8H7zm3-2h1v10h-1zm3-2h1v12h-1z"/></svg>
      <svg viewBox="0 0 16 16" width="16" height="16"><path fill="#fff" d="M8 2a6 6 0 100 12A6 6 0 008 2z"/></svg>
      <svg viewBox="0 0 16 16" width="16" height="16"><rect x="1" y="4" width="14" height="9" rx="2" fill="none" stroke="#fff" stroke-width="1.5"/><rect x="3" y="6" width="8" height="5" rx="1" fill="#fff"/></svg>
    </span>
  </div>

  <div class="state-switcher">
    <button onclick="showState('normal')" class="active-state" id="btn-normal">正常</button>
    <button onclick="showState('empty')" id="btn-empty">空状态</button>
  </div>

  <div class="screen-content">
    <!-- Header -->
    <div class="large-title">我的主机</div>
    <div class="header-row" style="padding-top:0;margin-top:-8px;">
      <div style="font-size:13px;color:var(--fg-secondary);">2 台主机 · 1 台在线</div>
      <div class="avatar-btn">M</div>
    </div>

    <!-- ===== NORMAL STATE ===== -->
    <div class="state-panel active" id="panel-normal" style="padding:0 var(--space-lg);">
      <!-- Online daemon (with alias demo) -->
      <div class="daemon-card" id="daemon-0" data-default-name="MacBook-Pro">
        <div class="card-top">
          <span class="status-dot online"></span>
          <span class="hostname" id="hostname-0">
            <span class="hostname-text" id="display-name-0">MacBook-Pro</span>
            <span class="alias-badge" id="alias-badge-0">别名</span>
          </span>
          <button class="edit-name-btn" onclick="startRename(0)" title="编辑别名" aria-label="编辑别名">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="reset-name-btn" id="reset-0" onclick="resetName(0)" title="恢复默认名称">恢复默认</button>
          <span class="chip chip-online">在线</span>
        </div>
        <div class="rename-row" id="rename-row-0">
          <input class="rename-input" id="rename-input-0" type="text" placeholder="输入别名…" maxlength="32" onkeydown="handleRenameKey(event, 0)">
          <button class="rename-action confirm" onclick="confirmRename(0)" title="确认">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
          </button>
          <button class="rename-action cancel" onclick="cancelRename(0)" title="取消">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="card-info">
          <span class="agent-tags">Claude Code, Codex</span>
          <span class="session-count">3 个活跃会话</span>
        </div>
        <div class="card-bottom">
          <span class="last-active">最后活跃: 2 分钟前</span>
          <span class="chevron-right">›</span>
        </div>
      </div>

      <!-- Offline daemon -->
      <div class="daemon-card" id="daemon-1" data-default-name="Dev-Server">
        <div class="card-top">
          <span class="status-dot offline"></span>
          <span class="hostname" id="hostname-1">
            <span class="hostname-text" id="display-name-1">Dev-Server</span>
            <span class="alias-badge" id="alias-badge-1">别名</span>
          </span>
          <button class="edit-name-btn" onclick="startRename(1)" title="编辑别名" aria-label="编辑别名">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="reset-name-btn" id="reset-1" onclick="resetName(1)" title="恢复默认名称">恢复默认</button>
          <span class="chip chip-offline">离线</span>
        </div>
        <div class="rename-row" id="rename-row-1">
          <input class="rename-input" id="rename-input-1" type="text" placeholder="输入别名…" maxlength="32" onkeydown="handleRenameKey(event, 1)">
          <button class="rename-action confirm" onclick="confirmRename(1)" title="确认">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
          </button>
          <button class="rename-action cancel" onclick="cancelRename(1)" title="取消">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="card-info">
          <span class="agent-tags">Claude Code</span>
          <span class="session-count" style="color:var(--fg-tertiary);">0 个会话</span>
        </div>
        <div class="card-bottom">
          <span class="last-active">最后活跃: 3 天前</span>
          <span class="chevron-right">›</span>
        </div>
      </div>
    </div>

    <!-- ===== EMPTY STATE ===== -->
    <div class="state-panel" id="panel-empty">
      <div class="empty-state" style="padding-top:48px;">
        <div class="empty-icon">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#484f58" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <path d="M8 12h8M12 8v8"/>
          </svg>
        </div>
        <div class="empty-title">还没有注册主机</div>
        <div class="empty-subtitle" style="margin-bottom:var(--space-xl);">在你的开发机上运行以下命令安装 Daemon</div>
        <div class="install-code">
          <div><span class="cmd">curl</span> -fsSL https://pocketctl.me/install.sh | bash</div>
          <div><span class="cmd">pocketctl</span> login</div>
          <div><span class="cmd">pocketctl</span> daemon start</div>
        </div>
        <button class="copy-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          复制命令
        </button>
      </div>
    </div>
  </div>

  <div class="home-indicator"></div>
</div>

<script>
/* ---- state switcher ---- */
function showState(state) {
  document.querySelectorAll('.state-switcher button').forEach(b => b.classList.remove('active-state'));
  document.getElementById('btn-' + state).classList.add('active-state');
  document.querySelectorAll('.state-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + state).classList.add('active');
}

/* ---- alias storage ---- */
// In-memory store; real app would persist via API
const aliases = {};

function getCard(idx) {
  return {
    card:    document.getElementById('daemon-' + idx),
    host:    document.getElementById('hostname-' + idx),
    display: document.getElementById('display-name-' + idx),
    badge:   document.getElementById('alias-badge-' + idx),
    reset:   document.getElementById('reset-' + idx),
    row:     document.getElementById('rename-row-' + idx),
    input:   document.getElementById('rename-input-' + idx),
  };
}

function renderAlias(idx) {
  const c = getCard(idx);
  const alias = aliases[idx] || null;
  const defaultName = c.card.dataset.defaultName;
  c.display.textContent = alias || defaultName;
  if (alias) {
    c.host.classList.add('has-alias');
    c.reset.classList.add('visible');
  } else {
    c.host.classList.remove('has-alias');
    c.reset.classList.remove('visible');
  }
}

/* ---- rename flow ---- */
function startRename(idx) {
  const c = getCard(idx);
  c.row.classList.add('visible');
  c.input.value = aliases[idx] || '';
  c.input.focus();
}

function confirmRename(idx) {
  const c = getCard(idx);
  const val = c.input.value.trim();
  if (val) {
    aliases[idx] = val;
  } else {
    delete aliases[idx];
  }
  c.row.classList.remove('visible');
  renderAlias(idx);
}

function cancelRename(idx) {
  const c = getCard(idx);
  c.row.classList.remove('visible');
}

function resetName(idx) {
  delete aliases[idx];
  renderAlias(idx);
}

function handleRenameKey(e, idx) {
  if (e.key === 'Enter')  { e.preventDefault(); confirmRename(idx); }
  if (e.key === 'Escape') { cancelRename(idx); }
}
</script>
</body>
</html>
