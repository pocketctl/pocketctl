<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pocketctl — 登录页</title>
<link rel="stylesheet" href="../css/shared.css">
<style>
  .login-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 var(--space-2xl);
    height: 100%;
  }
  .login-logo { margin-bottom: 6px; }
  .login-tagline {
    font-size: 15px;
    color: var(--fg-secondary);
    text-align: center;
    margin-bottom: var(--space-3xl);
  }
  .login-form {
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: var(--space-lg);
  }
  .form-title {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 600;
    color: var(--fg);
    text-align: center;
    margin-bottom: var(--space-sm);
  }
  .phone-input-group {
    display: flex;
    gap: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .phone-input-group:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-muted);
  }
  .country-code {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 14px 12px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    color: var(--fg);
    font-size: 16px;
    font-weight: 500;
    white-space: nowrap;
    cursor: pointer;
  }
  .country-code .chevron { font-size: 10px; color: var(--fg-tertiary); }
  .phone-input {
    flex: 1;
    background: transparent;
    border: none;
    padding: 14px var(--space-md);
    color: var(--fg);
    font-size: 17px;
    font-family: var(--font-body);
    outline: none;
  }
  .phone-input::placeholder { color: var(--fg-tertiary); }
  .code-row {
    display: flex;
    gap: var(--space-sm);
  }
  .code-inputs {
    display: flex;
    gap: 6px;
    flex: 1;
  }
  .code-box {
    width: 40px;
    height: 48px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--fg);
    font-family: var(--font-mono);
    font-size: 20px;
    text-align: center;
    outline: none;
    transition: border-color 0.15s;
  }
  .code-box:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-muted);
  }
  .code-box.filled {
    border-color: var(--accent);
    background: var(--accent-muted);
  }
  .get-code-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 14px;
    font-family: var(--font-body);
    white-space: nowrap;
    cursor: pointer;
    padding: 0 4px;
  }
  .get-code-btn.disabled {
    color: var(--fg-tertiary);
    cursor: not-allowed;
  }
  .terms-text {
    font-size: 12px;
    color: var(--fg-tertiary);
    text-align: center;
    line-height: 1.6;
  }
  .terms-text a { color: var(--accent); text-decoration: none; }
  .social-btn {
    width: 56px;
    height: 56px;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s;
  }
  .social-btn:active { background: var(--hover-input); }
  .social-btn.disabled {
    opacity: 0.4;
    position: relative;
  }
  .social-btn .coming-soon {
    position: absolute;
    bottom: -20px;
    font-size: 10px;
    color: var(--fg-tertiary);
    white-space: nowrap;
  }
  .social-row {
    display: flex;
    gap: var(--space-xl);
    justify-content: center;
  }

  /* State variants container */
  .state-variant {
    display: none;
  }
  .state-variant.active {
    display: block;
  }

  /* State switcher (dev only) */
  .state-switcher {
    position: absolute;
    top: 60px;
    right: 8px;
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .state-switcher button {
    background: rgba(88,166,255,0.15);
    border: 1px solid rgba(88,166,255,0.3);
    color: var(--accent);
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-family: var(--font-mono);
  }
  .state-switcher button.active-state {
    background: var(--accent);
    color: var(--bg);
  }
</style>
</head>
<body>
<div class="iphone-frame">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span class="time">9:41</span>
    <span class="icons">
      <svg viewBox="0 0 16 16" width="16" height="16"><path fill="#fff" d="M1 11.5h1v3H1zm3-2h1v5H4zm3-3h1v8H7zm3-2h1v10h-1zm3-2h1v12h-1z"/></svg>
      <svg viewBox="0 0 16 16" width="16" height="16"><path fill="#fff" d="M8 2a6 6 0 100 12A6 6 0 008 2z"/></svg>
      <svg viewBox="0 0 16 16" width="16" height="16"><rect x="1" y="4" width="14" height="9" rx="2" fill="none" stroke="#fff" stroke-width="1.5"/><rect x="3" y="6" width="8" height="5" rx="1" fill="#fff"/></svg>
    </span>
  </div>

  <!-- State Switcher -->
  <div class="state-switcher">
    <button onclick="showState('normal')" class="active-state" id="btn-normal">正常</button>
    <button onclick="showState('error')" id="btn-error">错误</button>
    <button onclick="showState('countdown')" id="btn-countdown">倒计时</button>
    <button onclick="showState('loading')" id="btn-loading">加载中</button>
  </div>

  <div class="screen-content">
    <div class="login-wrap" style="padding-top:32px;">

      <!-- Logo -->
      <div class="login-logo">
        <svg width="48" height="48" viewBox="0 0 512 512" fill="none">
          <rect x="128" y="48" width="256" height="416" rx="48" ry="48" stroke="#58a6ff" stroke-width="18" fill="none"/>
          <path d="M208 200 L304 256 L208 312" stroke="#58a6ff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <rect x="320" y="296" width="8" height="24" rx="4" fill="#58a6ff" opacity="0.7"/>
        </svg>
      </div>
      <div style="font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--accent);margin-bottom:8px;">pocketctl</div>
      <div class="login-tagline">远程掌控你的 AI 编程助手</div>

      <!-- ========== ERROR BANNER ========== -->
      <div class="banner banner-error state-variant" id="error-banner" style="width:100%;max-width:340px;">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm-.75 4h1.5v5h-1.5V5zm.75 6.5a.75.75 0 110-1.5.75.75 0 010 1.5z"/></svg>
        验证码错误，请重新输入
      </div>

      <!-- ========== LOGIN FORM ========== -->
      <div class="login-form">
        <div class="form-title">登录</div>

        <!-- Phone number -->
        <div class="phone-input-group">
          <div class="country-code">
            +86 <span class="chevron">▼</span>
          </div>
          <input type="tel" class="phone-input" placeholder="请输入手机号"
                 id="phone-input" value="138 8888 8888">
        </div>

        <!-- Verification code -->
        <div class="code-row">
          <div class="code-inputs" id="code-inputs">
            <input type="text" class="code-box filled" maxlength="1" value="4">
            <input type="text" class="code-box filled" maxlength="1" value="8">
            <input type="text" class="code-box filled" maxlength="1" value="2">
            <input type="text" class="code-box" maxlength="1" id="code-active">
            <input type="text" class="code-box" maxlength="1">
            <input type="text" class="code-box" maxlength="1">
          </div>
          <button class="get-code-btn" id="get-code-btn">获取验证码</button>
        </div>

        <!-- Login button -->
        <button class="btn-primary" id="login-btn">
          <span id="login-btn-text">登录</span>
        </button>

        <!-- Terms -->
        <div class="terms-text">
          登录即同意<a href="#">《用户协议》</a>和<a href="#">《隐私政策》</a>
        </div>
      </div>

      <!-- ========== SOCIAL LOGIN ========== -->
      <div class="divider-with-text">其他登录方式</div>
      <div class="social-row" style="margin-bottom:auto;">
        <!-- Apple Sign In -->
        <div class="social-btn">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="#fff">
            <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
          </svg>
        </div>
        <!-- WeChat -->
        <div class="social-btn disabled">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="#07C160">
            <path d="M8.69 2C4.34 2 .75 5.06.75 8.8c0 2.14 1.12 4.06 2.88 5.34l-.72 2.16 2.52-1.26c.82.23 1.68.36 2.58.36.32 0 .64-.02.95-.06A6.5 6.5 0 018.5 13c0-3.87 3.58-7 8-7 .37 0 .73.02 1.08.07C16.43 3.94 12.89 2 8.69 2zm-2.8 4.2a.9.9 0 110 1.8.9.9 0 010-1.8zm5.4 0a.9.9 0 110 1.8.9.9 0 010-1.8zM16.5 7c-3.87 0-7 2.69-7 6s3.13 6 7 6c.74 0 1.45-.1 2.12-.3l2.08 1.04-.6-1.8A5.6 5.6 0 0023.25 13c0-3.31-3.13-6-7-6zm-2.2 3.6a.75.75 0 110 1.5.75.75 0 010-1.5zm4.4 0a.75.75 0 110 1.5.75.75 0 010-1.5z"/>
          </svg>
          <span class="coming-soon">即将开通</span>
        </div>
      </div>

    </div>
  </div>

  <div class="home-indicator"></div>
</div>

<script>
  function showState(state) {
    document.querySelectorAll('.state-switcher button').forEach(b => b.classList.remove('active-state'));
    document.getElementById('btn-' + state).classList.add('active-state');

    const banner = document.getElementById('error-banner');
    const btn = document.getElementById('login-btn');
    const btnText = document.getElementById('login-btn-text');
    const codeBtn = document.getElementById('get-code-btn');
    const codeBoxes = document.querySelectorAll('.code-box');

    // Reset
    banner.classList.remove('active');
    btn.disabled = false;
    btnText.textContent = '登录';
    codeBtn.classList.remove('disabled');
    codeBtn.textContent = '获取验证码';
    codeBoxes.forEach((b, i) => {
      if (i < 3) { b.value = ['4','8','2'][i]; b.classList.add('filled'); }
      else { b.value = ''; b.classList.remove('filled'); }
    });

    switch(state) {
      case 'error':
        banner.classList.add('active');
        codeBoxes.forEach(b => { b.value = ''; b.classList.remove('filled'); });
        break;
      case 'countdown':
        codeBtn.classList.add('disabled');
        codeBtn.textContent = '47s 后重发';
        codeBoxes.forEach((b, i) => {
          if (i < 3) { b.value = ['4','8','2'][i]; b.classList.add('filled'); }
        });
        break;
      case 'loading':
        btn.disabled = true;
        btnText.innerHTML = '<span class="spinner" style="margin-right:8px;vertical-align:middle;"></span>登录中...';
        codeBoxes.forEach((b, i) => {
          if (i < 6) { b.value = ['4','8','2','7','1','5'][i]; b.classList.add('filled'); }
        });
        break;
    }
  }

  // Initialize: show normal state
  showState('normal');
</script>
</body>
</html>
