<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pocketctl — 登录</title>
<link rel="stylesheet" href="../css/web-shared.css">
<style>
  .login-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  /* Background atmosphere */
  .login-page::before {
    content: '';
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent-muted) 0%, transparent 70%);
    top: -200px;
    right: -150px;
    opacity: 0.5;
    pointer-events: none;
  }

  .login-page::after {
    content: '';
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(35, 134, 54, 0.08) 0%, transparent 70%);
    bottom: -100px;
    left: -100px;
    opacity: 0.6;
    pointer-events: none;
  }

  .login-container {
    width: 100%;
    max-width: 420px;
    position: relative;
    z-index: 1;
  }

  /* Theme toggle */
  .login-theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 10;
  }

  /* Logo area */
  .login-brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 40px;
  }

  .login-logo-wrapper {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 16px;
    box-shadow: var(--shadow-md);
  }

  .login-logo-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .login-brand .brand-name {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 6px;
  }

  .login-brand .brand-tagline {
    font-size: 15px;
    color: var(--fg-secondary);
    text-align: center;
  }

  /* Card */
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    padding: 32px;
    box-shadow: var(--shadow-lg);
    transition: background var(--transition), border-color var(--transition);
  }

  .login-card .card-title {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 600;
    color: var(--fg);
    text-align: center;
    margin-bottom: 24px;
  }

  /* Tab switcher */
  .login-tabs {
    display: flex;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 3px;
    margin-bottom: 24px;
  }

  .login-tab {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 6px;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    background: transparent;
    color: var(--fg-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .login-tab.active {
    background: var(--surface);
    color: var(--fg);
    box-shadow: var(--shadow-sm);
  }

  .login-tab:hover:not(.active) {
    color: var(--fg);
  }

  .login-tab svg { width: 16px; height: 16px; }

  /* Form */
  .login-form {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .form-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--fg-secondary);
    margin-bottom: 6px;
  }

  .code-row {
    display: flex;
    gap: 8px;
  }

  .code-row .input-field { flex: 1; }

  .get-code-btn {
    white-space: nowrap;
    padding: 10px 16px;
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    color: var(--accent);
    font-family: var(--font-body);
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }

  .get-code-btn:hover { background: var(--surface-hover); border-color: var(--border-light); }
  .get-code-btn.disabled { color: var(--fg-tertiary); cursor: not-allowed; }

  /* Email domain suffix */
  .email-input-group {
    display: flex;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    transition: border-color 0.15s;
    background: var(--bg);
  }

  .email-input-group:focus-within {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px var(--accent-muted);
  }

  .email-input-group input {
    flex: 1;
    background: none;
    border: none;
    padding: 10px 14px;
    color: var(--fg);
    font-size: 14px;
    font-family: var(--font-body);
    outline: none;
    min-width: 0;
  }

  .email-input-group input::placeholder { color: var(--fg-tertiary); }

  .email-input-group .email-suffix {
    display: flex;
    align-items: center;
    padding: 0 14px;
    color: var(--fg-tertiary);
    font-size: 14px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    white-space: nowrap;
  }

  /* Login button */
  .login-btn {
    width: 100%;
    padding: 14px;
    background: var(--primary-btn);
    color: #fff;
    border: none;
    border-radius: var(--radius-md);
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    margin-top: 4px;
  }

  .login-btn:hover { background: var(--primary-btn-hover); }
  .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Terms */
  .terms-text {
    font-size: 12px;
    color: var(--fg-tertiary);
    text-align: center;
    line-height: 1.6;
  }

  .terms-text a { color: var(--accent); text-decoration: none; }
  .terms-text a:hover { text-decoration: underline; }

  /* Divider */
  .divider-text {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--fg-tertiary);
    font-size: 13px;
    padding: 8px 0;
  }

  .divider-text::before,
  .divider-text::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Social login */
  .social-row {
    display: flex;
    gap: 12px;
    justify-content: center;
  }

  .social-btn {
    width: 52px;
    height: 52px;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    position: relative;
  }

  .social-btn:hover { background: var(--surface-hover); border-color: var(--border-light); }

  .social-btn svg { width: 24px; height: 24px; }

  .social-btn.disabled { opacity: 0.4; }

  .social-btn .coming-soon {
    position: absolute;
    bottom: -18px;
    font-size: 10px;
    color: var(--fg-tertiary);
    white-space: nowrap;
  }

  /* Error banner */
  .error-banner {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-radius: var(--radius-md);
    background: rgba(248,81,73,0.1);
    color: var(--error);
    font-size: 13px;
    margin-bottom: 0;
  }

  .error-banner.visible { display: flex; }

  .error-banner svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* Tab content */
  .tab-content { display: none; }
  .tab-content.active { display: flex; flex-direction: column; gap: 16px; }

  /* Footer */
  .login-footer {
    text-align: center;
    margin-top: 32px;
    font-size: 13px;
    color: var(--fg-tertiary);
  }

  .login-footer a { color: var(--accent); text-decoration: none; }

  /* Responsive */
  @media (max-width: 480px) {
    .login-card { padding: 24px 20px; }
    .login-brand .brand-name { font-size: 24px; }
  }
</style>
</head>
<body>
  <!-- Theme Toggle -->
  <div class="login-theme-toggle">
    <button class="theme-toggle" onclick="toggleTheme()" title="切换主题" id="theme-btn">
      <svg id="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
      </svg>
      <svg id="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
        <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>
    </button>
  </div>

  <div class="login-page">
    <div class="login-container">
      <!-- Brand -->
      <div class="login-brand">
        <div class="login-logo-wrapper">
          <img id="login-logo" src="../assets/logo-github-org.svg" alt="pocketctl">
        </div>
        <div class="brand-name">pocketctl</div>
        <div class="brand-tagline">远程掌控你的 AI 编程助手</div>
      </div>

      <!-- Login Card -->
      <div class="login-card">
        <div class="card-title">登录你的账户</div>

        <!-- Error Banner -->
        <div class="error-banner" id="error-banner">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm-.75 4h1.5v5h-1.5V5zm.75 6.5a.75.75 0 110-1.5.75.75 0 010 1.5z"/></svg>
          <span id="error-text">验证码错误，请重新输入</span>
        </div>

        <!-- Login Tabs -->
        <div class="login-tabs">
          <button class="login-tab active" onclick="switchTab('phone')" id="tab-phone">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><circle cx="12" cy="18" r="1"/></svg>
            手机号登录
          </button>
          <button class="login-tab" onclick="switchTab('email')" id="tab-email">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 4L12 13 2 4"/></svg>
            邮箱登录
          </button>
        </div>

        <!-- Phone Login Form -->
        <div class="tab-content active" id="content-phone">
          <div>
            <div class="form-label">手机号</div>
            <div class="input-group">
              <div class="input-prefix">+86 <span class="chevron">▼</span></div>
              <input type="tel" placeholder="请输入手机号" id="phone-input">
            </div>
          </div>
          <div>
            <div class="form-label">验证码</div>
            <div class="code-row">
              <input type="text" class="input-field" placeholder="6 位验证码" id="phone-code" maxlength="6" style="font-family:var(--font-mono);letter-spacing:4px;">
              <button class="get-code-btn" id="phone-code-btn" onclick="sendCode('phone')">获取验证码</button>
            </div>
          </div>
          <button class="login-btn" id="phone-login-btn">登录</button>
        </div>

        <!-- Email Login Form -->
        <div class="tab-content" id="content-email">
          <div>
            <div class="form-label">邮箱地址</div>
            <div class="email-input-group">
              <input type="text" placeholder="name" id="email-input">
              <div class="email-suffix">@gmail.com</div>
            </div>
          </div>
          <div>
            <div class="form-label">验证码</div>
            <div class="code-row">
              <input type="text" class="input-field" placeholder="6 位验证码" id="email-code" maxlength="6" style="font-family:var(--font-mono);letter-spacing:4px;">
              <button class="get-code-btn" id="email-code-btn" onclick="sendCode('email')">获取验证码</button>
            </div>
          </div>
          <button class="login-btn" id="email-login-btn">登录</button>
        </div>

        <!-- Terms -->
        <div class="terms-text" style="margin-top:8px;">
          登录即同意<a href="#">《用户协议》</a>和<a href="#">《隐私政策》</a>
        </div>

        <!-- Social Login -->
        <div class="divider-text">其他登录方式</div>
        <div class="social-row">
          <button class="social-btn" title="Apple 登录">
            <svg viewBox="0 0 24 24" fill="var(--fg)">
              <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
            </svg>
          </button>
          <button class="social-btn" title="GitHub 登录">
            <svg viewBox="0 0 24 24" fill="var(--fg)">
              <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
            </svg>
          </button>
          <button class="social-btn disabled" title="微信登录">
            <svg viewBox="0 0 24 24" fill="#07C160">
              <path d="M8.69 2C4.34 2 .75 5.06.75 8.8c0 2.14 1.12 4.06 2.88 5.34l-.72 2.16 2.52-1.26c.82.23 1.68.36 2.58.36.32 0 .64-.02.95-.06A6.5 6.5 0 018.5 13c0-3.87 3.58-7 8-7 .37 0 .73.02 1.08.07C16.43 3.94 12.89 2 8.69 2zm-2.8 4.2a.9.9 0 110 1.8.9.9 0 010-1.8zm5.4 0a.9.9 0 110 1.8.9.9 0 010-1.8zM16.5 7c-3.87 0-7 2.69-7 6s3.13 6 7 6c.74 0 1.45-.1 2.12-.3l2.08 1.04-.6-1.8A5.6 5.6 0 0023.25 13c0-3.31-3.13-6-7-6zm-2.2 3.6a.75.75 0 110 1.5.75.75 0 010-1.5zm4.4 0a.75.75 0 110 1.5.75.75 0 010-1.5z"/>
            </svg>
            <span class="coming-soon">即将开通</span>
          </button>
        </div>
      </div>

      <!-- Footer -->
      <div class="login-footer">
        还没有账户？<a href="#">注册</a> · <a href="#">帮助中心</a>
      </div>
    </div>
  </div>

<script>
  // ---- Theme ----
  function getTheme() {
    return document.documentElement.getAttribute('data-theme') || 'dark';
  }

  function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('pocketctl-theme', theme);
    updateThemeUI(theme);
    updateLogo(theme);
  }

  function toggleTheme() {
    setTheme(getTheme() === 'dark' ? 'light' : 'dark');
  }

  function updateThemeUI(theme) {
    const sun = document.getElementById('icon-sun');
    const moon = document.getElementById('icon-moon');
    if (theme === 'dark') {
      sun.style.display = 'none';
      moon.style.display = 'block';
    } else {
      sun.style.display = 'block';
      moon.style.display = 'none';
    }
  }

  function updateLogo(theme) {
    const logo = document.getElementById('login-logo');
    logo.src = theme === 'dark'
      ? '../assets/logo-github-org.svg'
      : '../assets/logo-github-org-light.svg';
  }

  // Init theme
  const saved = localStorage.getItem('pocketctl-theme');
  if (saved) setTheme(saved);
  else { updateThemeUI(getTheme()); updateLogo(getTheme()); }

  // ---- Tab switch ----
  function switchTab(tab) {
    document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    document.getElementById('content-' + tab).classList.add('active');
    // Hide error on tab switch
    document.getElementById('error-banner').classList.remove('visible');
  }

  // ---- Send code ----
  function sendCode(type) {
    const btn = document.getElementById(type + '-code-btn');
    if (btn.classList.contains('disabled')) return;
    btn.classList.add('disabled');
    let seconds = 60;
    btn.textContent = seconds + 's 后重发';
    const timer = setInterval(() => {
      seconds--;
      btn.textContent = seconds + 's 后重发';
      if (seconds <= 0) {
        clearInterval(timer);
        btn.classList.remove('disabled');
        btn.textContent = '获取验证码';
      }
    }, 1000);
  }
</script>
</body>
</html>
