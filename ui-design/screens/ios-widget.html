<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pocketctl — iOS Widget 概览</title>
<link rel="stylesheet" href="../css/shared.css">
<style>
  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    padding: 40px 20px;
  }
  .widget-title {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 600;
    color: var(--fg);
    margin-bottom: -24px;
  }
  .widget-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
  }
  .widget-size-label {
    font-size: 13px;
    color: var(--fg-secondary);
    text-align: center;
    width: 100%;
    margin-bottom: -24px;
    font-family: var(--font-mono);
  }

  /* iOS Widget base styles */
  .widget {
    border-radius: 24px;
    overflow: hidden;
    position: relative;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
  }

  /* Small widget: 158×158 (logical) */
  .widget-small {
    width: 158px;
    height: 158px;
    background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
  }
  .widget-small .ws-inner {
    padding: 16px;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .widget-small .ws-top {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: auto;
  }
  .widget-small .ws-logo {
    width: 24px; height: 24px;
    border-radius: 6px;
    background: var(--accent-muted);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .widget-small .ws-app-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--fg);
  }
  .widget-small .ws-center {
    display: flex;
    align-items: baseline;
    gap: 4px;
  }
  .widget-small .ws-count {
    font-size: 44px;
    font-weight: 700;
    color: var(--fg);
    line-height: 1;
  }
  .widget-small .ws-unit {
    font-size: 14px;
    color: var(--fg-secondary);
  }
  .widget-small .ws-bottom {
    margin-top: auto;
    font-size: 11px;
    color: var(--fg-tertiary);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .widget-small .ws-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--success);
  }

  /* Medium widget: 348×158 */
  .widget-medium {
    width: 348px;
    height: 158px;
    background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
  }
  .widget-medium .wm-inner {
    padding: 16px;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .widget-medium .wm-top {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 10px;
  }
  .widget-medium .wm-logo {
    width: 24px; height: 24px;
    border-radius: 6px;
    background: var(--accent-muted);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .widget-medium .wm-app-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--fg);
  }
  .widget-medium .wm-daemon-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }
  .widget-medium .wm-daemon {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: rgba(22, 27, 34, 0.8);
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .widget-medium .wm-daemon .wm-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .widget-medium .wm-daemon .wm-dot.online { background: var(--success); }
  .widget-medium .wm-daemon .wm-dot.offline { background: var(--fg-tertiary); }
  .widget-medium .wm-daemon .wm-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--fg);
    flex: 1;
  }
  .widget-medium .wm-daemon .wm-sessions {
    font-size: 12px;
    color: var(--accent);
  }

  /* Large widget: 348×358 */
  .widget-large {
    width: 348px;
    height: 358px;
    background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
  }
  .widget-large .wl-inner {
    padding: 16px;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .widget-large .wl-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .widget-large .wl-left {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .widget-large .wl-logo {
    width: 24px; height: 24px;
    border-radius: 6px;
    background: var(--accent-muted);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .widget-large .wl-app-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--fg);
  }
  .widget-large .wl-refresh {
    font-size: 11px;
    color: var(--fg-tertiary);
  }
  .widget-large .wl-sessions {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow: hidden;
  }
  .widget-large .wl-session {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: rgba(22, 27, 34, 0.8);
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .widget-large .wl-session .wl-status {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .widget-large .wl-session .wl-status.running { background: var(--success); }
  .widget-large .wl-session .wl-status.busy { background: var(--warning); }
  .widget-large .wl-session .wl-status.idle { background: #eab308; }
  .widget-large .wl-session .wl-status.completed { background: var(--accent); }
  .widget-large .wl-session .wl-sess-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--fg);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .widget-large .wl-session .wl-sess-time {
    font-size: 11px;
    color: var(--fg-tertiary);
    flex-shrink: 0;
  }
  .widget-large .wl-footer {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }
  .widget-large .wl-daemon-pill {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    background: rgba(22, 27, 34, 0.8);
    border-radius: 6px;
    font-size: 11px;
    color: var(--fg-secondary);
  }
  .widget-large .wl-daemon-pill .pill-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
  }

  /* Widget background subtle texture */
  .widget::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 30% 20%, rgba(88,166,255,0.03) 0%, transparent 60%);
    pointer-events: none;
  }
</style>
</head>
<body>

<!-- Small Widget -->
<div class="widget-size-label">小号 Widget · 158 × 158</div>
<div class="widget-row">
  <div class="widget widget-small">
    <div class="ws-inner">
      <div class="ws-top">
        <div class="ws-logo">
          <svg width="14" height="14" viewBox="0 0 512 512" fill="none">
            <rect x="128" y="48" width="256" height="416" rx="48" ry="48" stroke="#58a6ff" stroke-width="24" fill="none"/>
            <path d="M208 200 L304 256 L208 312" stroke="#58a6ff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
        </div>
        <span class="ws-app-name">pocketctl</span>
      </div>
      <div class="ws-center">
        <span class="ws-count">3</span>
        <span class="ws-unit">个活跃会话</span>
      </div>
      <div class="ws-bottom">
        <span class="ws-dot"></span>
        MacBook-Pro · 在线
      </div>
    </div>
  </div>
</div>

<!-- Medium Widget -->
<div class="widget-size-label" style="margin-top:16px;">中号 Widget · 348 × 158</div>
<div class="widget-row">
  <div class="widget widget-medium">
    <div class="wm-inner">
      <div class="wm-top">
        <div class="wm-logo">
          <svg width="14" height="14" viewBox="0 0 512 512" fill="none">
            <rect x="128" y="48" width="256" height="416" rx="48" ry="48" stroke="#58a6ff" stroke-width="24" fill="none"/>
            <path d="M208 200 L304 256 L208 312" stroke="#58a6ff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
        </div>
        <span class="wm-app-name">pocketctl</span>
      </div>
      <div class="wm-daemon-list">
        <div class="wm-daemon">
          <span class="wm-dot online"></span>
          <span class="wm-name">MacBook-Pro</span>
          <span class="wm-sessions">3 个会话</span>
        </div>
        <div class="wm-daemon">
          <span class="wm-dot offline"></span>
          <span class="wm-name">Dev-Server</span>
          <span class="wm-sessions" style="color:var(--fg-tertiary);">离线</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Large Widget -->
<div class="widget-size-label" style="margin-top:16px;">大号 Widget · 348 × 358</div>
<div class="widget-row">
  <div class="widget widget-large">
    <div class="wl-inner">
      <div class="wl-top">
        <div class="wl-left">
          <div class="wl-logo">
            <svg width="14" height="14" viewBox="0 0 512 512" fill="none">
              <rect x="128" y="48" width="256" height="416" rx="48" ry="48" stroke="#58a6ff" stroke-width="24" fill="none"/>
              <path d="M208 200 L304 256 L208 312" stroke="#58a6ff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
          </div>
          <span class="wl-app-name">pocketctl</span>
        </div>
        <span class="wl-refresh">刚刚更新</span>
      </div>
      <div class="wl-sessions">
        <div class="wl-session">
          <span class="wl-status running"></span>
          <span class="wl-sess-name">重构用户认证模块</span>
          <span class="wl-sess-time">3分钟前</span>
        </div>
        <div class="wl-session">
          <span class="wl-status busy"></span>
          <span class="wl-sess-name">修复 CI 构建错误</span>
          <span class="wl-sess-time">8分钟前</span>
        </div>
        <div class="wl-session">
          <span class="wl-status idle"></span>
          <span class="wl-sess-name">编写 API 文档</span>
          <span class="wl-sess-time">1小时前</span>
        </div>
        <div class="wl-session">
          <span class="wl-status completed"></span>
          <span class="wl-sess-name">sess_a3f7b2c1</span>
          <span class="wl-sess-time">2小时前</span>
        </div>
      </div>
      <div class="wl-footer">
        <div class="wl-daemon-pill">
          <span class="pill-dot" style="background:var(--success);"></span>
          MacBook-Pro
        </div>
        <div class="wl-daemon-pill">
          <span class="pill-dot" style="background:var(--fg-tertiary);"></span>
          Dev-Server
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
