<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pocketctl — 扫码登录</title>
<link rel="stylesheet" href="../css/shared.css">
<style>
  .scan-screen {
    background: #000;
    display: flex; flex-direction: column;
    height: 100%;
    position: relative;
  }
  /* 顶部导航 */
  .scan-nav {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 20px 8px;
    color: #fff;
  }
  .scan-back {
    display: flex; align-items: center; gap: 4px;
    color: var(--accent); text-decoration: none;
    font-size: 15px; font-weight: 500;
  }
  .scan-title { font-family: var(--font-display); font-size: 17px; font-weight: 600; color: #fff; }

  /* 取景区 */
  .scan-viewport {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px; gap: 24px;
    background:
      radial-gradient(circle at 50% 45%, rgba(88,166,255,0.08), transparent 60%),
      #000;
  }
  .scan-frame {
    position: relative; width: 240px; height: 240px;
    border-radius: 16px;
    background: rgba(255,255,255,0.02);
  }
  .corner { position: absolute; width: 30px; height: 30px; border: 3px solid var(--accent); }
  .corner.tl { top: -1px; left: -1px; border-right: 0; border-bottom: 0; border-top-left-radius: 14px; }
  .corner.tr { top: -1px; right: -1px; border-left: 0; border-bottom: 0; border-top-right-radius: 14px; }
  .corner.bl { bottom: -1px; left: -1px; border-right: 0; border-top: 0; border-bottom-left-radius: 14px; }
  .corner.br { bottom: -1px; right: -1px; border-left: 0; border-top: 0; border-bottom-right-radius: 14px; }

  .scan-line {
    position: absolute; left: 10px; right: 10px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent) 20%, var(--accent) 80%, transparent);
    box-shadow: 0 0 10px var(--accent), 0 0 20px rgba(88,166,255,0.4);
    border-radius: 2px;
    animation: scan-move 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  @keyframes scan-move {
    0%, 100% { top: 12px; opacity: 0.9; }
    50% { top: 218px; opacity: 0.9; }
  }
  .show-result .scan-line { animation-play-state: paused; opacity: 0.3; }

  .scan-hint {
    font-size: 14px; color: rgba(255,255,255,0.7);
    text-align: center; line-height: 1.5;
  }
  .scan-hint strong { color: var(--accent); font-weight: 600; }

  /* 识别结果浮层 */
  .scan-result {
    position: absolute; left: 16px; right: 16px; bottom: 90px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 20px;
    box-shadow: 0 -8px 40px rgba(0,0,0,0.5);
    transform: translateY(120%); opacity: 0;
    transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1), opacity 0.3s;
    pointer-events: none;
  }
  .show-result .scan-result { transform: translateY(0); opacity: 1; pointer-events: auto; }
  .scan-result-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .src-icon {
    width: 44px; height: 44px; border-radius: var(--radius-md);
    background: var(--accent-muted); color: var(--accent);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .src-title { font-size: 15px; font-weight: 600; color: var(--fg); }
  .src-meta { font-size: 12px; color: var(--fg-tertiary); margin-top: 2px; font-family: var(--font-mono); }
  .src-warn { font-size: 12px; color: var(--fg-secondary); line-height: 1.5; margin-bottom: 16px; }
  .src-actions { display: flex; gap: 10px; }
  .src-actions button { flex: 1; padding: 12px; border-radius: var(--radius-md); font-size: 15px; font-weight: 600; cursor: pointer; font-family: var(--font-body); }
  .btn-cancel { background: var(--surface-active); color: var(--fg-secondary); border: 1px solid var(--border); }
  .btn-confirm { background: var(--accent); color: #0d1117; border: none; }

  /* 底部说明 */
  .scan-foot {
    padding: 16px 24px 36px; text-align: center;
    font-size: 12px; color: rgba(255,255,255,0.45);
    line-height: 1.5;
  }

  /* 设计稿状态切换器 */
  .state-switcher {
    position: absolute; top: 12px; right: 12px; z-index: 60;
    display: flex; gap: 4px; background: rgba(255,255,255,0.1);
    backdrop-filter: blur(8px); padding: 4px; border-radius: 8px;
  }
  .state-switcher button {
    padding: 6px 12px; border: none; background: transparent;
    color: rgba(255,255,255,0.6); font-size: 12px; border-radius: 5px;
    cursor: pointer; font-family: var(--font-body);
  }
  .state-switcher button.active-state { background: var(--accent); color: #fff; }
</style>
</head>
<body>
<div class="iphone-frame">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span class="time">9:41</span>
    <span class="icons">
      <svg viewBox="0 0 16 16" width="16" height="16"><path fill="#fff" d="M1 11.5h1v3H1zm3-2h1v5H4zm3-3h1v8H7zm3-2h1v10h-1zm3-2h1v12h-1z"/></svg>
      <svg viewBox="0 0 16 16" width="16" height="16"><path fill="#fff" d="M8 2a6 6 0 100 12A6 6 0 008 2z"/></svg>
      <svg viewBox="0 0 16 16" width="16" height="16"><rect x="1" y="4" width="14" height="9" rx="2" fill="none" stroke="#fff" stroke-width="1.5"/><rect x="3" y="6" width="8" height="5" rx="1" fill="#fff"/></svg>
    </span>
  </div>

  <!-- State Switcher（设计稿审阅用） -->
  <div class="state-switcher">
    <button onclick="setState(false)" class="active-state" id="btn-scan">扫描中</button>
    <button onclick="setState(true)" id="btn-result">已识别</button>
  </div>

  <div class="screen-content scan-screen" id="scan-screen">
    <!-- 顶部导航 -->
    <div class="scan-nav">
      <a href="login.html" class="scan-back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
        返回
      </a>
      <div class="scan-title">扫描二维码</div>
    </div>

    <!-- 取景区 -->
    <div class="scan-viewport">
      <div class="scan-frame">
        <span class="corner tl"></span><span class="corner tr"></span>
        <span class="corner bl"></span><span class="corner br"></span>
        <div class="scan-line"></div>
      </div>
      <div class="scan-hint">将<strong>网页端</strong>显示的二维码对准取景框<br>扫描后在 App 内确认即可授权登录</div>
    </div>

    <!-- 识别结果 -->
    <div class="scan-result">
      <div class="scan-result-head">
        <div class="src-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        </div>
        <div>
          <div class="src-title">MacBook Pro · Chrome</div>
          <div class="src-meta">登录请求 · IP 192.168.1.100 · 刚刚</div>
        </div>
      </div>
      <div class="src-warn">确认在以上设备登录 pocketctl 网页端？确认后该浏览器将获得你的账户访问权限。</div>
      <div class="src-actions">
        <button class="btn-cancel" onclick="setState(false)">取消</button>
        <button class="btn-confirm" onclick="alert('已授权 · 网页端登录成功')">确认登录</button>
      </div>
    </div>

    <div class="scan-foot">扫码授权后，网页端将自动登录 · 仅对当前设备有效</div>
  </div>

  <div class="home-indicator"></div>
</div>

<script>
  function setState(showResult) {
    var screen = document.getElementById('scan-screen');
    if (showResult) screen.classList.add('show-result');
    else screen.classList.remove('show-result');
    document.getElementById('btn-scan').classList.toggle('active-state', !showResult);
    document.getElementById('btn-result').classList.toggle('active-state', showResult);
  }
</script>
</body>
</html>
