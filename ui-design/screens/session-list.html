<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pocketctl — Session 列表</title>
<link rel="stylesheet" href="../css/shared.css">
<style>
  .session-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: var(--space-md) var(--space-lg);
    margin-bottom: var(--space-sm);
    cursor: pointer;
    transition: background 0.1s, border-color 0.15s;
  }
  .session-card:active { background: var(--hover-input); }
  .session-card .card-main {
    display: flex;
    align-items: flex-start;
    gap: var(--space-md);
  }
  .session-card .session-title {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 16px;
    color: var(--fg);
    margin-bottom: 7px;
    line-height: 1.3;
  }
  .session-card .session-title.mono {
    font-family: var(--font-mono);
    font-size: 14px;
    color: #79c0ff;
  }

  /* ---- agent 类型 + 模型名（新增） ---- */
  .session-meta {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 7px; flex-wrap: wrap;
  }
  .agent-pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 8px; border-radius: var(--radius-full);
    font-size: 11px; font-weight: 600;
  }
  .agent-pill .ap-dot { width: 6px; height: 6px; border-radius: 50%; }
  .agent-pill.claude { background: rgba(88,166,255,0.12); color: var(--accent-hover); }
  .agent-pill.codex { background: rgba(63,185,80,0.12); color: var(--success); }
  .agent-pill.opencode { background: rgba(192,132,252,0.12); color: var(--sub-agent); }
  .agent-pill.claude .ap-dot { background: var(--accent); }
  .agent-pill.codex .ap-dot { background: var(--success); }
  .agent-pill.opencode .ap-dot { background: var(--sub-agent); }
  .model-name {
    font-family: var(--font-mono); font-size: 11px; color: var(--fg-tertiary);
    display: inline-flex; align-items: center; gap: 6px;
    font-variant-numeric: tabular-nums;
  }
  .model-name::before {
    content: ''; width: 3px; height: 3px; border-radius: 50%;
    background: var(--fg-tertiary); opacity: 0.5;
  }

  .session-card .badges {
    display: flex;
    gap: 6px;
    margin-bottom: 7px;
    flex-wrap: wrap;
  }
  .session-card .timestamp {
    font-size: 12px;
    color: var(--fg-tertiary);
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: var(--font-mono);
  }
  .session-card .timestamp svg { width: 11px; height: 11px; opacity: 0.7; }

  .exited-banner {
    background: var(--warning-bg);
    border: 1px solid rgba(210, 153, 34, 0.3);
    border-radius: var(--radius-md);
    padding: var(--space-md) var(--space-lg);
    margin-bottom: var(--space-sm);
    display: flex;
    align-items: center;
    gap: var(--space-md);
    font-size: 14px;
    color: var(--warning);
  }
  .exited-banner .resume-btn {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--accent);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }
  .daemon-status-bar {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    padding: var(--space-sm) var(--space-lg);
    font-size: 13px;
    color: var(--fg-secondary);
    margin-bottom: var(--space-sm);
  }
  .new-session-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--primary-btn);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #fff;
    font-size: 18px;
    font-weight: 500;
    line-height: 1;
  }
  .state-switcher {
    position: absolute;
    top: 60px;
    right: 8px;
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .state-switcher button {
    background: rgba(88,166,255,0.15);
    border: 1px solid rgba(88,166,255,0.3);
    color: var(--accent);
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-family: var(--font-mono);
  }
  .state-switcher button.active-state {
    background: var(--accent);
    color: var(--bg);
  }
  .state-panel { display: none; }
  .state-panel.active { display: block; }
</style>
</head>
<body>
<div class="iphone-frame">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span class="time">9:41</span>
    <span class="icons">
      <svg viewBox="0 0 16 16" width="16" height="16"><path fill="#fff" d="M1 11.5h1v3H1zm3-2h1v5H4zm3-3h1v8H7zm3-2h1v10h-1zm3-2h1v12h-1z"/></svg>
      <svg viewBox="0 0 16 16" width="16" height="16"><path fill="#fff" d="M8 2a6 6 0 100 12A6 6 0 008 2z"/></svg>
      <svg viewBox="0 0 16 16" width="16" height="16"><rect x="1" y="4" width="14" height="9" rx="2" fill="none" stroke="#fff" stroke-width="1.5"/><rect x="3" y="6" width="8" height="5" rx="1" fill="#fff"/></svg>
    </span>
  </div>

  <div class="state-switcher">
    <button onclick="showState('normal')" class="active-state" id="btn-normal">正常</button>
    <button onclick="showState('empty')" id="btn-empty">空状态</button>
  </div>

  <!-- Navigation Bar -->
  <div class="nav-bar">
    <button class="back-btn">
      <svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M10 2L2 10L10 18"/></svg>
      我的主机
    </button>
    <span class="nav-title">m3-pro</span>
    <button class="new-session-btn">+</button>
  </div>

  <!-- Daemon Status Bar -->
  <div class="daemon-status-bar">
    <span class="status-dot online" style="width:8px;height:8px;"></span>
    在线 · 最后心跳 30 秒前
  </div>

  <div class="screen-content" style="height:calc(844px - 54px - 44px - 32px - 34px);">
    <!-- ===== NORMAL STATE ===== -->
    <div class="state-panel active" id="panel-normal" style="padding:0 var(--space-lg);">
      <!-- Exited session banner -->
      <div class="exited-banner">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L1 21h22L12 2zm0 4l7.53 13H4.47L12 6zm-1 5v4h2v-4h-2zm0 6v2h2v-2h-2z"/></svg>
        会话已退出：用户手动终止
        <button class="resume-btn">恢复会话</button>
      </div>

      <!-- Session: Running -->
      <div class="session-card">
        <div class="card-main">
          <span class="status-dot running" style="margin-top:5px;"></span>
          <div style="flex:1;">
            <div class="session-title">重构用户认证模块</div>
            <div class="session-meta">
              <span class="agent-pill claude"><span class="ap-dot"></span>Claude Code</span>
              <span class="model-name">Sonnet 4.5</span>
            </div>
            <div class="badges">
              <span class="chip chip-terminal">终端</span>
              <span class="chip chip-sub-agent">3 子智能体</span>
            </div>
            <div class="timestamp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>3 分钟前</div>
          </div>
        </div>
      </div>

      <!-- Session: Busy -->
      <div class="session-card">
        <div class="card-main">
          <span class="status-dot busy" style="margin-top:5px;"></span>
          <div style="flex:1;">
            <div class="session-title">修复 CI 构建错误</div>
            <div class="session-meta">
              <span class="agent-pill codex"><span class="ap-dot"></span>Codex</span>
              <span class="model-name">GPT-5</span>
            </div>
            <div class="badges">
              <span class="chip chip-terminal">终端</span>
            </div>
            <div class="timestamp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>8 分钟前</div>
          </div>
        </div>
      </div>

      <!-- Session: Completed -->
      <div class="session-card">
        <div class="card-main">
          <span class="status-dot completed" style="margin-top:5px;"></span>
          <div style="flex:1;">
            <div class="session-title mono">sess_a3f7b2c1</div>
            <div class="session-meta">
              <span class="agent-pill claude"><span class="ap-dot"></span>Claude Code</span>
              <span class="model-name">Opus 4.8</span>
            </div>
            <div class="badges">
              <span class="chip chip-web">Web</span>
            </div>
            <div class="timestamp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>1 小时前</div>
          </div>
        </div>
      </div>

      <!-- Session: Error -->
      <div class="session-card">
        <div class="card-main">
          <span class="status-dot error" style="margin-top:5px;"></span>
          <div style="flex:1;">
            <div class="session-title">部署生产环境</div>
            <div class="session-meta">
              <span class="agent-pill codex"><span class="ap-dot"></span>Codex</span>
              <span class="model-name">GPT-5</span>
            </div>
            <div class="badges">
              <span class="chip chip-terminal">终端</span>
            </div>
            <div class="timestamp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>2 小时前</div>
          </div>
        </div>
      </div>

      <!-- Session: Idle -->
      <div class="session-card">
        <div class="card-main">
          <span class="status-dot idle" style="margin-top:5px;"></span>
          <div style="flex:1;">
            <div class="session-title">编写 API 文档</div>
            <div class="session-meta">
              <span class="agent-pill opencode"><span class="ap-dot"></span>OpenCode</span>
              <span class="model-name">DeepSeek V3</span>
            </div>
            <div class="badges">
              <span class="chip chip-web">Web</span>
              <span class="chip chip-sub-agent">1 子智能体</span>
            </div>
            <div class="timestamp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>3 小时前</div>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== EMPTY STATE ===== -->
    <div class="state-panel" id="panel-empty">
      <div class="empty-state" style="padding-top:80px;">
        <div class="empty-icon">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#484f58" stroke-width="1.5">
            <path d="M12 2a3 3 0 00-3 3v1H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V8a2 2 0 00-2-2h-5V5a3 3 0 00-3-3zm0 2a1 1 0 011 1v1h-2V5a1 1 0 011-1z"/>
          </svg>
        </div>
        <div class="empty-title">暂无活跃会话</div>
        <div class="empty-subtitle">点击右上角 + 创建新的 AI 编程会话</div>
      </div>
    </div>
  </div>

  <div class="home-indicator"></div>
</div>

<script>
function showState(state) {
  document.querySelectorAll('.state-switcher button').forEach(b => b.classList.remove('active-state'));
  document.getElementById('btn-' + state).classList.add('active-state');
  document.querySelectorAll('.state-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + state).classList.add('active');
}
</script>
</body>
</html>
