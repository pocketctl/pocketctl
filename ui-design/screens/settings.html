<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pocketctl — 设置</title>
<link rel="stylesheet" href="../css/shared.css">
<style>
  /* 右上角扫码按钮 */
  .nav-scan-btn {
    display: flex; align-items: center; justify-content: center;
    width: 40px; height: 40px;
    color: var(--accent); text-decoration: none;
    border-radius: var(--radius-md);
    transition: opacity 0.15s;
  }
  .nav-scan-btn:active { opacity: 0.55; }

  .profile-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: var(--space-xl) var(--space-lg) var(--space-2xl);
  }
  .profile-avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--surface);
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 600;
    color: var(--fg-secondary);
    margin-bottom: var(--space-md);
  }
  .profile-phone {
    font-family: var(--font-body);
    font-size: 17px;
    color: var(--fg);
    font-weight: 500;
    margin-bottom: 4px;
  }
  .profile-edit {
    font-size: 14px;
    color: var(--accent);
    background: none;
    border: none;
    cursor: pointer;
  }
  .section-title {
    font-size: 13px;
    color: var(--fg-secondary);
    text-transform: uppercase;
    letter-spacing: 0.3px;
    padding: var(--space-sm) var(--space-lg);
    margin-top: var(--space-lg);
  }
  .settings-group {
    background: var(--surface);
    border-radius: var(--radius-lg);
    margin: 0 var(--space-lg) var(--space-sm);
    overflow: hidden;
  }
  .settings-row {
    display: flex;
    align-items: center;
    padding: 14px var(--space-lg);
    min-height: 44px;
    gap: var(--space-md);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .settings-row:last-child { border-bottom: none; }
  .settings-row:active { background: var(--hover-input); }
  .settings-row .row-icon {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .settings-row .row-label { flex: 1; font-size: 16px; color: var(--fg); }
  .settings-row .row-value {
    font-size: 15px;
    color: var(--fg-secondary);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .settings-row .row-value .bound { color: var(--success); }
  .settings-row .row-value .unbound { color: var(--fg-tertiary); }
  .settings-row .chevron {
    color: var(--fg-tertiary);
    font-size: 13px;
    margin-left: 4px;
  }
  .settings-row.danger .row-label {
    color: var(--error);
    text-align: center;
    flex: 1;
    font-weight: 500;
  }

  /* Plan badge */
  .plan-badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border-radius: var(--radius-full);
    font-size: 12px;
    font-weight: 600;
  }
  .plan-badge.free { background: rgba(72,79,88,0.3); color: var(--fg-tertiary); }
  .plan-badge.pro { background: var(--accent-muted); color: var(--accent); }

  .plan-desc {
    font-size: 13px;
    color: var(--fg-tertiary);
    padding: 4px var(--space-lg) 0;
  }
  .upgrade-row {
    display: flex;
    align-items: center;
    padding: 14px var(--space-lg);
    gap: var(--space-md);
    cursor: pointer;
  }
  .upgrade-row:active { background: var(--hover-input); }
  .upgrade-row .upgrade-icon {
    width: 28px; height: 28px;
    border-radius: 6px;
    background: var(--accent-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
  }
  .upgrade-row .upgrade-text {
    flex: 1;
  }
  .upgrade-row .upgrade-text .upgrade-title {
    font-size: 16px;
    color: var(--accent);
    font-weight: 500;
  }
  .upgrade-row .upgrade-text .upgrade-features {
    font-size: 12px;
    color: var(--fg-tertiary);
    margin-top: 2px;
  }
  .upgrade-row .chevron { color: var(--accent); }

  /* Daemon mini card */
  .daemon-mini {
    display: flex;
    align-items: center;
    padding: 12px var(--space-lg);
    gap: var(--space-sm);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .daemon-mini:last-of-type { border-bottom: none; }
  .daemon-mini .hostname { flex: 1; font-size: 15px; color: var(--fg); }
  .add-daemon {
    display: flex;
    align-items: center;
    padding: 12px var(--space-lg);
    gap: var(--space-sm);
    color: var(--accent);
    font-size: 15px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="iphone-frame">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span class="time">9:41</span>
    <span class="icons">
      <svg viewBox="0 0 16 16" width="16" height="16"><path fill="#fff" d="M1 11.5h1v3H1zm3-2h1v5H4zm3-3h1v8H7zm3-2h1v10h-1zm3-2h1v12h-1z"/></svg>
      <svg viewBox="0 0 16 16" width="16" height="16"><path fill="#fff" d="M8 2a6 6 0 100 12A6 6 0 008 2z"/></svg>
      <svg viewBox="0 0 16 16" width="16" height="16"><rect x="1" y="4" width="14" height="9" rx="2" fill="none" stroke="#fff" stroke-width="1.5"/><rect x="3" y="6" width="8" height="5" rx="1" fill="#fff"/></svg>
    </span>
  </div>

  <!-- Navigation -->
  <div class="nav-bar">
    <button class="back-btn">
      <svg width="10" height="18" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M10 2L2 10L10 18"/></svg>
    </button>
    <span class="nav-title">设置</span>
    <a href="scan-login.html" class="nav-scan-btn" title="扫一扫" aria-label="扫一扫，授权网页端登录">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v3M14 20h3M20 20v.01"/></svg>
    </a>
  </div>

  <div class="screen-content">
    <!-- Profile -->
    <div class="profile-section">
      <div class="profile-avatar">M</div>
      <div class="profile-phone">dev@pocketctl.io</div>
      <button class="profile-edit">编辑资料</button>
    </div>

    <!-- Account Section -->
    <div class="section-title">账户</div>
    <div class="settings-group">
      <div class="settings-row">
        <div class="row-icon" style="background:var(--accent-muted);color:var(--accent);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>
        </div>
        <span class="row-label">邮箱</span>
        <span class="row-value">dev@pocketctl.io <span class="chevron">›</span></span>
      </div>
    </div>

    <!-- Daemons Section -->
    <div class="section-title">我的主机</div>
    <div class="settings-group">
      <div class="daemon-mini">
        <span class="status-dot online" style="width:8px;height:8px;"></span>
        <span class="hostname">MacBook-Pro</span>
        <span class="chip chip-online" style="font-size:11px;padding:2px 8px;">在线</span>
        <span class="chevron" style="color:var(--fg-tertiary);font-size:13px;">›</span>
      </div>
      <div class="daemon-mini">
        <span class="status-dot offline" style="width:8px;height:8px;"></span>
        <span class="hostname">Dev-Server</span>
        <span class="chip chip-offline" style="font-size:11px;padding:2px 8px;">离线</span>
        <span class="chevron" style="color:var(--fg-tertiary);font-size:13px;">›</span>
      </div>
      <div class="add-daemon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        注册新主机
      </div>
    </div>

    <!-- Subscription Section -->
    <div class="section-title">订阅</div>
    <div class="settings-group">
      <div class="settings-row">
        <span class="row-label">当前方案</span>
        <span class="row-value"><span class="plan-badge free">免费版</span></span>
      </div>
    </div>
    <div class="plan-desc">免费版：1 台主机，基础监控</div>
    <div style="margin-top:var(--space-md);">
      <div class="settings-group">
        <div class="upgrade-row">
          <div class="upgrade-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.56 5.82 22 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>
          </div>
          <div class="upgrade-text">
            <div class="upgrade-title">升级专业版 ¥48/月</div>
            <div class="upgrade-features">无限主机 · 推送通知 · 实时消息</div>
          </div>
          <span class="chevron">›</span>
        </div>
      </div>
    </div>

    <!-- Other Section -->
    <div class="section-title">其他</div>
    <div class="settings-group">
      <div class="settings-row">
        <span class="row-label">帮助与反馈</span>
        <span class="row-value"><span class="chevron">›</span></span>
      </div>
      <div class="settings-row">
        <span class="row-label">关于 pocketctl</span>
        <span class="row-value"><span class="chevron">›</span></span>
      </div>
      <div class="settings-row">
        <span class="row-label">隐私政策</span>
        <span class="row-value"><span class="chevron">›</span></span>
      </div>
      <div class="settings-row">
        <span class="row-label">用户协议</span>
        <span class="row-value"><span class="chevron">›</span></span>
      </div>
    </div>

    <!-- Logout -->
    <div style="margin-top:var(--space-xl);margin-bottom:var(--space-3xl);">
      <div class="settings-group">
        <div class="settings-row danger">
          <span class="row-label">退出登录</span>
        </div>
      </div>
    </div>
  </div>

  <div class="home-indicator"></div>
</div>
</body>
</html>
