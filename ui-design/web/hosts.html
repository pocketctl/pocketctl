<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pocketctl — 主机</title>
<link rel="stylesheet" href="../css/web-shared.css">
<style>
  /* ---- 单栏布局：卡片网格 + 全宽详情 ---- */
  .hosts-layout {
    display: flex; flex-direction: column; gap: 20px;
  }

  /* 搜索 + 筛选条 */
  .host-controls {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 4px; flex-wrap: wrap;
  }
  .host-filter { display: flex; gap: 2px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 3px; }
  .host-filter button {
    padding: 5px 11px; border: none; background: none;
    color: var(--fg-secondary); font-size: 13px; font-weight: 500;
    font-family: var(--font-body); border-radius: 5px; cursor: pointer;
    transition: background 0.12s, color 0.12s;
  }
  .host-filter button.active { background: var(--surface-active); color: var(--fg); }
  .host-filter button .count { color: var(--fg-tertiary); margin-left: 4px; font-variant-numeric: tabular-nums; }

  .host-search { position: relative; flex: 1; max-width: 360px; min-width: 180px; }
  .host-search input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: 8px 12px 8px 34px;
    color: var(--fg); font-size: 13px; outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .host-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-muted); }
  .host-search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--fg-tertiary); pointer-events: none; }

  /* 主机卡片网格 */
  .host-cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }
  .host-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 16px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    position: relative;
  }
  .host-card:hover { border-color: var(--border-light); background: var(--surface-hover); }
  .host-card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-muted); }
  .host-card .hc-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .host-card .hc-icon {
    width: 36px; height: 36px; border-radius: var(--radius-md);
    background: var(--surface-active); display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; color: var(--fg-secondary);
  }
  .host-card .hc-icon svg { width: 18px; height: 18px; }
  .host-card .hc-info { flex: 1; min-width: 0; }
  .host-card .hc-name { font-size: 14px; font-weight: 600; color: var(--fg); display: flex; align-items: center; gap: 6px; }
  .host-card .hc-meta { font-size: 12px; color: var(--fg-tertiary); font-family: var(--font-mono); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .host-card .hc-foot { display: flex; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 1px solid var(--border); }
  .host-card .hc-sessions { font-size: 14px; font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums; }
  .host-card .hc-sess-label { font-size: 11px; color: var(--fg-tertiary); }
  .host-card .ss-more-btn { position: absolute; top: 10px; right: 10px; }
  .host-card:hover .ss-more-btn { opacity: 1; }
  .host-cards-empty { padding: 48px 16px; text-align: center; color: var(--fg-tertiary); font-size: 13px; grid-column: 1 / -1; }

  /* 详情面板（全宽） */
  .host-detail-panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 28px;
    transition: background var(--transition), border-color var(--transition);
  }
  .host-detail-panel.empty { text-align: center; padding: 72px 24px; }
  .host-detail-panel.empty .empty-icon { font-size: 40px; color: var(--fg-tertiary); margin-bottom: 12px; }
  .host-detail-panel.empty .empty-title { font-size: 16px; font-weight: 600; color: var(--fg-secondary); margin-bottom: 6px; }
  .host-detail-panel.empty .empty-sub { font-size: 13px; color: var(--fg-tertiary); }

  /* 详情内双栏（≥900px） */
  .host-detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 28px 36px; }
  .host-detail-grid .hd-section-full { grid-column: 1 / -1; }

  /* ---- 选中主机后卡片收成标签栏 ---- */
  .hosts-selecting .host-cards-grid {
    display: flex; flex-wrap: nowrap; overflow-x: auto;
    gap: 6px; padding: 4px 0;
    scrollbar-width: none;
  }
  .hosts-selecting .host-cards-grid::-webkit-scrollbar { display: none; }
  .hosts-selecting .host-card {
    flex: 0 0 auto; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 12px; border-radius: var(--radius-full);
    font-size: 13px; min-width: 0;
  }
  .hosts-selecting .host-card .hc-head { margin: 0; gap: 6px; }
  .hosts-selecting .host-card .hc-icon,
  .hosts-selecting .host-card .hc-meta,
  .hosts-selecting .host-card .hc-foot,
  .hosts-selecting .host-card .ss-more-btn { display: none; }
  .hosts-selecting .host-card.selected { background: var(--accent-muted); border-color: var(--accent); color: var(--accent); }
  .hosts-selecting .host-card.selected .hc-name { color: var(--accent); }

  .hosts-deselect-btn {
    display: none; flex-shrink: 0;
    width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--fg-tertiary); cursor: pointer;
    align-items: center; justify-content: center;
    font-size: 16px; line-height: 1;
    transition: background 0.15s, color 0.15s;
  }
  .hosts-deselect-btn:hover { background: var(--surface-hover); color: var(--fg); }
  .hosts-selecting .hosts-deselect-btn { display: inline-flex; }

  .hd-header { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 4px; position: relative; }
  .hd-more-btn {
    position: absolute; top: 0; right: 0;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border: none; background: transparent;
    color: var(--fg-tertiary);
    border-radius: var(--radius-md);
    cursor: pointer;
    opacity: 0.4;
    transition: opacity 0.15s, background 0.15s, color 0.15s;
  }
  .hd-more-btn:hover, .hd-more-btn:focus-visible { opacity: 1; background: var(--surface-active); color: var(--fg); }
  .hd-icon { width: 48px; height: 48px; border-radius: var(--radius-md); background: var(--surface-active); display: flex; align-items: center; justify-content: center; color: var(--fg-secondary); flex-shrink: 0; }
  .hd-headinfo { flex: 1; min-width: 0; }
  .hd-title { font-size: 20px; font-weight: 700; color: var(--fg); letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .hd-sub { font-size: 13px; color: var(--fg-tertiary); font-family: var(--font-mono); margin-top: 4px; }
  .hd-status-row { margin: 16px 0 20px; }

  .hd-actions { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }

  .btn-danger {
    background: transparent; color: var(--error);
    border: 1px solid rgba(248, 81, 73, 0.4);
  }
  .btn-danger:hover:not(:disabled) { background: rgba(248, 81, 73, 0.1); border-color: var(--error); }
  [data-theme="light"] .btn-danger { border-color: rgba(207, 34, 46, 0.4); }
  [data-theme="light"] .btn-danger:hover:not(:disabled) { background: var(--error-bg); }
  .btn-danger:disabled { opacity: 0.4; cursor: not-allowed; }

  .hd-section { margin-bottom: 24px; }
  .hd-section:last-child { margin-bottom: 0; }
  .hd-section-title { font-size: 12px; font-weight: 600; color: var(--fg-tertiary); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }

  /* 资源监控条 */
  .resource-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .resource-row:last-child { margin-bottom: 0; }
  .resource-row .r-label { width: 44px; font-size: 13px; color: var(--fg-secondary); }
  .resource-row .r-bar { flex: 1; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
  .resource-row .r-fill { height: 100%; border-radius: 3px; transition: width 0.5s cubic-bezier(0.2, 0, 0, 1); }
  .resource-row .r-fill.ok { background: var(--success); }
  .resource-row .r-fill.warn { background: var(--warning); }
  .resource-row .r-fill.high { background: var(--error); }
  .resource-row .r-val { width: 44px; text-align: right; font-size: 13px; font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums; }
  .resource-row.offline .r-bar { background: var(--surface-active); }
  .resource-row.offline .r-val { color: var(--fg-tertiary); }

  /* 连接信息网格 */
  .conn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px 24px; }
  .conn-item .c-label { font-size: 11px; color: var(--fg-tertiary); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  .conn-item .c-val { font-size: 14px; color: var(--fg); font-family: var(--font-mono); }
  .conn-item .c-val.muted { color: var(--fg-tertiary); }

  /* 会话摘要 */
  .sess-summary { display: flex; align-items: center; gap: 20px; padding: 16px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-md); }
  .sess-summary .ss-block { display: flex; flex-direction: column; gap: 2px; }
  .sess-summary .ss-num { font-size: 24px; font-weight: 700; color: var(--fg); font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -0.01em; }
  .sess-summary .ss-num.accent { color: var(--accent); }
  .sess-summary .ss-label { font-size: 12px; color: var(--fg-tertiary); }
  .sess-summary .ss-divider { width: 1px; align-self: stretch; background: var(--border); }
  .sess-summary .ss-link { margin-left: auto; }

  /* 注册弹窗：安装命令 */
  .install-cmd {
    background: var(--code-bg); border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: 12px 14px;
    font-family: var(--font-mono); font-size: 13px; color: var(--success);
    margin: 12px 0; overflow-x: auto; white-space: nowrap;
  }
  .install-cmd .prompt { color: var(--fg-tertiary); user-select: none; margin-right: 6px; }
  .install-note { font-size: 12px; color: var(--fg-tertiary); line-height: 1.6; }

  /* ---- Agent 运行状态卡片 ---- */
  .agent-card {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-md); margin-bottom: 10px;
    transition: border-color 0.15s;
  }
  .agent-card:last-child { margin-bottom: 0; }
  .agent-card .ag-icon {
    width: 32px; height: 32px; border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 14px; font-weight: 700;
  }
  .agent-card .ag-icon.claude { background: rgba(88,166,255,0.15); color: var(--accent); }
  .agent-card .ag-icon.codex { background: rgba(63,185,80,0.15); color: var(--success); }
  .agent-card .ag-info { flex: 1; min-width: 0; }
  .agent-card .ag-name { font-size: 14px; font-weight: 600; color: var(--fg); display: flex; align-items: center; gap: 8px; }
  .agent-card .ag-version {
    font-family: var(--font-mono); font-size: 12px; color: var(--fg-secondary);
    display: inline-flex; align-items: center; gap: 4px;
  }
  .agent-card .ag-meta { font-size: 12px; color: var(--fg-tertiary); margin-top: 3px; }
  .agent-card .ag-tokens { font-family: var(--font-mono); font-size: 12px; color: var(--fg-tertiary); }
  .ag-upgrade-btn {
    flex-shrink: 0; padding: 5px 11px; border-radius: var(--radius-full);
    border: 1px solid var(--accent); background: var(--accent-muted);
    color: var(--accent); font-size: 12px; font-weight: 600; cursor: pointer;
    font-family: var(--font-body); transition: background 0.15s, color 0.15s;
    white-space: nowrap;
  }
  .ag-upgrade-btn:hover:not(:disabled) { background: var(--accent); color: #fff; }
  .ag-upgrade-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .ag-upgrade-btn.upgrading { background: var(--accent); color: #fff; opacity: 0.7; cursor: wait; }
  .ag-latest { color: var(--success); font-weight: 600; }
  .ag-outdated {
    color: var(--warning); font-weight: 600;
    display: inline-flex; align-items: center; gap: 3px;
  }
  .ag-outdated .ag-arrow { font-size: 10px; color: var(--fg-tertiary); }

  /* ---- Token 消耗 ---- */
  .token-overview {
    display: flex; gap: 16px; align-items: flex-start;
    margin-bottom: 16px; flex-wrap: wrap;
  }
  .token-stat {
    flex: 1; min-width: 100px;
    padding: 12px; background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-md);
  }
  .token-stat .tk-num {
    font-size: 22px; font-weight: 700; color: var(--fg);
    font-variant-numeric: tabular-nums; letter-spacing: -0.01em; line-height: 1;
  }
  .token-stat .tk-label { font-size: 11px; color: var(--fg-tertiary); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.06em; }
  .token-stat .tk-num.accent { color: var(--accent); }

  .session-token-list {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-md); overflow: hidden;
  }
  .session-token-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .session-token-row:last-child { border-bottom: none; }
  .session-token-row .st-title { flex: 1; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-token-row .st-tokens { font-family: var(--font-mono); font-size: 13px; color: var(--fg-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* 全局 token 概览条（页头） */
  .token-global-strip {
    display: flex; align-items: center; gap: 24px;
    padding: 10px 18px; background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    margin-bottom: 20px; font-size: 13px;
  }
  .token-global-strip .tg-item { display: flex; align-items: baseline; gap: 6px; }
  .token-global-strip .tg-num { font-size: 18px; font-weight: 700; color: var(--fg); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .token-global-strip .tg-label { color: var(--fg-tertiary); }
  .token-global-strip .tg-sep { width: 1px; height: 20px; background: var(--border); }

  @media (max-width: 900px) {
    .host-cards-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    .host-detail-grid { grid-template-columns: 1fr; }
    .conn-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 520px) {
    .host-controls { flex-direction: column; align-items: stretch; }
    .host-search { max-width: none; }
    .host-cards-grid { grid-template-columns: repeat(2, 1fr); }
    .host-filter { justify-content: space-between; }
  }

  /* a11y & polish（与 dashboard 一致的基础） */
  .btn:focus-visible, .btn-icon:focus-visible, .theme-toggle:focus-visible,
  .host-filter button:focus-visible, .host-card:focus-visible,
  .ss-more-btn:focus-visible, .host-search input:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .btn:active, .btn-icon:active, .theme-toggle:active,
  .host-filter button:active, .ss-more-btn:active { transform: translateY(1px); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important; animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<div class="app-layout">
  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <a href="dashboard.html" class="sidebar-logo">
      <img id="sidebar-logo" src="../assets/logo-github-org.svg" alt="pocketctl">
      <span class="brand-name">pocketctl</span>
    </a>
    <div class="sidebar-nav">
      <div class="sidebar-section-label">概览</div>
      <a href="dashboard.html" class="sidebar-link">
        <span class="link-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>
        <span class="link-text">仪表盘</span>
      </a>
      <a href="session-detail.html" class="sidebar-link">
        <span class="link-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></span>
        <span class="link-text">会话</span>
        <span class="badge">5</span>
      </a>
      <div class="sidebar-section-label">管理</div>
      <a href="hosts.html" class="sidebar-link active">
        <span class="link-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="3"/><path d="M7 2v20M17 2v20M2 12h20"/></svg></span>
        <span class="link-text">主机</span>
        <span class="badge" id="host-count-badge">4</span>
      </a>
      <a href="settings.html" class="sidebar-link">
        <span class="link-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></span>
        <span class="link-text">设置</span>
      </a>
    </div>
    <div class="sidebar-footer">
      <div class="sidebar-user" onclick="location.href='settings.html'">
        <div class="user-avatar">M</div>
        <div class="user-info">
          <div class="user-name">138****8888</div>
          <div class="user-plan">免费版</div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main -->
  <main class="main-content">
    <header class="topbar">
      <div class="topbar-breadcrumb"><span>管理</span><span class="sep">/</span><span class="current">主机</span></div>
      <div class="topbar-actions">
        <button class="btn btn-secondary" onclick="openRegisterModal()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          注册主机
        </button>
        <button class="theme-toggle" onclick="toggleTheme()" title="切换主题" aria-label="切换深色/浅色主题" id="theme-btn">
          <svg id="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
          <svg id="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
      </div>
    </header>

    <div class="page-container">
      <div class="page-header">
        <div>
          <h2 class="page-title">主机</h2>
          <div class="page-subtitle" id="host-summary">共 <span class="text-mono">4</span> 台 · <span class="text-success">3</span> 在线 · <span class="text-tertiary">1</span> 离线</div>
        </div>
      </div>

      <div class="token-global-strip" id="token-global"></div>

      <!-- 筛选 + 搜索 -->
      <div class="host-controls">
        <div class="host-filter" role="tablist" aria-label="按状态筛选主机">
          <button class="active" data-filter="all" role="tab" aria-selected="true">全部<span class="count" id="cnt-all">4</span></button>
          <button data-filter="online" role="tab" aria-selected="false">在线<span class="count" id="cnt-online">3</span></button>
          <button data-filter="offline" role="tab" aria-selected="false">离线<span class="count" id="cnt-offline">1</span></button>
        </div>
        <div class="host-search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="host-search-input" placeholder="搜索名称、IP 或系统…" aria-label="搜索主机">
        </div>
      </div>

      <div class="hosts-layout">
        <!-- 主机卡片网格（选中后收成标签栏，右附 ✕ 恢复） -->
        <div style="display:flex;align-items:center;gap:6px;">
          <div class="host-cards-grid" id="host-cards"></div>
          <button class="hosts-deselect-btn" id="hosts-deselect" title="取消选择，恢复全部卡片" aria-label="取消选择">✕</button>
        </div>

        <!-- 详情面板（全宽） -->
        <div class="host-detail-panel empty" id="host-detail">
          <div class="empty-icon">—</div>
          <div class="empty-title">请选择一台主机</div>
          <div class="empty-sub">查看连接信息、资源占用、Agent 版本、Token 消耗，或执行强制踢下线、重启等操作。</div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  /* ---- 主题（与 dashboard 一致） ---- */
  function getTheme() { return document.documentElement.getAttribute('data-theme') || 'dark'; }
  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('pocketctl-theme', t);
    updateThemeUI(t); updateLogo(t);
  }
  function toggleTheme() { setTheme(getTheme() === 'dark' ? 'light' : 'dark'); }
  function updateThemeUI(t) {
    document.getElementById('icon-sun').style.display = t === 'dark' ? 'none' : 'block';
    document.getElementById('icon-moon').style.display = t === 'dark' ? 'block' : 'none';
  }
  function updateLogo(t) {
    document.getElementById('sidebar-logo').src = t === 'dark' ? '../assets/logo-github-org.svg' : '../assets/logo-github-org-light.svg';
  }
  const saved = localStorage.getItem('pocketctl-theme');
  if (saved) setTheme(saved); else { updateThemeUI(getTheme()); updateLogo(getTheme()); }

  /* ---- 主机数据 ---- */
  const HOSTS = [
    { id:'h1', name:'MacBook-Pro', ip:'192.168.1.100', port:22, os:'macOS 14.4', arch:'arm64', status:'online',
      agents: [
        { name:'Claude Code', version:'2.3.1', latest:'2.4.0', tokens:{ total:1250000, today:48000 } },
        { name:'Codex', version:'1.8.0', latest:'1.8.0', tokens:{ total:320000, today:12000 } }
      ],
      tokens: { total:1570000, today:60000, thisWeek:120000, thisMonth:1200000 },
      sessions: [
        { title:'重构用户认证模块', tokens:48000, status:'running' },
        { title:'修复 CI 构建错误', tokens:12000, status:'busy' },
        { title:'sess_a3f7b2c1', tokens:1500, status:'completed' }
      ],
      active:3, total:12, heartbeat:'2 分钟前', uptime:'14 天 3 小时', daemonVer:'0.8.2', cpu:34, mem:62, disk:47 },
    { id:'h2', name:'Dev-Server', ip:'10.0.0.50', port:22, os:'Ubuntu 22.04', arch:'x86_64', status:'offline',
      agents: [
        { name:'Claude Code', version:'2.1.0', latest:'2.4.0', tokens:{ total:890000, today:0 } }
      ],
      tokens: { total:890000, today:0, thisWeek:0, thisMonth:890000 },
      sessions: [],
      active:0, total:5, heartbeat:'3 天前', uptime:'—', daemonVer:'0.8.0', cpu:null, mem:null, disk:58 },
    { id:'h3', name:'CI-Runner', ip:'172.16.4.8', port:2222, os:'Arch Linux', arch:'x86_64', status:'online',
      agents: [
        { name:'Codex', version:'1.7.5', latest:'1.8.0', tokens:{ total:560000, today:24000 } }
      ],
      tokens: { total:560000, today:24000, thisWeek:56000, thisMonth:380000 },
      sessions: [
        { title:'部署生产环境', tokens:24000, status:'busy' }
      ],
      active:1, total:8, heartbeat:'12 分钟前', uptime:'6 天 11 小时', daemonVer:'0.8.2', cpu:78, mem:45, disk:82 },
    { id:'h4', name:'Home-NAS', ip:'192.168.1.20', port:22, os:'TrueNAS Scale', arch:'x86_64', status:'online',
      agents: [
        { name:'Claude Code', version:'2.3.1', latest:'2.4.0', tokens:{ total:310000, today:8000 } }
      ],
      tokens: { total:310000, today:8000, thisWeek:72000, thisMonth:150000 },
      sessions: [],
      active:0, total:3, heartbeat:'1 分钟前', uptime:'48 天 2 小时', daemonVer:'0.7.9', cpu:12, mem:38, disk:91 }
  ];

  function hostTotalTokens() {
    return HOSTS.reduce(function (s, h) { return s + (h.tokens ? h.tokens.total : 0); }, 0);
  }
  function hostTodayTokens() {
    return HOSTS.reduce(function (s, h) { return s + (h.tokens ? h.tokens.today : 0); }, 0);
  }
  function hostWeekTokens() {
    return HOSTS.reduce(function (s, h) { return s + (h.tokens ? h.tokens.thisWeek : 0); }, 0);
  }
  function hostMonthTokens() {
    return HOSTS.reduce(function (s, h) { return s + (h.tokens ? h.tokens.thisMonth : 0); }, 0);
  }
  function formatTokens(n) {
    if (n == null) return '—';
    if (n >= 1000000) return (n / 1000000).toFixed(2) + 'M';
    if (n >= 1000) return (n / 1000).toFixed(0) + 'K';
    return String(n);
  }
  function versionDot(v) { return v.replace(/\./g, '·'); }

  const STATUS = {
    online: { label: '在线', chip: 'chip-online', dot: 'online' },
    offline: { label: '离线', chip: 'chip-offline', dot: 'offline' },
    reconnecting: { label: '重启中', chip: 'chip-busy', dot: 'busy' }
  };

  const HOST_ICONS = {
    server: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><circle cx="6" cy="6" r="1" fill="currentColor"/><circle cx="6" cy="18" r="1" fill="currentColor"/></svg>',
    laptop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
    nas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h4"/></svg>'
  };
  function iconFor(h) {
    if (/mac|win|laptop|book/i.test(h.name + h.os)) return HOST_ICONS.laptop;
    if (/nas|true/i.test(h.name + h.os)) return HOST_ICONS.nas;
    return HOST_ICONS.server;
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  /* ---- 状态 ---- */
  let selectedId = null;
  let filter = 'all';
  let query = '';

  /* ---- 渲染列表 ---- */
  function getFiltered() {
    return HOSTS.filter(h => {
      if (filter === 'online' && h.status !== 'online') return false;
      if (filter === 'offline' && h.status === 'online') return false;
      if (query) {
        const q = query.toLowerCase();
        if (!(h.name.toLowerCase().includes(q) || h.ip.includes(q) || h.os.toLowerCase().includes(q))) return false;
      }
      return true;
    });
  }

  function renderList() {
    const grid = document.getElementById('host-cards');
    const items = getFiltered();
    document.getElementById('cnt-all').textContent = HOSTS.length;
    document.getElementById('cnt-online').textContent = HOSTS.filter(h => h.status === 'online').length;
    document.getElementById('cnt-offline').textContent = HOSTS.filter(h => h.status !== 'online').length;
    const on = HOSTS.filter(h => h.status === 'online').length;
    const off = HOSTS.length - on;
    document.getElementById('host-summary').innerHTML =
      '共 <span class="text-mono">' + HOSTS.length + '</span> 台 · <span class="text-success">' + on + '</span> 在线 · <span class="text-tertiary">' + off + '</span> 离线';
    document.getElementById('host-count-badge').textContent = HOSTS.length;
    renderGlobalTokens();

    if (!items.length) {
      grid.innerHTML = '<div class="host-cards-empty">没有匹配的主机</div>';
      return;
    }
    grid.innerHTML = items.map(h => {
      const st = STATUS[h.status] || STATUS.offline;
      const sel = h.id === selectedId ? ' selected' : '';
      return '<div class="host-card' + sel + '" data-id="' + h.id + '" tabindex="0" role="button" aria-label="' + esc(h.name) + ' ' + st.label + '">' +
        '<div class="hc-head">' +
          '<span class="status-dot ' + st.dot + '"></span>' +
          '<div class="hc-icon">' + iconFor(h) + '</div>' +
          '<div class="hc-info">' +
            '<div class="hc-name">' + esc(h.name) + '</div>' +
            '<div class="hc-meta">' + esc(h.ip) + ' · ' + esc(h.os) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="hc-foot">' +
          '<div><span class="hc-sessions">' + h.active + '</span> <span class="hc-sess-label">活跃会话</span></div>' +
          '<span class="chip ' + st.chip + '" style="font-size:11px;">' + st.label + '</span>' +
        '</div>' +
        '<button class="ss-more-btn" type="button" title="更多操作" aria-label="更多操作" data-id="' + h.id + '">' + ICON_MORE + '</button>' +
      '</div>';
    }).join('');
  }

  /* ---- 渲染详情 ---- */
  function renderDetail() {
    const panel = document.getElementById('host-detail');
    if (!selectedId) {
      document.querySelector('.hosts-layout').classList.remove('hosts-selecting');
      panel.className = 'host-detail-panel empty';
      panel.innerHTML = '<div class="empty-icon">—</div><div class="empty-title">从左侧选择一台主机</div><div class="empty-sub">查看连接信息、资源占用，或执行强制踢下线、重启等操作。</div>';
      return;
    }
    const h = HOSTS.find(x => x.id === selectedId);
    if (!h) return;
    const st = STATUS[h.status] || STATUS.offline;
    const isOnline = h.status === 'online';
    const isRestarting = h.status === 'reconnecting';

    function resRow(label, val) {
      if (val == null) {
        return '<div class="resource-row offline"><span class="r-label">' + label + '</span><div class="r-bar"></div><span class="r-val">—</span></div>';
      }
      const cls = val >= 80 ? 'high' : (val >= 60 ? 'warn' : 'ok');
      return '<div class="resource-row"><span class="r-label">' + label + '</span>' +
        '<div class="r-bar"><div class="r-fill ' + cls + '" style="width:' + val + '%"></div></div>' +
        '<span class="r-val">' + val + '%</span></div>';
    }

    panel.className = 'host-detail-panel';
    panel.innerHTML =
      '<div class="hd-header">' +
        '<button class="hd-more-btn" type="button" title="更多操作" aria-label="更多操作" onclick="event.stopPropagation();openHostMenu(this,\'' + h.id + '\');this.style.opacity=\'1\'">' + ICON_MORE + '</button>' +
        '<div class="hd-icon">' + iconFor(h) + '</div>' +
        '<div class="hd-headinfo">' +
          '<div class="hd-title">' + esc(h.name) +
            '<span class="status-pill" style="background:var(--' + (isOnline ? 'success' : (isRestarting ? 'warning' : 'fg-tertiary')) + '-bg);color:var(--' + (isOnline ? 'success' : (isRestarting ? 'warning' : 'fg-tertiary')) + ');">' +
              (isOnline ? '<span class="pulse"></span>' : '') + st.label + '</span>' +
          '</div>' +
          '<div class="hd-sub">' + esc(h.ip) + ' · ' + esc(h.os) + ' · ' + esc(h.arch) + '</div>' +
        '</div>' +
      '</div>' +

      '<div class="hd-actions">' +
        (isOnline
          ? '<button class="btn btn-secondary" onclick="restartHost(\'' + h.id + '\')">' + I_RESTART + '重启 daemon</button>' +
            '<button class="btn btn-danger" onclick="forceOffline(\'' + h.id + '\')">' + I_POWER + '强制踢下线</button>'
          : (isRestarting
              ? '<button class="btn btn-secondary" disabled>' + I_SPIN + '正在重启…</button>'
              : '<button class="btn btn-secondary" onclick="reconnectHost(\'' + h.id + '\')" title="等待主机端 daemon 重新连接">' + I_POWER + '等待重连</button>')) +
        '<a class="btn btn-secondary" href="session-detail.html">查看会话</a>' +
      '</div>' +

      '<div class="host-detail-grid">' +

        '<div class="hd-section">' +
          '<div class="hd-section-title">资源占用' + (isOnline ? '' : '（主机离线）') + '</div>' +
          resRow('CPU', h.cpu) + resRow('内存', h.mem) + resRow('磁盘', h.disk) +
        '</div>' +

        '<div class="hd-section">' +
          '<div class="hd-section-title">连接信息</div>' +
          '<div class="conn-grid">' +
            connItem('IP 地址', h.ip) +
            connItem('端口', h.port) +
            connItem('daemon 版本', 'v' + h.daemonVer) +
            connItem('系统', h.os) +
            connItem('运行时长', h.uptime, !isOnline) +
            connItem('最后心跳', h.heartbeat) +
          '</div>' +
        '</div>' +

        (h.agents && h.agents.length ? agSection(h, isOnline) : '') +

        (h.tokens ? tokenSection(h) : '') +

        '<div class="hd-section hd-section-full">' +
          '<div class="hd-section-title">会话</div>' +
          '<div class="sess-summary">' +
            '<div class="ss-block"><span class="ss-num accent">' + h.active + '</span><span class="ss-label">活跃会话</span></div>' +
            '<div class="ss-divider"></div>' +
            '<div class="ss-block"><span class="ss-num">' + h.total + '</span><span class="ss-label">历史总数</span></div>' +
            '<a class="btn btn-ghost ss-link" href="session-detail.html">查看全部 →</a>' +
          '</div>' +
        '</div>' +

      '</div>';

    // 触发资源条动画
    requestAnimationFrame(() => {
      panel.querySelectorAll('.r-fill').forEach(f => {
        const w = f.style.width; f.style.width = '0';
        requestAnimationFrame(() => { f.style.width = w; });
      });
    });
  }

  function connItem(label, val, muted) {
    return '<div class="conn-item"><div class="c-label">' + label + '</div><div class="c-val' + (muted ? ' muted' : '') + '">' + esc(val) + '</div></div>';
  }

  function agSection(h, isOnline) {
    var rows = h.agents.map(function (a) {
      var outdated = a.version !== a.latest;
      var cls = a.name === 'Codex' ? 'codex' : 'claude';
      var short = a.name === 'Codex' ? 'Cx' : 'CC';
      var vLabel = outdated
        ? '<span class="ag-outdated">v' + versionDot(a.version) + ' <span class="ag-arrow">→</span> v' + versionDot(a.latest) + '</span>'
        : '<span class="ag-latest">v' + versionDot(a.version) + ' ✓ 最新</span>';
      var upgradeBtn = '';
      if (outdated && isOnline) {
        var uid = h.id + '-' + a.name.replace(/\s/g, '');
        upgradeBtn = '<button class="ag-upgrade-btn" id="ag-btn-' + uid + '" onclick="upgradeAgent(\'' + h.id + '\',\'' + a.name + '\')">升级到 v' + versionDot(a.latest) + '</button>';
      }
      return '<div class="agent-card">' +
        '<div class="ag-icon ' + cls + '">' + short + '</div>' +
        '<div class="ag-info">' +
          '<div class="ag-name">' + esc(a.name) + vLabel + '</div>' +
          '<div class="ag-meta">消耗 <span class="ag-tokens">' + formatTokens(a.tokens.total) + '</span> 总 · <span class="ag-tokens">' + formatTokens(a.tokens.today) + '</span> 今日</div>' +
        '</div>' +
        upgradeBtn +
      '</div>';
    }).join('');
    return '<div class="hd-section">' +
      '<div class="hd-section-title">Agent 运行状态</div>' +
      rows +
    '</div>';
  }

  function tokenSection(h) {
    var html = '<div class="hd-section">' +
      '<div class="hd-section-title">Token 消耗</div>' +
      '<div class="token-overview">' +
        '<div class="token-stat"><div class="tk-num">' + formatTokens(h.tokens.total) + '</div><div class="tk-label">主机总计</div></div>' +
        '<div class="token-stat"><div class="tk-num accent">' + formatTokens(h.tokens.today) + '</div><div class="tk-label">今日消耗</div></div>' +
        '<div class="token-stat"><div class="tk-num">' + formatTokens(h.tokens.thisMonth) + '</div><div class="tk-label">本月消耗</div></div>' +
      '</div>';
    if (h.sessions && h.sessions.length) {
      html += '<div class="session-token-list">' +
        h.sessions.map(function (s) {
          return '<div class="session-token-row"><span class="st-title">' + esc(s.title) + '</span><span class="st-tokens">' + formatTokens(s.tokens) + ' tokens</span></div>';
        }).join('') +
      '</div>';
    } else {
      html += '<div class="session-token-list"><div class="session-token-row"><span class="st-title" style="color:var(--fg-tertiary);">无活跃会话</span></div></div>';
    }
    return html + '</div>';
  }

  function selectHost(id) {
    if (selectedId === id) {
      // 再次点击同一台 → 取消选择，恢复全卡片
      selectedId = null;
      document.querySelector('.hosts-layout').classList.remove('hosts-selecting');
      renderList();
      renderDetail();
    } else {
      selectedId = id;
      document.querySelector('.hosts-layout').classList.add('hosts-selecting');
      renderList();
      renderDetail();
    }
  }

  document.getElementById('hosts-deselect').addEventListener('click', function () {
    if (selectedId) selectHost(selectedId);  // 再次点击取消
  });

  /* ---- 全局 token 总览条 ---- */
  function renderGlobalTokens() {
    var el = document.getElementById('token-global');
    if (!el) return;
    el.innerHTML =
      '<div class="tg-item"><span class="tg-num">' + formatTokens(hostTotalTokens()) + '</span><span class="tg-label">总消耗</span></div>' +
      '<div class="tg-sep"></div>' +
      '<div class="tg-item"><span class="tg-num">' + formatTokens(hostTodayTokens()) + '</span><span class="tg-label">今日</span></div>' +
      '<div class="tg-sep"></div>' +
      '<div class="tg-item"><span class="tg-num">' + formatTokens(hostWeekTokens()) + '</span><span class="tg-label">本周</span></div>' +
      '<div class="tg-sep"></div>' +
      '<div class="tg-item"><span class="tg-num">' + formatTokens(hostMonthTokens()) + '</span><span class="tg-label">本月</span></div>';
  }

  function upgradeAgent(hostId, agentName) {
    var h = HOSTS.find(function (x) { return x.id === hostId; });
    if (!h) return;
    var a = h.agents.find(function (x) { return x.name === agentName; });
    if (!a || a.version === a.latest) return;
    var uid = hostId + '-' + agentName.replace(/\s/g, '');
    var btn = document.getElementById('ag-btn-' + uid);
    if (btn) { btn.textContent = '升级中…'; btn.classList.add('upgrading'); btn.disabled = true; }
    // 模拟升级延迟
    setTimeout(function () {
      a.version = a.latest;
      renderDetail();
      showToast('「' + h.name + '」的 ' + agentName + ' 已升级到 v' + versionDot(a.latest));
    }, 2200);
  }

  /* ---- 事件 ---- */
  document.getElementById('host-cards').addEventListener('click', e => {
    const more = e.target.closest('.ss-more-btn');
    if (more) { e.stopPropagation(); openHostMenu(more, more.dataset.id); return; }
    const item = e.target.closest('.host-card');
    if (item) selectHost(item.dataset.id);
  });
  document.getElementById('host-cards').addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      const item = e.target.closest('.host-card');
      if (item) { e.preventDefault(); selectHost(item.dataset.id); }
    }
  });
  document.querySelectorAll('.host-filter button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.host-filter button').forEach(x => { x.classList.remove('active'); x.setAttribute('aria-selected', 'false'); });
      b.classList.add('active'); b.setAttribute('aria-selected', 'true');
      filter = b.dataset.filter; renderList();
    });
  });
  document.getElementById('host-search-input').addEventListener('input', e => { query = e.target.value.trim(); renderList(); });

  /* ---- 操作 ---- */
  function forceOffline(id) {
    const h = HOSTS.find(x => x.id === id);
    confirmDanger({
      title: '强制踢下线「' + h.name + '」？',
      desc: '将立即断开该主机的 daemon 连接。所有运行中的会话会被中止，主机需要重新运行 pocketctl connect 才能恢复。',
      confirmText: '强制踢下线',
      onConfirm: () => {
        const prev = { status: h.status, cpu: h.cpu, mem: h.mem, heartbeat: h.heartbeat };
        h.status = 'offline'; h.cpu = null; h.mem = null; h.active = 0; h.heartbeat = '刚刚';
        renderList(); renderDetail();
        showToast('已将「' + h.name + '」踢下线', () => {
          Object.assign(h, prev); renderList(); renderDetail();
        });
      }
    });
  }

  function restartHost(id) {
    const h = HOSTS.find(x => x.id === id);
    confirmDanger({
      title: '重启「' + h.name + '」上的 daemon？',
      desc: '将向主机发送重启指令，daemon 会短暂断开后自动恢复（约 5-10 秒）。期间运行中的会话会暂停。',
      confirmText: '重启 daemon',
      onConfirm: () => {
        h.status = 'reconnecting'; renderList(); renderDetail();
        setTimeout(() => {
          h.status = 'online'; h.heartbeat = '刚刚'; h.uptime = h.uptime; h.cpu = Math.max(5, (h.cpu||20) - 10);
          renderList(); renderDetail();
          showToast('「' + h.name + '」的 daemon 已重启');
        }, 2600);
      }
    });
  }

  function reconnectHost(id) {
    const h = HOSTS.find(x => x.id === id);
    h.status = 'reconnecting'; renderList(); renderDetail();
    setTimeout(() => {
      h.status = 'online'; h.heartbeat = '刚刚'; h.cpu = 18; h.mem = 35;
      renderList(); renderDetail();
      showToast('「' + h.name + '」已重新连接');
    }, 2200);
  }

  function copyConnection(id) {
    const h = HOSTS.find(x => x.id === id);
    const text = h.ip + (h.port === 22 ? '' : ':' + h.port);
    if (navigator.clipboard) navigator.clipboard.writeText(text).catch(()=>{});
    showToast('已复制 ' + text);
  }

  function exportReport(id) {
    const h = HOSTS.find(x => x.id === id);
    const md = ['# 主机报告：' + h.name, '',
      '> **状态**：' + (STATUS[h.status]||STATUS.offline).label + '  ',
      '> **IP**：`' + h.ip + '`  ',
      '> **端口**：' + h.port + '  ',
      '> **系统**：' + h.os + ' (' + h.arch + ')  ',
      '> **daemon 版本**：v' + h.version + '  ',
      '> **运行时长**：' + h.uptime + '  ',
      '> **最后心跳**：' + h.heartbeat + '  ',
      '> **Agent**：' + h.agent.join(', ') + '  ',
      '> **会话**：' + h.active + ' 活跃 / ' + h.total + ' 历史  ',
      '> **资源**：CPU ' + (h.cpu==null?'—':h.cpu+'%') + ' · 内存 ' + (h.mem==null?'—':h.mem+'%') + ' · 磁盘 ' + (h.disk==null?'—':h.disk+'%'), '',
      '_由 pocketctl 导出 · ' + new Date().toLocaleString('zh-CN') + '_'].join('\n');
    downloadFile((h.name || 'host') + '-report.md', md);
    showToast('已导出 ' + h.name + '-report.md');
  }

  function unregister(id) {
    const h = HOSTS.find(x => x.id === id);
    const idx = HOSTS.indexOf(h);
    confirmDanger({
      title: '注销主机「' + h.name + '」？',
      desc: '将从账户移除该主机。历史会话记录保留，但该主机需重新注册才能再次连接。此操作可在撤销提示内恢复。',
      confirmText: '注销主机',
      onConfirm: () => {
        HOSTS.splice(idx, 1);
        if (selectedId === id) selectedId = HOSTS.length ? HOSTS[0].id : null;
        renderList(); renderDetail();
        showToast('已注销「' + h.name + '」', () => {
          HOSTS.splice(idx, 0, h);
          if (!selectedId) selectedId = h.id;
          renderList(); renderDetail();
        });
      }
    });
  }

  /* ---- ⋯ 菜单 ---- */
  function openHostMenu(btn, id) {
    ensureShell();
    const h = HOSTS.find(x => x.id === id);
    const isOnline = h.status === 'online';
    // 动态菜单项
    menuEl.innerHTML =
      mi('copy', I_COPY, '复制连接信息') +
      mi('export', I_EXPORT, '导出主机报告') +
      mi('alias', I_EDIT, '编辑别名') +
      '<div class="ss-menu-sep"></div>' +
      (isOnline ? mi('restart', I_RESTART, '重启 daemon') + mi('kick', I_POWER, '强制踢下线') : '') +
      '<div class="ss-menu-sep"></div>' +
      '<button class="ss-menu-item danger" data-act="unregister">' + I_TRASH + '<span>注销主机</span></button>';
    currentHostId = id;
    menuEl.classList.add('open');
    const r = btn.getBoundingClientRect();
    let left = r.right - menuEl.offsetWidth; if (left < 8) left = 8;
    menuEl.style.left = left + 'px'; menuEl.style.top = (r.bottom + 6) + 'px';
  }
  function mi(act, icon, label) { return '<button class="ss-menu-item" data-act="' + act + '">' + icon + '<span>' + label + '</span></button>'; }

  function onMenuClick(e) {
    const item = e.target.closest('.ss-menu-item'); if (!item || !currentHostId) return;
    const act = item.dataset.act, id = currentHostId;
    closeMenu();
    if (act === 'copy') copyConnection(id);
    else if (act === 'export') exportReport(id);
    else if (act === 'restart') restartHost(id);
    else if (act === 'kick') forceOffline(id);
    else if (act === 'unregister') unregister(id);
    else if (act === 'alias') { selectHost(id); setTimeout(()=>startAliasEdit(id), 50); }
  }

  function startAliasEdit(id) {
    // 简化：用 prompt 之外的内联方式 —— 直接在详情标题处替换为 input
    const h = HOSTS.find(x => x.id === id);
    const titleEl = document.querySelector('.hd-title');
    if (!titleEl || titleEl.querySelector('input')) return;
    const firstText = titleEl.firstChild;
    if (!firstText || firstText.nodeType !== 3) return;
    const old = firstText.textContent;
    const input = document.createElement('input');
    input.className = 'ss-rename-input'; input.value = old; input.maxLength = 32; input.style.marginRight = '6px';
    firstText.replaceWith(input); input.focus(); input.select();
    let done = false;
    function commit() {
      if (done) return; done = true;
      const v = input.value.trim() || old;
      if (v !== old) { h.name = v; showToast('已重命名为「' + v + '」', () => { h.name = old; renderList(); renderDetail(); }); }
      renderList(); renderDetail();
    }
    input.addEventListener('keydown', e2 => { if (e2.key==='Enter'){e2.preventDefault();commit();} else if (e2.key==='Escape'){e2.preventDefault();input.value=old;commit();} });
    input.addEventListener('blur', commit);
  }

  /* ---- 注册弹窗 ---- */
  function openRegisterModal() {
    ensureShell();
    const d = dialogEl;
    d.innerHTML =
      '<div class="ss-dialog" style="text-align:left;max-width:460px;">' +
        '<div class="modal-header" style="padding:0 0 12px;"><h2 class="modal-title" id="reg-title">注册新主机</h2></div>' +
        '<p class="ss-dialog-desc" style="text-align:left;">在目标主机上执行以下命令安装并连接 daemon：</p>' +
        '<div class="install-cmd"><span class="prompt">$</span>curl -fsSL https://pocketctl.io/install.sh | sh</div>' +
        '<div class="install-cmd"><span class="prompt">$</span>pocketctl connect --token pct_a1b2·c3d4·e5f6</div>' +
        '<p class="install-note">支持 macOS / Linux / Windows。安装后主机会自动出现在左侧列表，状态显示为「在线」。Token 可在 设置 → API 凭证 重新生成。</p>' +
        '<div class="modal-footer" style="margin-top:16px;">' +
          '<button class="btn btn-cancel" onclick="closeDialog()">关闭</button>' +
          '<button class="btn btn-start" onclick="copyInstallCmd()">复制安装命令</button>' +
        '</div>' +
      '</div>';
    d.classList.add('open');
  }
  function copyInstallCmd() {
    const cmd = 'curl -fsSL https://pocketctl.io/install.sh | sh\npocketctl connect --token pct_a1b2·c3d4·e5f6';
    if (navigator.clipboard) navigator.clipboard.writeText(cmd).catch(()=>{});
    closeDialog(); showToast('已复制安装命令');
  }

  /* ---- 操作组件 DOM（复用 web-shared 的 .ss-* 样式） ---- */
  let menuEl, dialogEl, toastEl, toastTimer, currentHostId;
  const I_POWER = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v9"/><path d="M6.4 6.4a8 8 0 106.6-2.3"/></svg>';
  const I_RESTART = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 019-9 9 9 0 016.7 3"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 01-9 9 9 9 0 01-6.7-3"/><path d="M3 21v-5h5"/></svg>';
  const I_COPY = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>';
  const I_EXPORT = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>';
  const I_EDIT = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';
  const I_TRASH = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>';
  const I_SPIN = '<span class="spinner" style="width:14px;height:14px;border-top-color:currentColor;"></span>';
  const ICON_MORE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>';

  function ensureShell() {
    if (menuEl) return;
    menuEl = document.createElement('div'); menuEl.className = 'ss-menu'; menuEl.id = 'ss-menu';
    menuEl.addEventListener('click', onMenuClick);
    dialogEl = document.createElement('div'); dialogEl.className = 'ss-overlay'; dialogEl.id = 'ss-overlay';
    dialogEl.addEventListener('click', e => { if (e.target === dialogEl) closeDialog(); });
    toastEl = document.createElement('div'); toastEl.className = 'ss-toast'; toastEl.id = 'ss-toast';
    document.body.append(menuEl, dialogEl, toastEl);
    document.addEventListener('click', e => { if (!menuEl.contains(e.target) && !e.target.closest('.ss-more-btn')) closeMenu(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenu(); closeDialog(); } });
    window.addEventListener('scroll', closeMenu, true); window.addEventListener('resize', closeMenu, true);
  }
  function closeMenu() { if (menuEl) menuEl.classList.remove('open'); }
  function closeDialog() { if (dialogEl) dialogEl.classList.remove('open'); }

  function confirmDanger(opts) {
    ensureShell();
    dialogEl.innerHTML =
      '<div class="ss-dialog">' +
        '<div class="ss-dialog-icon">' + I_WARN + '</div>' +
        '<h3 class="ss-dialog-title">' + esc(opts.title) + '</h3>' +
        '<p class="ss-dialog-desc">' + esc(opts.desc) + '</p>' +
        '<div class="ss-dialog-actions">' +
          '<button class="btn btn-secondary ss-cancel">取消</button>' +
          '<button class="btn ss-confirm"><span class="ss-confirm-label">' + esc(opts.confirmText || '确认') + '</span><span class="ss-confirm-loading"><span class="spinner"></span>处理中</span></button>' +
        '</div>' +
      '</div>';
    const confirmBtn = dialogEl.querySelector('.ss-confirm');
    dialogEl.querySelector('.ss-cancel').addEventListener('click', closeDialog);
    confirmBtn.addEventListener('click', () => {
      confirmBtn.classList.add('loading');
      setTimeout(() => { closeDialog(); opts.onConfirm && opts.onConfirm(); }, 600);
    });
    dialogEl.classList.add('open');
  }
  const I_WARN = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>';

  function showToast(text, undoFn) {
    ensureShell();
    clearTimeout(toastTimer);
    toastEl.innerHTML = '';
    toastEl.appendChild(toastSpan('ss-toast-msg', text));
    if (typeof undoFn === 'function') {
      const btn = document.createElement('button'); btn.className = 'ss-toast-undo';
      let secs = 5; btn.textContent = '撤销 · ' + secs + 's';
      const tick = setInterval(() => { secs--; if (secs <= 0) { clearInterval(tick); hideToast(); return; } btn.textContent = '撤销 · ' + secs + 's'; }, 1000);
      btn.addEventListener('click', () => { clearInterval(tick); try { undoFn(); } catch(e){} hideToast(); });
      toastEl.appendChild(btn); toastEl._tick = tick;
    }
    toastEl.classList.add('show');
    toastTimer = setTimeout(hideToast, 5500);
  }
  function toastSpan(cls, text) { const s = document.createElement('span'); s.className = cls; s.textContent = text; return s; }
  function hideToast() { clearTimeout(toastTimer); if (toastEl && toastEl._tick) { clearInterval(toastEl._tick); toastEl._tick = null; } if (toastEl) toastEl.classList.remove('show'); }

  function downloadFile(filename, content) {
    try {
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 200);
    } catch (e) {}
  }

  /* ---- 初始化 ---- */
  renderList();
  selectHost(HOSTS[0].id);
</script>
<script src="../js/sidebar-toggle.js"></script>
</body>
</html>
