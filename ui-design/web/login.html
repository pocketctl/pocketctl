<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pocketctl — 登录</title>
<link rel="stylesheet" href="../css/web-shared.css">
<style>
  .login-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  /* Background atmosphere */
  .login-page::before {
    content: '';
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent-muted) 0%, transparent 70%);
    top: -200px;
    right: -150px;
    opacity: 0.5;
    pointer-events: none;
  }

  .login-page::after {
    content: '';
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(35, 134, 54, 0.08) 0%, transparent 70%);
    bottom: -100px;
    left: -100px;
    opacity: 0.6;
    pointer-events: none;
  }

  .login-container {
    width: 100%;
    max-width: 420px;
    position: relative;
    z-index: 1;
  }

  /* Theme toggle */
  .login-theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 10;
  }

  /* Logo area */
  .login-brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 40px;
  }

  .login-logo-wrapper {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 16px;
    box-shadow: var(--shadow-md);
  }

  .login-logo-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .login-brand .brand-name {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 6px;
  }

  .login-brand .brand-tagline {
    font-size: 15px;
    color: var(--fg-secondary);
    text-align: center;
  }

  /* Card */
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    padding: 32px;
    box-shadow: var(--shadow-lg);
    transition: background var(--transition), border-color var(--transition);
  }

  .login-card .card-title {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 600;
    color: var(--fg);
    text-align: center;
    margin-bottom: 24px;
  }

  /* Tab switcher */
  .login-tabs {
    display: flex;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 3px;
    margin-bottom: 24px;
  }

  .login-tab {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 6px;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    background: transparent;
    color: var(--fg-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .login-tab.active {
    background: var(--surface);
    color: var(--fg);
    box-shadow: var(--shadow-sm);
  }

  .login-tab:hover:not(.active) {
    color: var(--fg);
  }

  .login-tab svg { width: 16px; height: 16px; }

  /* Form */
  .login-form {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .form-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--fg-secondary);
    margin-bottom: 6px;
  }

  .code-row {
    display: flex;
    gap: 8px;
  }

  .code-row .input-field { flex: 1; }

  .get-code-btn {
    white-space: nowrap;
    padding: 10px 16px;
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    color: var(--accent);
    font-family: var(--font-body);
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }

  .get-code-btn:hover { background: var(--surface-hover); border-color: var(--border-light); }
  .get-code-btn.disabled { color: var(--fg-tertiary); cursor: not-allowed; }

  /* Email domain suffix */
  .email-input-group {
    display: flex;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    transition: border-color 0.15s;
    background: var(--bg);
  }

  .email-input-group:focus-within {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px var(--accent-muted);
  }

  .email-input-group input {
    flex: 1;
    background: none;
    border: none;
    padding: 10px 14px;
    color: var(--fg);
    font-size: 14px;
    font-family: var(--font-body);
    outline: none;
    min-width: 0;
  }

  .email-input-group input::placeholder { color: var(--fg-tertiary); }


  /* Login button */
  .login-btn {
    width: 100%;
    padding: 14px;
    background: var(--primary-btn);
    color: #fff;
    border: none;
    border-radius: var(--radius-md);
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    margin-top: 4px;
  }

  .login-btn:hover { background: var(--primary-btn-hover); }
  .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Terms */
  .terms-text {
    font-size: 12px;
    color: var(--fg-tertiary);
    text-align: center;
    line-height: 1.6;
  }

  .terms-text a { color: var(--accent); text-decoration: none; }
  .terms-text a:hover { text-decoration: underline; }

  /* Divider */
  .divider-text {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--fg-tertiary);
    font-size: 13px;
    padding: 8px 0;
  }

  .divider-text::before,
  .divider-text::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Social login */
  .social-row {
    display: flex;
    gap: 12px;
    justify-content: center;
  }

  .social-btn {
    width: 52px;
    height: 52px;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    position: relative;
  }

  .social-btn:hover { background: var(--surface-hover); border-color: var(--border-light); }

  .social-btn svg { width: 24px; height: 24px; }

  .social-btn.disabled { opacity: 0.4; }

  .social-btn .coming-soon {
    position: absolute;
    bottom: -18px;
    font-size: 10px;
    color: var(--fg-tertiary);
    white-space: nowrap;
  }

  /* Error banner */
  .error-banner {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-radius: var(--radius-md);
    background: rgba(248,81,73,0.1);
    color: var(--error);
    font-size: 13px;
    margin-bottom: 0;
  }

  .error-banner.visible { display: flex; }

  .error-banner svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* Tab content */
  .tab-content { display: none; }
  .tab-content.active { display: flex; flex-direction: column; gap: 16px; }

  /* ---- 扫码登录 ---- */
  .qr-box { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 8px 0 4px; }
  .qr-status-bar {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: var(--radius-full);
    font-size: 13px; font-weight: 500;
    background: var(--success-bg); color: var(--success);
    transition: background 0.2s, color 0.2s;
  }
  .qr-status-bar .qr-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); animation: pulse-green 1.5s infinite; }
  .qr-status-bar.scanned { background: var(--accent-muted); color: var(--accent); }
  .qr-status-bar.scanned .qr-dot { background: var(--accent); animation: none; }
  .qr-status-bar.confirmed { background: var(--accent-muted); color: var(--accent); }
  .qr-status-bar.confirmed .qr-dot { background: var(--accent); animation: none; }
  .qr-frame {
    width: 188px; height: 188px; padding: 12px;
    background: #fff; border-radius: var(--radius-md);
    position: relative; display: flex; align-items: center; justify-content: center;
  }
  .qr-grid { width: 100%; height: 100%; display: grid; gap: 1px; }
  .qr-cell { background: #fff; }
  .qr-cell.on { background: #0d1117; }
  [data-theme="light"] .qr-cell.on { background: #1f2328; }
  .qr-logo {
    position: absolute; width: 40px; height: 40px; border-radius: 8px;
    background: #fff; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 4px #fff, 0 0 0 5px rgba(0,0,0,0.06);
  }
  .qr-hint { font-size: 13px; color: var(--fg-secondary); text-align: center; line-height: 1.5; }
  .qr-hint strong { color: var(--accent); }
  .qr-meta { display: flex; align-items: center; gap: 12px; }
  .qr-timer { font-size: 12px; color: var(--fg-tertiary); font-family: var(--font-mono); }
  .qr-state-btn {
    background: none; border: 1px dashed var(--border); color: var(--fg-tertiary);
    font-size: 11px; padding: 4px 10px; border-radius: var(--radius-full);
    cursor: pointer; font-family: var(--font-body);
  }
  .qr-state-btn:hover { color: var(--fg-secondary); border-color: var(--border-light); }

  /* Footer */
  .login-footer {
    text-align: center;
    margin-top: 32px;
    font-size: 13px;
    color: var(--fg-tertiary);
  }

  .login-footer a { color: var(--accent); text-decoration: none; }

  /* Responsive */
  @media (max-width: 480px) {
    .login-card { padding: 24px 20px; }
    .login-brand .brand-name { font-size: 24px; }
  }
</style>
</head>
<body>
  <!-- Theme Toggle -->
  <div class="login-theme-toggle">
    <button class="theme-toggle" onclick="toggleTheme()" title="切换主题" id="theme-btn">
      <svg id="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
      </svg>
      <svg id="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
        <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>
    </button>
  </div>

  <div class="login-page">
    <div class="login-container">
      <!-- Brand -->
      <div class="login-brand">
        <div class="login-logo-wrapper">
          <img id="login-logo" src="../assets/logo-github-org.svg" alt="pocketctl">
        </div>
        <div class="brand-name">pocketctl</div>
        <div class="brand-tagline">远程掌控你的 AI 编程助手</div>
      </div>

      <!-- Login Card -->
      <div class="login-card">
        <div class="card-title">登录你的账户</div>

        <!-- Error Banner -->
        <div class="error-banner" id="error-banner">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm-.75 4h1.5v5h-1.5V5zm.75 6.5a.75.75 0 110-1.5.75.75 0 010 1.5z"/></svg>
          <span id="error-text">验证码错误，请重新输入</span>
        </div>

        <!-- Login Tabs -->
        <div class="login-tabs">
          <button class="login-tab active" onclick="switchTab('email')" id="tab-email">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 4L12 13 2 4"/></svg>
            邮箱登录
          </button>
          <button class="login-tab" onclick="switchTab('qr')" id="tab-qr">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v3M14 20h3M20 20v.01"/></svg>
            扫码登录
          </button>
        </div>

        <!-- Email Login Form -->
        <div class="tab-content active" id="content-email">
          <div>
            <div class="form-label">邮箱地址</div>
            <div class="email-input-group">
              <input type="email" placeholder="you@example.com" id="email-input">
            </div>
          </div>
          <div>
            <div class="form-label">验证码</div>
            <div class="code-row">
              <input type="text" class="input-field" placeholder="6 位验证码" id="email-code" maxlength="6" style="font-family:var(--font-mono);letter-spacing:4px;">
              <button class="get-code-btn" id="email-code-btn" onclick="sendCode('email')">获取验证码</button>
            </div>
          </div>
          <button class="login-btn" id="email-login-btn">登录</button>
        </div>

        <!-- QR Login -->
        <div class="tab-content" id="content-qr">
          <div class="qr-box">
            <div class="qr-status-bar" id="qr-status-bar">
              <span class="qr-dot"></span>
              <span id="qr-status-text">等待 App 扫码</span>
            </div>
            <div class="qr-frame">
              <div class="qr-grid" id="qr-grid"></div>
              <div class="qr-logo">
                <svg width="20" height="20" viewBox="0 0 512 512" fill="none">
                  <path d="M208 200 L304 256 L208 312" stroke="#58a6ff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                </svg>
              </div>
            </div>
            <div class="qr-hint">请使用 <strong>pocketctl App</strong> 扫描上方二维码登录</div>
            <div class="qr-meta">
              <span class="qr-timer">二维码 02:58 后失效</span>
              <button class="qr-state-btn" onclick="cycleQrState()" title="设计审阅：切换扫码状态">演示状态</button>
            </div>
          </div>
        </div>

        <!-- Terms -->
        <div class="terms-text" style="margin-top:8px;">
          登录即同意<a href="#">《用户协议》</a>和<a href="#">《隐私政策》</a>
        </div>
      </div>

      <!-- Footer -->
      <div class="login-footer">
        <a href="#">帮助中心</a>
      </div>
    </div>
  </div>

<script>
  // ---- Theme ----
  function getTheme() {
    return document.documentElement.getAttribute('data-theme') || 'dark';
  }

  function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('pocketctl-theme', theme);
    updateThemeUI(theme);
    updateLogo(theme);
  }

  function toggleTheme() {
    setTheme(getTheme() === 'dark' ? 'light' : 'dark');
  }

  function updateThemeUI(theme) {
    const sun = document.getElementById('icon-sun');
    const moon = document.getElementById('icon-moon');
    if (theme === 'dark') {
      sun.style.display = 'none';
      moon.style.display = 'block';
    } else {
      sun.style.display = 'block';
      moon.style.display = 'none';
    }
  }

  function updateLogo(theme) {
    const logo = document.getElementById('login-logo');
    logo.src = theme === 'dark'
      ? '../assets/logo-github-org.svg'
      : '../assets/logo-github-org-light.svg';
  }

  // Init theme
  const saved = localStorage.getItem('pocketctl-theme');
  if (saved) setTheme(saved);
  else { updateThemeUI(getTheme()); updateLogo(getTheme()); }

  // ---- Tab switch ----
  function switchTab(tab) {
    document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    document.getElementById('content-' + tab).classList.add('active');
    // Hide error on tab switch
    document.getElementById('error-banner').classList.remove('visible');
    if (tab === 'qr') buildQR();
  }

  // ---- QR 生成（视觉示意：定位角 + 伪数据 + 中心 logo 位） ----
  function inFinder(x, y, ox, oy) {
    var dx = x - ox, dy = y - oy;
    if (dx >= 0 && dx <= 6 && dy >= 0 && dy <= 6) {
      var edge = (dx === 0 || dx === 6 || dy === 0 || dy === 6);
      var core = (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4);
      return edge || core;
    }
    return null;
  }
  function buildQR() {
    var grid = document.getElementById('qr-grid');
    if (!grid || grid.children.length) return; // 只生成一次
    var size = 25, html = '';
    for (var y = 0; y < size; y++) {
      for (var x = 0; x < size; x++) {
        var dark = false;
        var f = inFinder(x, y, 0, 0) || inFinder(x, y, 18, 0) || inFinder(x, y, 0, 18);
        if (f === true) dark = true;
        else if (f === false) dark = false;
        else dark = ((x * 3 + y * 7 + x * y * 2 + (x % 3)) % 5 < 2);
        if (x >= 10 && x <= 14 && y >= 10 && y <= 14) dark = false; // 中心 logo 区
        html += '<span class="qr-cell' + (dark ? ' on' : '') + '"></span>';
      }
    }
    grid.style.gridTemplateColumns = 'repeat(' + size + ', 1fr)';
    grid.innerHTML = html;
  }
  // ---- QR 状态切换（等待 → 已扫描 → 已确认） ----
  var qrStates = ['waiting', 'scanned', 'confirmed'];
  var qrIdx = 0;
  function cycleQrState() {
    qrIdx = (qrIdx + 1) % qrStates.length;
    var s = qrStates[qrIdx];
    var bar = document.getElementById('qr-status-bar');
    var text = document.getElementById('qr-status-text');
    bar.className = 'qr-status-bar ' + s;
    text.textContent = s === 'waiting' ? '等待 App 扫码' : (s === 'scanned' ? '已扫描，请在 App 内确认' : '已确认，正在登录…');
  }
  buildQR();

  // ---- Send code ----
  function sendCode(type) {
    const btn = document.getElementById(type + '-code-btn');
    if (btn.classList.contains('disabled')) return;
    btn.classList.add('disabled');
    let seconds = 60;
    btn.textContent = seconds + 's 后重发';
    const timer = setInterval(() => {
      seconds--;
      btn.textContent = seconds + 's 后重发';
      if (seconds <= 0) {
        clearInterval(timer);
        btn.classList.remove('disabled');
        btn.textContent = '获取验证码';
      }
    }, 1000);
  }
</script>
</body>
</html>
