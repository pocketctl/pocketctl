<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pocketctl — Token 使用分析</title>
<link rel="stylesheet" href="../css/web-shared.css">
<style>
  /* ---- Token Summary (4-col grid) ---- */
  .token-summary {
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 24px;
    transition: background var(--transition), border-color var(--transition);
  }
  .token-summary .tk-item {
    padding: 16px 22px; display: flex; flex-direction: column; gap: 4px;
  }
  .token-summary .tk-item + .tk-item { border-left: 1px solid var(--border); }
  .token-summary .tk-item:first-child .tk-num { color: var(--accent); }
  .token-summary .tk-num {
    font-family: var(--font-display); font-size: 24px; font-weight: 650; color: var(--fg);
    font-variant-numeric: tabular-nums; letter-spacing: -0.01em; line-height: 1.1;
  }
  .token-summary .tk-label { font-size: 12px; color: var(--fg-tertiary); text-transform: uppercase; letter-spacing: 0.05em; }
  .token-summary .tk-trend { font-size: 11px; color: var(--fg-tertiary); display: flex; align-items: center; gap: 3px; }
  .token-summary .tk-trend.up { color: var(--success); }
  .token-summary .tk-trend.down { color: var(--error); }

  /* ---- Host Selector ---- */
  .host-select-wrap { position: relative; }
  .host-select-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border: 1px solid var(--border); border-radius: var(--radius-md);
    background: var(--surface); color: var(--fg); font-size: 13px; font-weight: 500;
    cursor: pointer; font-family: var(--font-body);
    transition: border-color 0.15s, background 0.15s;
  }
  .host-select-btn:hover { border-color: var(--border-light); background: var(--surface-hover); }
  .host-select-btn .chevron { color: var(--fg-tertiary); font-size: 10px; margin-left: 2px; }
  .host-select-menu {
    display: none; position: absolute; top: 100%; right: 0; margin-top: 4px; z-index: 50;
    min-width: 180px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-md); box-shadow: var(--shadow-lg); padding: 4px;
  }
  .host-select-menu.open { display: block; }
  .host-select-menu button {
    width: 100%; display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border: none; background: transparent;
    color: var(--fg-secondary); font-size: 13px; border-radius: var(--radius-sm);
    cursor: pointer; font-family: var(--font-body); text-align: left;
    transition: background 0.12s, color 0.12s;
  }
  .host-select-menu button:hover { background: var(--surface-hover); color: var(--fg); }
  .host-select-menu button.active { background: var(--sidebar-active); color: var(--accent); font-weight: 600; }
  .host-select-menu button .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .host-select-menu button .dot.online { background: var(--success); }
  .host-select-menu button .dot.all { background: var(--accent); }

  /* ---- Metric Cards ---- */
  .metric-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 28px;
  }
  .metric-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px 18px;
    transition: border-color 0.15s, background var(--transition);
  }
  .metric-card .mc-label { font-size: 11px; color: var(--fg-tertiary); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .metric-card .mc-value { font-size: 26px; font-weight: 700; color: var(--fg); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; line-height: 1.1; }
  .metric-card .mc-sub { font-size: 12px; color: var(--fg-tertiary); margin-top: 4px; }
  .metric-card .mc-sub span { color: var(--success); }

  /* ---- Chart Sections ---- */
  .chart-section { margin-bottom: 32px; }
  .chart-section-title {
    font-size: 13px; font-weight: 600; color: var(--fg-secondary); text-transform: uppercase; letter-spacing: 0.06em;
    margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
  }
  .chart-section-legend { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--fg-tertiary); text-transform: none; letter-spacing: 0; }
  .chart-section-legend .le-dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .chart-container {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px;
  }

  /* ---- Two-col layout ---- */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 32px; }
  .two-col .chart-section { margin-bottom: 0; display: flex; flex-direction: column; }
  .two-col .chart-container { flex: 1; display: flex; flex-direction: column; align-items: stretch; justify-content: center; padding: 14px 18px; }

  /* ---- Bar Chart ---- */
  .bar-chart { display: flex; align-items: flex-end; gap: 3px; height: 200px; padding: 0 2px; }
  .bar-day { flex: 1; display: flex; flex-direction: column; gap: 2px; justify-content: flex-end; }
  .bar-col { width: 100%; border-radius: 2px 2px 0 0; transition: opacity 0.15s; min-height: 2px; }
  .bar-col.input { background: var(--accent); opacity: 0.7; }
  .bar-col.output { background: var(--success); opacity: 0.7; }
  .bar-day:hover .bar-col { opacity: 1; }
  .bar-label-row { display: flex; margin-top: 8px; }
  .bar-label-row span { flex: 1; text-align: center; font-size: 10px; color: var(--fg-tertiary); font-family: var(--font-mono); min-width: 0; }
  .bar-label-row span.show { display: block; }
  .bar-tooltip {
    position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
    background: var(--fg); color: var(--bg); font-size: 11px; padding: 4px 8px; border-radius: 4px;
    white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.15s;
  }
  .bar-day:hover .bar-tooltip { opacity: 1; }

  /* ---- Donut (Ring) Chart ---- */
  .donut-wrap { display: flex; flex-direction: row; align-items: center; gap: 20px; justify-content: center; }
  .donut-ring {
    width: 120px; height: 120px; border-radius: 50%;
    position: relative; flex-shrink: 0;
  }
  .donut-center {
    position: absolute; inset: 22px; border-radius: 50%; background: var(--surface);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .donut-center .dc-total { font-size: 16px; font-weight: 700; color: var(--fg); letter-spacing: -0.01em; line-height: 1.1; }
  .donut-center .dc-label { font-size: 9px; color: var(--fg-tertiary); }
  .donut-legend { display: flex; flex-direction: column; gap: 8px; }
  .donut-legend .dl-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fg-secondary); }
  .donut-legend .dl-swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

  /* ---- Heatmap ---- */
  .heatmap-wrap { display: flex; gap: 3px; flex-wrap: nowrap; padding: 4px 0; }
  .heatmap-col { display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; }
  .heatmap-cell {
    width: 12px; height: 12px; border-radius: 2px; background: var(--surface-active);
    cursor: default; transition: transform 0.1s;
  }
  .heatmap-cell:hover { transform: scale(1.2); }
  .heatmap-cell.l1 { background: var(--accent); opacity: 0.22; }
  .heatmap-cell.l2 { background: var(--accent); opacity: 0.42; }
  .heatmap-cell.l3 { background: var(--accent); opacity: 0.66; }
  .heatmap-cell.l4 { background: var(--accent); opacity: 0.92; }
  /* 热力图顶部图例条 */
  .heatmap-legend-bar {
    display: flex; align-items: center; gap: 0; margin-bottom: 14px; width: 120px; min-width: 120px; flex-shrink: 0;
  }
  .heatmap-legend-bar .hm-label {
    font-size: 11px; color: var(--fg-tertiary); flex-shrink: 0;
  }
  .heatmap-legend-bar .hm-gradient {
    display: flex; flex: 1; height: 10px; border-radius: 2px; overflow: hidden; margin: 0 10px;
  }
  .heatmap-legend-bar .hm-gradient span { flex: 1; }
  .heatmap-legend-bar .hm-gradient span:nth-child(1) { background: var(--surface-active); }
  .heatmap-legend-bar .hm-gradient span:nth-child(2) { background: var(--accent); opacity: 0.22; }
  .heatmap-legend-bar .hm-gradient span:nth-child(3) { background: var(--accent); opacity: 0.42; }
  .heatmap-legend-bar .hm-gradient span:nth-child(4) { background: var(--accent); opacity: 0.66; }
  .heatmap-legend-bar .hm-gradient span:nth-child(5) { background: var(--accent); opacity: 0.92; }
  .heatmap-legend { display: flex; align-items: center; gap: 4px; margin-top: 0; font-size: 11px; color: var(--fg-tertiary); }
  .heatmap-legend .hl-cell { width: 12px; height: 12px; border-radius: 2px; }

  /* ---- Session Table ---- */
  .session-table {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden;
  }
  .session-table-header {
    display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
    padding: 10px 18px; font-size: 11px; font-weight: 600; color: var(--fg-tertiary);
    text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid var(--border); background: var(--surface-hover);
  }
  .session-row {
    display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
    padding: 12px 18px; align-items: center; border-bottom: 1px solid var(--border);
    font-size: 13px; cursor: pointer; transition: background 0.1s;
  }
  .session-row:hover { background: var(--surface-hover); }
  .session-row:last-child { border-bottom: none; }
  .session-row .st-name { color: var(--fg); font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .session-row .st-name .st-expand {
    display: inline-flex; width: 16px; height: 16px; align-items: center; justify-content: center;
    font-size: 10px; color: var(--fg-tertiary); transition: transform 0.2s;
  }
  .session-row.expanded .st-expand { transform: rotate(90deg); }
  .session-row .st-num { font-family: var(--font-mono); color: var(--fg-secondary); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px; }
  .session-row .st-total { font-family: var(--font-mono); font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums; }
  .st-model-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
  .st-status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .st-status-dot.running { background: var(--success); animation: pulse-green 1.5s infinite; }
  .st-status-dot.completed { background: var(--fg-tertiary); }
  .st-empty { padding: 48px 16px; text-align: center; font-size: 13px; color: var(--fg-tertiary); }

  .session-expand-row {
    display: none; padding: 12px 18px; background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .session-expand-row.open { display: block; }
  .session-expand-row .se-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px;
  }
  .session-expand-row .se-item { display: flex; flex-direction: column; gap: 2px; }
  .session-expand-row .se-label { font-size: 10px; color: var(--fg-tertiary); text-transform: uppercase; letter-spacing: 0.05em; }
  .session-expand-row .se-val { font-size: 13px; font-weight: 600; color: var(--fg); font-family: var(--font-mono); }
  .session-expand-row .se-mini-chart {
    margin-top: 10px; display: flex; align-items: flex-end; gap: 2px; height: 40px;
  }
  .session-expand-row .se-mini-chart span {
    flex: 1; background: var(--accent); opacity: 0.5; border-radius: 1px 1px 0 0; min-height: 2px;
  }

  /* ---- Usage Table (All hosts mode) ---- */
  .usage-table {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden;
  }
  .usage-table-header {
    display: grid; grid-template-columns: 1.5fr repeat(4, 1fr) 110px;
    padding: 10px 18px; font-size: 11px; font-weight: 600; color: var(--fg-tertiary);
    text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid var(--border); background: var(--surface-hover);
  }
  .usage-table-row {
    display: grid; grid-template-columns: 1.5fr repeat(4, 1fr) 110px;
    padding: 12px 18px; align-items: center; border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .usage-table-row:last-child { border-bottom: none; }
  .usage-table-row .ut-host { color: var(--fg); font-weight: 500; }
  .usage-table-row .ut-num { font-family: var(--font-mono); color: var(--fg-secondary); font-variant-numeric: tabular-nums; }
  .usage-table-row .ut-total { font-family: var(--font-mono); font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums; }

  @media (max-width: 900px) {
    .two-col { grid-template-columns: 1fr; }
    .token-summary { grid-template-columns: repeat(2, 1fr); }
    .token-summary .tk-item:nth-child(2) { border-left: 0; }
    .token-summary .tk-item:nth-child(3), .token-summary .tk-item:nth-child(4) { border-top: 1px solid var(--border); }
    .session-table-header, .session-row { grid-template-columns: 1.5fr 1fr 1fr; }
    .session-table-header span:nth-child(3), .session-table-header span:nth-child(5),
    .session-row .st-num:nth-child(3), .session-row .st-num:nth-child(5) { display: none; }
    .usage-table-header, .usage-table-row { grid-template-columns: 1fr repeat(2, 1fr); }
    .usage-table-header span:nth-child(4), .usage-table-header span:nth-child(5),
    .usage-table-row .ut-num:nth-child(4), .usage-table-row .ut-num:nth-child(5) { display: none; }
    .heatmap-wrap { gap: 2px; } .heatmap-cell { width: 10px; height: 10px; }
    .bar-chart { height: 150px; }
  }
  @media (max-width: 520px) {
    .token-summary { grid-template-columns: 1fr; }
    .token-summary .tk-item { border-left: 0 !important; }
    .token-summary .tk-item + .tk-item { border-top: 1px solid var(--border); }
    .metric-grid { grid-template-columns: repeat(2, 1fr); }
    .bar-chart { height: 120px; }
    .bar-label-row span { display: none; }
    .bar-label-row span:nth-child(8n+1), .bar-label-row span:last-child { display: block; }
    .heatmap-wrap { min-height: 120px; }
  }

  /* ---- Click Tooltip ---- */
  .chart-tooltip {
    position: fixed; z-index: 100; pointer-events: none;
    background: var(--surface); border: 1px solid var(--border-light);
    border-radius: var(--radius-md); padding: 12px 14px;
    box-shadow: var(--shadow-lg);
    font-size: 13px; line-height: 1.7;
    display: none; min-width: 150px;
  }
  .chart-tooltip.show { display: block; }
  .chart-tooltip .ct-date { font-size: 11px; color: var(--fg-tertiary); margin-bottom: 6px; font-family: var(--font-mono); }
  .chart-tooltip .ct-row { display: flex; justify-content: space-between; gap: 14px; }
  .chart-tooltip .ct-label { color: var(--fg-secondary); }
  .chart-tooltip .ct-val { font-family: var(--font-mono); color: var(--fg); font-weight: 600; white-space: nowrap; }
  .bar-day, .heatmap-cell[data-date] { cursor: pointer; }
</style>
</head>

<div class="app-layout">
  <nav class="sidebar" id="sidebar">

      <img id="sidebar-logo" src="../assets/logo-github-org.svg" alt="pocketctl">

      </div>

      </div>
    </div>

</div>

<script src="../js/sidebar-toggle.js"></script>
<script>
  /* ---- Theme ---- */
  function getTheme(){return document.documentElement.getAttribute('data-theme')||'dark'}
  function setTheme(t){document.documentElement.setAttribute('data-theme',t);localStorage.setItem('pocketctl-theme',t);updateThemeUI(t);updateLogo(t)}
  function toggleTheme(){setTheme(getTheme()==='dark'?'light':'dark')}
  function updateThemeUI(t){document.getElementById('icon-sun').style.display=t==='dark'?'none':'block';document.getElementById('icon-moon').style.display=t==='dark'?'block':'none'}
  function updateLogo(t){document.getElementById('sidebar-logo').src=t==='dark'?'../assets/logo-github-org.svg':'../assets/logo-github-org-light.svg'}
  var saved=localStorage.getItem('pocketctl-theme');if(saved)setTheme(saved);else{updateThemeUI(getTheme());updateLogo(getTheme())}

  /* ---- Data ---- */
  function fmt(n){if(n>=1000000)return(n/1000000).toFixed(2)+'M';if(n>=1000)return(n/1000).toFixed(0)+'K';return''+n}
  function seeded(o,s){var x=Math.sin((o+1)*12.9898+s*78.233)*43758.5453;return x-Math.floor(x)}

  var days30=[];
  for(var i=0;i<273;i++){var r=seeded(i,1);var inp=Math.round((60000+r*90000)/1000)*1000;var out=Math.round((8000+seeded(i,2)*22000)/1000)*1000;var cache=Math.round((inp*(0.2+seeded(i,3)*0.3))/1000)*1000;var req=Math.round(200+seeded(i,4)*500);days30.push({input:inp,output:out,cacheHit:cache,requests:req})}
  var totalInput=days30.reduce(function(s,d){return s+d.input},0);
  var totalOutput=days30.reduce(function(s,d){return s+d.output},0);
  var totalCache=days30.reduce(function(s,d){return s+d.cacheHit},0);
  var totalRequests=days30.reduce(function(s,d){return s+d.requests},0);
  var totalTokens=totalInput+totalOutput;

  var hosts=[
    {id:'h1',name:'MacBook-Pro',online:true, input:1550000,output:390000,cache:620000,requests:1840},
    {id:'h2',name:'Dev-Server',online:false,input:450000,output:90000,cache:200000,requests:280},
    {id:'h3',name:'CI-Runner',online:true,input:610000,output:150000,cache:180000,requests:620},
    {id:'h4',name:'Home-NAS',online:true,input:380000,output:80000,cache:120000,requests:100}
  ];

  var models=[
    {name:'glm-5.2',input:5400000,output:2100000,cache:600000,color:'#58a6ff'},
    {name:'glm-5-turbo',input:2100000,output:700000,cache:280000,color:'#3fb950'},
    {name:'glm-4.7',input:1200000,output:300000,cache:180000,color:'#d29922'}
  ];
  var modelColors={};models.forEach(function(m){modelColors[m.name]=m.color});

  function genSessionDaily(total){var d=[];for(var i=0;i<30;i++){var v=Math.max(1,Math.round(total/30*(0.3+Math.random()*1.4)));d.push(v)}return d}

  var sessions=[
    {id:'a7753c75',model:'glm-5.2',agent:'claude-code',host:'h1',total:2100000,input:1300000,output:800000,cache:200000,created:'2026-06-18T12:00:00Z',status:'running',dailyInput:genSessionDaily(1300000)},
    {id:'b2f1e8a3',model:'glm-5.2',agent:'codex',host:'h1',total:1500000,input:900000,output:600000,cache:150000,created:'2026-06-17T09:30:00Z',status:'completed',dailyInput:genSessionDaily(900000)},
    {id:'c8a4d7b2',model:'glm-5-turbo',agent:'claude-code',host:'h3',total:880000,input:550000,output:330000,cache:120000,created:'2026-06-16T15:00:00Z',status:'running',dailyInput:genSessionDaily(550000)},
    {id:'d9b2e6f5',model:'glm-4.7',agent:'claude-code',host:'h1',total:620000,input:380000,output:240000,cache:80000,created:'2026-06-15T08:00:00Z',status:'completed',dailyInput:genSessionDaily(380000)},
    {id:'e7f3a1c4',model:'glm-5.2',agent:'codex',host:'h4',total:310000,input:200000,output:110000,cache:50000,created:'2026-06-14T11:00:00Z',status:'completed',dailyInput:genSessionDaily(200000)}
  ];

  /* ---- State ---- */
  var selectedHost='h1'; // host id or 'all'
  var expandedSession=null;

  function currentHostLabel(){return selectedHost==='all'?'全部主机':(hosts.find(function(h){return h.id===selectedHost})||{}).name||'MacBook-Pro'}
  function filteredSessions(){return selectedHost==='all'?sessions:sessions.filter(function(s){return s.host===selectedHost})}
  function filteredHosts(){return selectedHost==='all'?hosts:hosts.filter(function(h){return h.id===selectedHost})}

  /* ---- Host Menu ---- */
  function buildHostMenu(){
    var menu=document.getElementById('host-select-menu');
    var html='<button class="'+('all'===selectedHost?'active':'')+'" data-id="all"><span class="dot all"></span>全部主机</button>';
    hosts.forEach(function(h){
      html+='<button class="'+(h.id===selectedHost?'active':'')+'" data-id="'+h.id+'"><span class="dot '+(h.online?'online':'')+'"></span>'+h.name+'</button>';
    });
    menu.innerHTML=html;
    menu.querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){selectHost(b.dataset.id)})});
  }
  function toggleHostMenu(){var m=document.getElementById('host-select-menu');m.classList.toggle('open')}
  function selectHost(id){selectedHost=id;document.getElementById('host-select-label').textContent=currentHostLabel();document.getElementById('host-select-menu').classList.remove('open');buildHostMenu();refreshAll()}
  document.addEventListener('click',function(e){if(!e.target.closest('.host-select-wrap'))document.getElementById('host-select-menu').classList.remove('open')})
  buildHostMenu();

  /* ---- Refresh ---- */
  function refreshAll(){renderOverview();renderMetrics();renderBarChart();renderDonut();renderHeatmap();renderDetailTable()}

  /* ---- Overview ---- */
  function renderOverview(){
    function dayTotal(i){var d=days30[i];return d?d.input+d.output:0}
    var todayVal=dayTotal(29),yesterdayVal=dayTotal(28);
    var thisWeekVal=days30.slice(23).reduce(function(s,d){return s+d.input+d.output},0);
    var lastWeekVal=days30.slice(16,23).reduce(function(s,d){return s+d.input+d.output},0);
    var todayTrend=yesterdayVal>0?((todayVal-yesterdayVal)/yesterdayVal*100):0;
    var weekTrend=lastWeekVal>0?((thisWeekVal-lastWeekVal)/lastWeekVal*100):0;
    function trendHTML(val,abs){
      if(Math.abs(abs)<0.5)return'<div class="tk-trend">— 持平</div>';
      return'<div class="tk-trend '+(val>=0?'up':'down')+'">'+(val>=0?'↑':'↓')+' '+Math.abs(val).toFixed(1)+'% 较'+(abs===todayTrend?'昨日':'上周')+'</div>';
    }
    document.getElementById('token-strip').innerHTML=
      '<div class="tk-item"><div class="tk-num">'+fmt(totalTokens)+'</div><div class="tk-label">总消耗</div></div>'+
      '<div class="tk-item"><div class="tk-num">'+fmt(todayVal)+'</div><div class="tk-label">今日消耗</div>'+trendHTML(todayTrend,todayTrend)+'</div>'+
      '<div class="tk-item"><div class="tk-num">'+fmt(thisWeekVal)+'</div><div class="tk-label">近 7 天消耗</div>'+trendHTML(weekTrend,weekTrend)+'</div>'+
      '<div class="tk-item"><div class="tk-num">'+fmt(totalTokens)+'</div><div class="tk-label">近 30 天消耗</div></div>';
    document.getElementById('host-summary').innerHTML='近 30 天 · '+(selectedHost==='all'?'全部主机':'主机: '+currentHostLabel())+' · 共 <span class="text-mono">'+fmt(totalRequests)+'</span> 次请求';
  }

  /* ---- Metrics ---- */
  function renderMetrics(){
    var topModel=models.reduce(function(a,b){return a.input>b.input?a:b},{input:0});
    var grid=document.getElementById('metric-grid');
    var cards=[
      {label:'输入量 (Input)',value:fmt(totalInput),sub:'含 '+fmt(totalCache)+' cache 命中 · <span>'+Math.round(totalCache/totalInput*100)+'%</span>'},
      {label:'输出量 (Output)',value:fmt(totalOutput),sub:'平均 '+fmt(Math.round(totalOutput/totalRequests))+' / 请求'},
      {label:'Cache 命中量',value:fmt(totalCache),sub:'命中率 <span>'+Math.round(totalCache/totalInput*100)+'%</span>'},
      {label:'请求次数',value:fmt(totalRequests),sub:'日均 '+Math.round(totalRequests/30)+' 次'},
      {label:'活跃会话',value:''+filteredSessions().length,sub:'近 30 天有 Token 的会话'},
      {label:'最常用模型',value:topModel.name||'glm-5.2',sub:'占输入量 <span>'+Math.round(topModel.input/totalInput*100)+'%</span>'}
    ];
    grid.innerHTML=cards.map(function(c){return'<div class="metric-card"><div class="mc-label">'+c.label+'</div><div class="mc-value">'+c.value+'</div>'+(c.sub?'<div class="mc-sub">'+c.sub+'</div>':'')+'</div>'}).join('');
  }

  /* ---- Bar Chart ---- */
  function renderBarChart(){
    var chart=document.getElementById('bar-chart'),labels=document.getElementById('bar-labels');
    var max=0;days30.forEach(function(d){max=Math.max(max,d.input)});
    var now=new Date(),cH='',lH='';
    for(var i=0;i<30;i++){var d=days30[i];var date=new Date(now.getFullYear(),now.getMonth(),now.getDate()-29+i);var ds=date.getFullYear()+'-'+('0'+(date.getMonth()+1)).slice(-2)+'-'+('0'+date.getDate()).slice(-2);var show=i%7===0||i===29;var hIn=Math.max(2,(d.input/max)*160),hOut=Math.max(2,(d.output/max)*160);
      cH+='<div class="bar-day" data-date="'+ds+'" data-input="'+d.input+'" data-output="'+d.output+'" data-cache="'+d.cacheHit+'" data-requests="'+d.requests+'"><div class="bar-col output" style="height:'+hOut+'px" title="输出 '+fmt(d.output)+'"></div><div class="bar-col input" style="height:'+hIn+'px" title="输入 '+fmt(d.input)+'"></div></div>';
      lH+='<span'+(show?' class="show"':'')+'>'+(date.getMonth()+1)+'/'+date.getDate()+'</span>'}
    chart.innerHTML=cH;labels.innerHTML=lH;
  }

  /* ---- Donut (Ring) Chart ---- */
  function renderDonut(){
    var wrap=document.getElementById('donut-chart');
    var total=models.reduce(function(s,m){return s+m.input+m.output},0);
    var gradient=[],off=0;
    models.forEach(function(m){var pct=((m.input+m.output)/total*100);gradient.push(m.color+' '+off+'deg '+Math.round(off+pct*3.6)+'deg');off+=Math.round(pct*3.6)});
    var ring='<div class="donut-ring" style="background:conic-gradient('+gradient.join(',')+');"><div class="donut-center"><div class="dc-total">'+fmt(total)+'</div><div class="dc-label">Token 总量</div></div></div>';
    var legend='<div class="donut-legend">'+models.map(function(m){var pct=Math.round((m.input+m.output)/total*100);return'<div class="dl-item"><span class="dl-swatch" style="background:'+m.color+';"></span>'+m.name+' '+pct+'%</div>'}).join('')+'</div>';
    wrap.innerHTML=ring+legend;
  }

  /* ---- Heatmap ---- */
  function renderHeatmap(){
    var heatmap=document.getElementById('heatmap'),cols=39,maxVal=0,html='',now=new Date(),total=days30.length;
    for(var w=0;w<cols;w++)for(var d=0;d<7;d++){var offset=(cols-1-w)*7+(6-d);if(offset>=total)continue;var day=days30[total-1-offset];if(!day)continue;var val=day.input+day.output;if(val>maxVal)maxVal=val}
    for(var w=0;w<cols;w++){
      html+='<div class="heatmap-col">';
      for(var d=0;d<7;d++){var offset=(cols-1-w)*7+(6-d);if(offset>=total){html+='<div class="heatmap-cell"></div>';continue}var day=days30[total-1-offset];if(!day){html+='<div class="heatmap-cell"></div>';continue}var val=day.input+day.output,lv=0;if(maxVal>0){var p=val/maxVal;if(p>0.75)lv=4;else if(p>0.5)lv=3;else if(p>0.25)lv=2;else lv=1}var cd=new Date(now.getFullYear(),now.getMonth(),now.getDate()-offset);var cds=cd.getFullYear()+'-'+('0'+(cd.getMonth()+1)).slice(-2)+'-'+('0'+cd.getDate()).slice(-2);html+='<div class="heatmap-cell l'+lv+'" data-date="'+cds+'" data-input="'+day.input+'" data-output="'+day.output+'" data-requests="'+day.requests+'" title="'+fmt(val)+'"></div>'}
      html+='</div>';
    }
    heatmap.innerHTML=html;
  }

  /* ---- Detail Table ---- */
  function renderDetailTable(){
    var st=document.getElementById('session-table'),ut=document.getElementById('usage-table');
    var dt=document.getElementById('detail-title'),isAll=selectedHost==='all';
    dt.textContent=isAll?'主机维度消耗':'Session 明细';
    st.style.display=isAll?'none':'';ut.style.display=isAll?'':'none';

    if(isAll){
      ut.innerHTML='<div class="usage-table-header"><span>主机</span><span>输入量</span><span>输出量</span><span>Cache 命中</span><span>请求次数</span><span style="text-align:right;">总消耗</span></div>'+hosts.map(function(h){var t=h.input+h.output;return'<div class="usage-table-row"><span class="ut-host">'+h.name+'</span><span class="ut-num">'+fmt(h.input)+'</span><span class="ut-num">'+fmt(h.output)+'</span><span class="ut-num">'+fmt(h.cache)+'</span><span class="ut-num">'+fmt(h.requests)+'</span><span class="ut-total" style="text-align:right;">'+fmt(t)+'</span></div>'}).join('');
    }else{
      var rows=filteredSessions();
      var head='<div class="session-table-header"><span>会话 / 状态</span><span>模型</span><span>总量</span><span>输入 / 输出</span><span style="text-align:right;">时间</span></div>';
      if(!rows.length){
        st.innerHTML=head+'<div class="st-empty">该主机暂无 Token 消耗会话记录</div>';
        return;
      }
      var body=rows.map(function(s,i){
        var sid=s.id.substring(0,8), mc=modelColors[s.model]||'var(--accent)';
        var isRunning=s.status==='running';
        var isExp=expandedSession===s.id;
        var ts=s.created.substring(0,10);
        var row='<div class="session-row'+(isExp?' expanded':'')+'" onclick="toggleSession(\''+s.id+'\')">'+
          '<span class="st-name"><span class="st-expand">▶</span><span class="st-status-dot '+(isRunning?'running':'completed')+'"></span><span>'+sid+'</span></span>'+
          '<span class="st-num"><span class="st-model-dot" style="background:'+mc+';"></span>'+s.model+'</span>'+
          '<span class="st-total">'+fmt(s.total)+'</span>'+
          '<span class="st-num">'+fmt(s.input)+' / '+fmt(s.output)+'</span>'+
          '<span class="st-num" style="text-align:right;">'+ts+'</span></div>';
        var expRow='';
        if(isExp){
          var maxD=Math.max.apply(null,s.dailyInput);
          var pctIn=Math.round(s.input/s.total*100),pctOut=Math.round(s.output/s.total*100);
          var miniBars='<div class="se-mini-chart">'+s.dailyInput.map(function(v){return'<span style="height:'+Math.max(2,(v/maxD)*36)+'px;background:'+mc+';" title="'+fmt(v)+'"></span>'}).join('')+'</div>';
          expRow='<div class="session-expand-row open">'+
            '<div class="se-label" style="margin-bottom:8px;">会话详情 — <span style="color:'+mc+';font-weight:600;">'+s.model+'</span> · '+s.agent+' · '+(isRunning?'运行中':'已完成')+' · 创建于 '+ts+'</div>'+
            '<div class="se-grid">'+
              '<div class="se-item"><span class="se-label">输入量</span><span class="se-val">'+fmt(s.input)+'</span></div>'+
              '<div class="se-item"><span class="se-label">输出量</span><span class="se-val">'+fmt(s.output)+'</span></div>'+
              '<div class="se-item"><span class="se-label">输入/输出比</span><span class="se-val">'+pctIn+'% / '+pctOut+'%</span></div>'+
              '<div class="se-item"><span class="se-label">Cache 命中</span><span class="se-val">'+fmt(s.cache)+'</span></div>'+
              '<div class="se-item"><span class="se-label">总 Token</span><span class="se-val">'+fmt(s.total)+'</span></div>'+
              '<div class="se-item"><span class="se-label">日均消耗</span><span class="se-val">'+fmt(Math.round(s.total/30))+'</span></div>'+
            '</div>'+
            '<div class="se-label" style="margin:12px 0 4px;">每日 Token 消耗趋势（30 天）</div>'+miniBars+
          '</div>';
        }
        return row+expRow;
      }).join('');
      st.innerHTML=head+body;
    }
  }

  function toggleSession(id){
    expandedSession=expandedSession===id?null:id;renderDetailTable();
  }

  /* ---- Click Tooltip ---- */
  var _tooltip=null,_lastEl=null;
  function showTooltip(el,e){
    if(!_tooltip){_tooltip=document.createElement('div');_tooltip.className='chart-tooltip';document.body.appendChild(_tooltip)}
    var ds=el.dataset.date,inp=Number(el.dataset.input||0),out=Number(el.dataset.output||0),cache=Number(el.dataset.cache||0),req=Number(el.dataset.requests||0);
    _tooltip.innerHTML='<div class="ct-date">'+ds+'</div>'+
      '<div class="ct-row"><span class="ct-label">输入量</span><span class="ct-val">'+fmt(inp)+'</span></div>'+
      '<div class="ct-row"><span class="ct-label">输出量</span><span class="ct-val">'+fmt(out)+'</span></div>'+
      '<div class="ct-row"><span class="ct-label">总量</span><span class="ct-val">'+fmt(inp+out)+'</span></div>'+
      (cache?'<div class="ct-row"><span class="ct-label">Cache 命中</span><span class="ct-val">'+fmt(cache)+'</span></div>':'')+
      (req?'<div class="ct-row"><span class="ct-label">请求次数</span><span class="ct-val">'+fmt(req)+'</span></div>':'');
    _tooltip.style.left=Math.min(e.clientX+14,window.innerWidth-168)+'px';
    _tooltip.style.top=(e.clientY-14)+'px';
    _tooltip.classList.add('show');
  }
  function hideTooltip(){if(_tooltip){_tooltip.classList.remove('show');_lastEl=null}}
  document.addEventListener('click',function(e){
    var bar=e.target.closest('.bar-day');
    var heat=e.target.closest('.heatmap-cell');
    if(bar||heat){
      var el=bar||heat;
      if(!el.dataset.date)return;
      if(el===_lastEl){hideTooltip();return}
      showTooltip(el,e);_lastEl=el;
      e.stopPropagation();
    }else if(!e.target.closest('.chart-tooltip')){hideTooltip()}
  });

  /* ---- Init ---- */
  try {
    refreshAll();
  } catch (e) {
    // 错误信息展示到页面上，方便诊断
    var el = document.getElementById('host-summary') || document.body;
    el.innerHTML = '<div style="color:var(--error);padding:20px;border:1px solid var(--error);border-radius:8px;margin:16px 0;">' +
      '<strong>JS 运行时错误：</strong><br>' + e.message + '<br><br>' +
      '<span style="font-size:11px;color:var(--fg-tertiary);">' + (e.stack ? e.stack.replace(/\n/g,'<br>') : '') + '</span></div>';
    throw e;
  }
</script>
</body>
</html>
