<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pocketctl</title>
  <meta name="theme-color" content="#0d1117">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/app/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/app/icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="/app/logo-github-org.svg">
  <link rel="stylesheet" href="/src/assets/web-shared.css">
  <!-- Prevent FOUC: apply saved theme before render -->
  <script>
    (function() {
      var theme = localStorage.getItem('pocketctl-theme');
      if (theme) {
        document.documentElement.setAttribute('data-theme', theme);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script>
    window.__APP_BASE__ = location.protocol + '//' + location.host;
    window.__RELAY_WS__ = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
