<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pocketctl</title>
  <link rel="stylesheet" href="/src/assets/web-shared.css">
  <!-- Prevent FOUC: apply saved theme before render -->
  <script>
    (function() {
      var theme = localStorage.getItem('pocketctl-theme');
      if (theme) {
        document.documentElement.setAttribute('data-theme', theme);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script>window.__RELAY_WS__ = 'ws://' + location.hostname + ':8080/ws';</script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
