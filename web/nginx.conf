map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # M-8: same strict baseline as every production config (no unsafe-* in
    # script-src; the SPA has no inline scripts).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Vue SPA — 所有 /app/ 路径走 history fallback
    location /app/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /app/index.html;
    }

    # 静态资源缓存
    location /app/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /app/sw.js {
        alias /usr/share/nginx/html/sw.js;
        add_header Cache-Control "no-cache";
    }

    location = /app/sw-policy.js {
        alias /usr/share/nginx/html/sw-policy.js;
        add_header Cache-Control "no-cache";
    }

    location = /app/manifest.webmanifest {
        alias /usr/share/nginx/html/manifest.webmanifest;
        add_header Cache-Control "no-cache";
    }

    # 健康检查
    location /health {
        return 200 'ok';
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 256;
    gzip_vary on;
}
